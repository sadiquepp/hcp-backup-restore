## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running the compact playbooks from inside
## compact-cluster/ therefore does not pick up the repository root's
## ansible.cfg, so it is mirrored here - the same arrangement as
## udn-bgp-evpn/ansible.cfg.
##
## Keep the [defaults] below in step with ../ansible.cfg.
[defaults]
host_key_auto_add = True

## The compact playbooks use roles that stay in the repository's shared
## roles/ directory: setup-compact-cluster (which reuses
## setup-hub-cluster-disconnected's egress-block tasks), setup-lvm-storage,
## and the mirror-registry roles that ../setup_mirror_registry.yaml imports.
## Ansible searches ./roles/ next to the playbook, but not one level up; this
## adds it, and keeps the three system defaults that naming roles_path would
## otherwise replace.
##
## Relative to the WORKING DIRECTORY, which is why the documented way to run
## these playbooks is `cd compact-cluster` first.
roles_path = ../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
