## Renders (and, once you re-enable it, applies) the HostedCluster/
## NodePool/ManagedCluster/KlusterletAddonConfig bundle for an
## Agent-platform hosted cluster. Requires AgentServiceConfig and
## bminfra already applied and working - a HostedCluster on Agent
## platform can't provision nodes without both.
##
## Renders one bundle per entry in vars.yaml's hosted_clusters list:
##   ansible-playbook create_hosted_cluster.yaml --ask-vault-pass
##
## A second, concurrent hosted cluster on the same hub is just another
## entry in that list - it can reuse the same networking CIDRs, since those
## are internal to each hosted cluster's own data plane. Add per-cluster
## keys only to override a hosted_cluster_* default:
##   hosted_clusters:
##     - hcp-cluster1
##     - hcp-cluster2
##     - name: hcp-cluster3
##       nodepool_replicas: 3
##
## To render just one of them:
##   ansible-playbook create_hosted_cluster.yaml --ask-vault-pass \
##     -e hcp_cluster_name=hcp-cluster2
##
## Disconnected: pass the same disconnected_install flag the rest of the
## disconnected flow uses (or set it in vars.yaml) and the same role renders
## each bundle against the mirror registry instead - a '<cluster>-user-ca-bundle'
## ConfigMap wired into the HostedCluster's proxy.trustedCA and
## additionalTrustBundle, a spec.imageContentSources map that includes the
## registry.redhat.io/multicluster-engine redirection the Agent platform needs,
## and a pull secret holding only the mirror registry's credentials:
##   ansible-playbook create_hosted_cluster.yaml --ask-vault-pass \
##     -e disconnected_install=true
## Requires setup_mirror_registry.yaml to have run (that is what puts the
## registry CA and a podman login on this host). Individual clusters can opt in
## or out with 'disconnected: true|false' on their hosted_clusters entry.

- name: Create Hosted Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  vars:
    hub_kubeconfig: >-
      {{ (target_hub == 'hub2') | ternary(hub2_install_folder, hub_install_folder) }}/auth/kubeconfig
  tasks:
  - name: Fail fast if required inputs are missing
    ansible.builtin.assert:
      that:
        - (hosted_clusters | default([]) | length > 0) or hcp_cluster_name is defined
        - pull_secret is defined
        - ssh_key is defined
      fail_msg: >-
        Define hosted_clusters in vars.yaml (or pass -e hcp_cluster_name=<name>
        to render a single cluster), and make sure pull_secret/ssh_key are
        defined in vault.yaml.

  - ansible.builtin.import_role:
      name: create-hosted-cluster
    environment:
      KUBECONFIG: "{{ hub_kubeconfig }}"
