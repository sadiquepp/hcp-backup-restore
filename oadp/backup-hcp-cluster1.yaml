apiVersion: velero.io/v1
kind: Backup
metadata:
  name: hcp-cluster1-backup
  namespace: openshift-adp
  labels:
    velero.io/storage-location: default
    spec:
  hooks: {}
  includedNamespaces:
  - hcp-cluster1
  - hcp-cluster1-hcp-cluster1
  - bminfra
  includedResources:
  - sa
  - role
  - rolebinding
  - pod
  - pvc
  - pv
  - bmh
  - configmap
  - infraenv
  - priorityclasses
  - pdb
  - agents
  - hostedcluster
  - nodepool
  - secrets
  - services
  - deployments
  - statefulsets
  - hostedcontrolplane
  - cluster
  - agentcluster
  - agentmachinetemplate
  - agentmachine
  - machinedeployment
  - machineset
  - machine
  - route
  - clusterdeployment
  excludedResources: []
  defaultVolumesToFsBackup: true
  storageLocation: default
  ttl: 2h30m0s