# ── Restore (CSI data mover) ──────────────────────────────────────────────────
# Restores the namespace from hello-openshift-oadp-csi-backup. Apply this
# ONLY when you want to restore - not alongside the Backup CR.
#
# On the DR hub the namespace does not exist yet, so this is a clean
# restore. Restoring onto the hub that took the backup means deleting the
# namespace (or at least the Deployment and PVC) first:
# existingResourcePolicy: update cannot rewrite a bound PVC's immutable
# fields.
#
# restorePVs: true is what starts the recovery. For a data-mover backup
# Velero provisions a fresh PVC from the StorageClass and streams the
# snapshot data back from S3 into it via a DataDownload - the Restore
# stays in WaitingForPluginOperations until that finishes:
#   oc get datadownloads -n openshift-adp -w
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: hello-openshift-oadp-csi-restore
  namespace: openshift-adp
spec:
  backupName: hello-openshift-oadp-csi-backup

  includedNamespaces:
    - hello-openshift-oadp-csi
  includedResources:
    - "*"

  restorePVs: true
  existingResourcePolicy: update
  preserveNodePorts: true
