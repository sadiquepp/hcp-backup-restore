apiVersion: v1
kind: Namespace
metadata:
  name: hello-openshift-oadp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-openshift-oadp-pvc
  namespace: hello-openshift-oadp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvms-vg1        # change to match your cluster's StorageClass
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-openshift-oadp
  namespace: hello-openshift-oadp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-openshift-oadp
  template:
    metadata:
      labels:
        app: hello-openshift-oadp
    spec:
      containers:
        - name: hello-openshift-oadp
          image: quay.io/openshift/origin-hello-openshift
          ports:
            - containerPort: 8888
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hello-openshift-oadp-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hello-openshift-oadp
  namespace: hello-openshift-oadp
spec:
  selector:
    app: hello-openshift-oadp
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hello-openshift-oadp
  namespace: hello-openshift-oadp
spec:
  to:
    kind: Service
    name: hello-openshift-oadp
  port:
    targetPort: 8888
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect