---
# defaults file for create-hosted-cluster
#
# These are overridden by the matching vars in vars.yaml's
# "create-hosted-cluster" section - edit values there, not here.
# Kept here only as fallbacks if this role is ever used without vars.yaml.

# One entry per hosted cluster - see vars.yaml, which is where this is
# meant to be set. Empty here so the role fails loudly rather than
# rendering something unexpected if vars.yaml isn't loaded.
hosted_clusters: []

hosted_cluster_clusterset: default
hosted_cluster_channel: fast-4.21
# Keep in sync with roles/setup-hub-acm's agent_service_os_images list -
# this must correspond to one of those openshiftVersion entries or the
# release image and the available discovery ISOs will be mismatched.
hosted_cluster_release_image: "quay.io/openshift-release-dev/ocp-release@sha256:05e69ed54453e3d306b136f52493073073b207f57d0562fe1c8a555bde61aa49"

# clusterNetwork/serviceNetwork CIDRs. Internal to each hosted cluster's
# own OVN-Kubernetes data plane, so concurrent hosted clusters on the same
# hub can all use these same values. Keep them clear of the lab/machine
# network the worker VMs sit on. Override per-cluster in a hosted_clusters
# entry when a cluster genuinely needs its own range:
#   - name: hcp-cluster3
#     cluster_cidr: 10.136.0.0/14
#     service_cidr: 172.32.0.0/16
hosted_cluster_cluster_cidr: 10.132.0.0/14
hosted_cluster_service_cidr: 172.31.0.0/16

hosted_cluster_availability_policy: HighlyAvailable
hosted_cluster_olm_catalog_placement: management
hosted_cluster_nodepool_replicas: 2

hosted_cluster_addon_application_manager: true
hosted_cluster_addon_policy_controller: true
hosted_cluster_addon_search_collector: true
hosted_cluster_addon_cert_policy_controller: true
