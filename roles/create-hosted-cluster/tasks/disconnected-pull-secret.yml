---
# Reduces vault's pull_secret down to the mirror registry's own credentials for
# a disconnected hosted cluster, the same way roles/setup-hub-cluster-disconnected
# does for the hub's install-config.yaml.
#
# mirror_registry_authfile is /root/.docker/config.json - the host's shared
# podman/docker config, not a file private to this lab.
# roles/setup-mirror-registry-trust runs `podman login --authfile` against it,
# so it holds the mirror registry's entry *merged into* whatever the host
# already had for quay.io, registry.redhat.io, cloud.openshift.com and friends.
# Handing all of that to a hosted cluster would give its nodes a working route
# back to the real registries, so a pull the mirror is missing could still
# succeed - and the cluster would be disconnected only by accident.
#
# Set hosted_cluster_disconnected_pull_secret false to skip this and render
# vault's pull_secret unchanged.

- name: Read the mirror registry authfile
  ansible.builtin.slurp:
    src: "{{ mirror_registry_authfile }}"
  register: hcp_mirror_authfile_b64
  become: true

- name: Work out which authfile entry belongs to the mirror registry
  ansible.builtin.set_fact:
    hcp_mirror_registry_host: "{{ mirror_registry_domain }}:{{ mirror_registry_port }}"
    hcp_authfile_auths: "{{ (hcp_mirror_authfile_b64.content | b64decode | from_json).auths | default({}, true) }}"
  no_log: true

- name: Fail if the host is not logged in to the mirror registry
  ansible.builtin.assert:
    that:
      - hcp_mirror_registry_host in hcp_authfile_auths
    fail_msg: >-
      {{ mirror_registry_authfile }} has no credentials for
      {{ hcp_mirror_registry_host }} - it holds entries for
      [{{ hcp_authfile_auths.keys() | list | join(', ') }}].
      roles/setup-mirror-registry-trust is what logs podman in there, so run
      setup_mirror_registry.yaml first.

# Serialised with to_json in the template rather than pasted as raw file text:
# Red Hat pull secrets carry "email" fields, and an apostrophe in one is enough
# to close a single-quoted YAML scalar early and break the rendered bundle.
- name: Reduce the pull secret to the mirror registry's own credentials
  ansible.builtin.set_fact:
    hosted_cluster_disconnected_pull_secret_content:
      auths: "{{ {hcp_mirror_registry_host: hcp_authfile_auths[hcp_mirror_registry_host]} }}"
  no_log: true
