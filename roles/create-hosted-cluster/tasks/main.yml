---
# Tasks file for create-hosted-cluster
#
# Renders the HostedCluster/Secrets/NodePool/ManagedCluster/
# KlusterletAddonConfig bundle once per entry in hosted_clusters (see
# vars.yaml). Two templates drive all of them - hosted-cluster.yaml.j2 and
# hosted-cluster-disconnected.yaml.j2, picked per cluster below. To add another
# hosted cluster, add a name to that list, not a new template.
#
# Each entry is either a bare name:
#   hosted_clusters:
#     - hcp-cluster1
# or a dict whose extra keys override the hosted_cluster_* defaults for
# that cluster only:
#   hosted_clusters:
#     - hcp-cluster1
#     - name: hcp-cluster2
#       nodepool_replicas: 3
#
# Passing -e hcp_cluster_name=<name> still works: it renders just that
# one cluster (using its hosted_clusters entry if it has one).
#
# This is the most consequential apply in the whole chain (it's what
# actually starts node provisioning), so - matching how AgentServiceConfig
# and bminfra are handled - apply starts out commented pending manual
# review.
#
# Depends on AgentServiceConfig and bminfra already being applied and
# confirmed working (roles/setup-hub-acm, roles/setup-bminfra) - a
# HostedCluster on Agent platform can't provision nodes without both.
#
# Disconnected runs use the same list of clusters but a separate template - see
# the block below 'Fail fast if there is nothing to render', and the
# "Disconnected rendering" section of defaults/main.yml.

- name: Normalise hosted_clusters into a list of dicts
  ansible.builtin.set_fact:
    hosted_cluster_specs: >-
      {{ hosted_cluster_specs | default([])
         + [ (item is mapping) | ternary(item, {'name': item}) ] }}
  loop: "{{ hosted_clusters | default([]) }}"
  loop_control:
    label: "{{ (item is mapping) | ternary(item.name | default('<unnamed>'), item) }}"

# -e hcp_cluster_name=<name> narrows the run to a single cluster. If that
# name is in hosted_clusters its per-cluster overrides are kept; if it
# isn't, it's rendered from the hosted_cluster_* defaults alone (which is
# how this role behaved before hosted_clusters existed).
- name: Restrict to hcp_cluster_name when one was passed on the command line
  ansible.builtin.set_fact:
    hosted_cluster_specs: >-
      {{ (hosted_cluster_specs | default([])
          | selectattr('name', 'eq', hcp_cluster_name) | list)
         or [{'name': hcp_cluster_name}] }}
  when: hcp_cluster_name is defined

- name: Fail fast if there is nothing to render
  ansible.builtin.assert:
    that:
      - hosted_cluster_specs | default([]) | length > 0
      - hosted_cluster_specs | rejectattr('name', 'defined') | list | length == 0
    fail_msg: >-
      No hosted clusters to render. Define hosted_clusters in vars.yaml
      (a list of names, or of dicts each with a 'name' key), or pass
      -e hcp_cluster_name=<name>.

# Disconnected rendering hangs off the same disconnected_install flag as the
# rest of the disconnected flow (setup_mirror_registry.yaml,
# setup_hub_cluster_disconnected.yaml, setup-hub-acm), and a single cluster can
# opt in or out with 'disconnected' on its hosted_clusters entry:
#   hosted_clusters:
#     - name: hcp-cluster3
#       disconnected: false
# The inputs it needs (the mirror registry's CA and credentials) are read once
# here rather than once per cluster.
- name: Work out which clusters are being rendered disconnected
  ansible.builtin.set_fact:
    hosted_cluster_disconnected_specs: >-
      {{ hosted_cluster_specs
         | selectattr('disconnected', 'defined') | selectattr('disconnected') | list
         + (hosted_cluster_specs | rejectattr('disconnected', 'defined') | list
            if disconnected_install | bool else []) }}

- name: Note which cluster names render disconnected
  ansible.builtin.set_fact:
    hosted_cluster_disconnected_names: "{{ hosted_cluster_disconnected_specs | map(attribute='name') | list }}"

- name: Gather the mirror registry inputs for disconnected rendering
  ansible.builtin.include_tasks: disconnected-inputs.yml
  when: hosted_cluster_disconnected_specs | length > 0

- name: Say which clusters are being rendered disconnected
  ansible.builtin.debug:
    msg: >-
      Rendering
      {{ hosted_cluster_disconnected_specs | map(attribute='name') | join(', ') }}
      against the mirror registry at
      {{ mirror_registry_domain }}:{{ mirror_registry_port }} - each gets a
      '<name>-user-ca-bundle' ConfigMap (referenced from the HostedCluster's
      proxy.trustedCA and additionalTrustBundle) and an imageContentSources
      list redirecting the release payload and registry.redhat.io/multicluster-engine
      to that registry.
  when: hosted_cluster_disconnected_specs | length > 0

# Every cluster needs a MetalLB pool: it is what the metallb.io/address-pool
# annotation on the HostedCluster names, and - via that pool's single address
# and serviceAllocation - what keeps the cluster's kube-apiserver VIP on the
# address roles/setup-dns publishes as api/api-int. Checked here so a missing
# entry is an obvious message rather than an undefined-key error inside the
# template.
- name: Fail fast if a hosted cluster has no MetalLB pool
  ansible.builtin.assert:
    that:
      - item.metallb_pool is defined
        or item.name in (hosted_cluster_metallb_pools | default({}))
    fail_msg: >-
      Hosted cluster '{{ item.name }}' has no entry in
      hosted_cluster_metallb_pools (vars.yaml). Add one giving it its own
      single-address MetalLB pool, e.g.
      "{{ item.name }}: {ip: 63, pool: {{ item.name }}-api-pool}", and re-run
      setup-hub-acm (MetalLB pools) and setup-dns (api/api-int records) so the
      pool and the DNS records are created together. Setting 'metallb_pool' on
      the hosted_clusters entry itself also satisfies this.
  loop: "{{ hosted_cluster_specs }}"
  loop_control:
    label: "{{ item.name }}"

# Connected and disconnected are two separate templates rather than one with
# conditionals, matching how roles/setup-hub-acm keeps its disconnected
# AgentServiceConfig separate. They share the NodePool/ManagedCluster/
# KlusterletAddonConfig tail - change one, check the other.
- name: Render hosted cluster bundles
  ansible.builtin.template:
    src: >-
      {{ (hcp.name in hosted_cluster_disconnected_names)
         | ternary('hosted-cluster-disconnected.yaml.j2', 'hosted-cluster.yaml.j2') }}
    dest: "{{ role_path }}/templates/.rendered-{{ hcp.name }}.yaml"
  loop: "{{ hosted_cluster_specs }}"
  loop_control:
    label: >-
      {{ hcp.name }}
      ({{ (hcp.name in hosted_cluster_disconnected_names) | ternary('disconnected', 'connected') }})
  vars:
    hcp: "{{ item }}"

# REVIEW-BEFORE-APPLY: rendered bundles are left in place at the paths
# shown below - inspect them, then re-enable this task once you've
# manually validated them AND confirmed AgentServiceConfig/bminfra are
# already applied and working.
# - name: Apply hosted cluster bundles
#   ansible.builtin.shell: |
#     oc apply -f "{{ role_path }}/templates/.rendered-{{ item.name }}.yaml"
#   loop: "{{ hosted_cluster_specs }}"
#   loop_control:
#     label: "{{ item.name }}"

- name: Hosted cluster apply is disabled pending manual review
  ansible.builtin.debug:
    msg: >-
      Apply is commented out - review
      {{ hosted_cluster_specs
         | map(attribute='name')
         | map('regex_replace', '^', role_path ~ '/templates/.rendered-')
         | map('regex_replace', '$', '.yaml')
         | join(', ') }}
      then re-enable the 'Apply hosted cluster bundles' task in
      roles/create-hosted-cluster/tasks/main.yml (only after
      AgentServiceConfig and bminfra are confirmed working).

