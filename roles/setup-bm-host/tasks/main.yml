---
# Start with Installing the required packages on the Host

- name: Install Basic Required Packages.
  yum:
    name: "{{ basic_packages }}"
    state: installed

# Once Packages are installed, lets start the Libvirt Service
- name: Start Libvirtd Service
  systemd:
    state: started
    name: libvirtd
    enabled: yes


# Once Check if Key Exists
- name: Check the SSH KeyPair Existence
  stat:
    path: "~/.ssh/lab_rsa"
  register: ssh_key_status
  tags:
    - ssh

# Create Key if not existing
- name: Create SSH Key if not existing
  community.crypto.openssh_keypair:
    path: "~/.ssh/lab_rsa"
    type: rsa
    size: 2048
    mode: '0600'
  when: ssh_key_status.stat.exists == false 
  tags:
    - ssh

# Enable Nested KVM
- name: Enable Nested KVM
  copy:
    dest: /etc/modprobe.d/kvm-nested.conf
    content: |
      options kvm-intel nested=1

# Prepare the KVM Image 
- name: Remove Cloud-Init & Add Password  
  shell: | 
    export LIBGUESTFS_BACKEND=direct && virt-customize -a "{{ role_path }}/files/{{ rhel9_kvm_image }}" --root-password password:redhat --ssh-inject "root:file:/root/.ssh/lab_rsa.pub" --selinux-relabel --run-command 'yum remove cloud-init* -y' --run-command 'echo "PermitRootLogin yes" >>/etc/ssh/sshd_config'
    

# Once Check if Key Exists
- name: Check the Helper Disk Existence
  stat:
    path: "/var/lib/libvirt/images/{{ helper_disk }}"
  register: helper_disk_status
  tags:
    - virt
   
# Prepare the Helper Image
#
# The RHEL9 base image is only 10G, and the helper is not just DNS/HAProxy -
# its httpd serves the PXE rootfs and, on a disconnected hub, the RHCOS live
# ISOs the AgentServiceConfig points at (roles/setup-hub-acm stages them in
# /var/www/html/bootp, ~1.3G each). 10G runs out part-way through that copy,
# so the base image is expanded into a helper_disk_size disk instead of being
# copied as-is. Same offline virt-resize pattern as setup-minio-vm and
# setup-ceph-vm; the qcow2 is sparse, so the larger size costs nothing until
# it is used.
#
# This only applies to a helper that does not exist yet. An existing 10G
# helper is left alone - delete its disk and re-run this play to rebuild it at
# the new size, or grow it in place with qemu-img resize + growpart/xfs_growfs.
- name: Create Helper VM Disk ({{ helper_disk_size }}, sparse, no preallocation)
  ansible.builtin.command:
    cmd: "qemu-img create -f qcow2 /var/lib/libvirt/images/{{ helper_disk }} {{ helper_disk_size }}"
  when: helper_disk_status.stat.exists == false
  tags:
  - virt

- name: Expand base RHEL9 image into the new helper disk (virt-resize)
  ansible.builtin.command:
    cmd: >
      virt-resize --expand {{ helper_resize_partition }}
      {{ role_path }}/files/{{ rhel9_kvm_image }}
      /var/lib/libvirt/images/{{ helper_disk }}
  when: helper_disk_status.stat.exists == false
  tags:
  - virt


- name: Deploy modified default-network.xml
  template:
    src: default-network.xml.j2
    dest: /tmp/default-network.xml 
  tags:
  - virtnet

- name: Delete the default network and deploy from template
  shell: |
    virsh net-destroy default && virsh net-undefine default && virsh net-define /tmp/default-network.xml && virsh net-start default && virsh net-autostart default 
  tags:
  - virtnet


- name: Check if VM is running using virsh
  shell: "virsh dominfo helper| grep 'State' | awk '{print $2}'"
  register: vm_state
  tags:
  - virt

- name: Define the Helper VM 
  shell: |
    virt-install \
    --import \
    --name "{{ helper_name }}" \
    --memory "{{ helper_memory }}" \
    --vcpus "{{ helper_vcpus }}" \
    --disk "/var/lib/libvirt/images/{{ helper_disk }}",format=qcow2,cache=none,bus=virtio \
    --os-variant=rhel9.5 \
    --memballoon model=virtio,freePageReporting=on \
    --noautoconsole \
    --network network:default,mac=52:54:00:e2:54:{{ip_list.helper_server}}
  when: vm_state.stdout == ''
  tags:
  - virt

- name: Wait for the VM to boot
  shell: |
    sleep 30s

- name: Install VBMC 
  shell: pip install virtualbmc

