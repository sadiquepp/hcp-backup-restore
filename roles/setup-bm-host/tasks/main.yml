---
# Start with Installing the required packages on the Host

# tags: [baseimage] because guestfs-tools - which provides the virt-customize
# that prepares the base image below - is in basic_packages. Without this a
# standalone --tags baseimage run fails on a host that has never been set up.
#
# tags: [labprereq] is the SMALLER subset that udn-bgp-evpn's image build
# needs: virt-customize and the lab ssh key, WITHOUT the in-place
# preparation below. That build prepares its own copy, so it must not depend
# on this image having been touched.
- name: Install Basic Required Packages.
  yum:
    name: "{{ basic_packages }}"
    state: installed
  tags:
    - baseimage
    - labprereq

# Once Packages are installed, lets start the Libvirt Service
- name: Start Libvirtd Service
  systemd:
    state: started
    name: libvirtd
    enabled: yes


# Once Check if Key Exists
- name: Check the SSH KeyPair Existence
  stat:
    path: "~/.ssh/lab_rsa"
  register: ssh_key_status
  tags:
    - ssh
    - baseimage
    - labprereq

# Create Key if not existing
- name: Create SSH Key if not existing
  community.crypto.openssh_keypair:
    path: "~/.ssh/lab_rsa"
    type: rsa
    size: 2048
    mode: '0600'
  when: ssh_key_status.stat.exists == false
  tags:
    - ssh
    - baseimage
    - labprereq

# Enable Nested KVM
- name: Enable Nested KVM
  copy:
    dest: /etc/modprobe.d/kvm-nested.conf
    content: |
      options kvm-intel nested=1

# Prepare the KVM Image
#
# This edits base_image_dir/rhel9_kvm_image IN PLACE - it is the one place in
# this repository that does. Every guest of every flow is a copy or a
# virt-resize of the result, so it has to happen before any of them, and
# before udn-bgp-evpn/build-lab-image.yaml copies it to build the customized
# lab image.
#
# This is for the guests built DIRECTLY from this image - the helper, and
# every VM of the hub, hosted-cluster, Ceph, MinIO and mirror-registry flows.
# udn-bgp-evpn's customized lab image does NOT depend on it: that build
# applies the same preparation to its own copy, so it can run on a pristine
# base image and in any order relative to this play.
- name: Check whether the base image has already been prepared
  ansible.builtin.command:
    cmd: "virt-cat -a {{ base_image_dir }}/{{ rhel9_kvm_image }} /root/.ssh/authorized_keys"
  register: base_image_authkeys
  changed_when: false
  failed_when: false
  tags:
    - baseimage

- name: Read the lab public key
  ansible.builtin.slurp:
    src: "{{ lab_ssh_pubkey_path | default('/root/.ssh/lab_rsa.pub') }}"
  register: lab_pubkey
  tags:
    - baseimage

# Re-run only when the image does not already carry THIS key. Two reasons to
# compare the content rather than just test for the file: the step is no
# longer run exactly once (the image build runs it too), and rotating
# lab_rsa has to still take effect.
# The root password is OPTIONAL, and unset is now the default - it used to be
# the literal 'redhat' here. Nothing in this repository logs into a guest
# with a password: every play reaches them with the key injected below. What
# a password buys is console access (virsh console, VNC) to a guest whose
# networking is broken. Set lab_root_password in vault.yaml to keep it.
#
# passwd -u -f unlocks root unconditionally. A stock RHEL cloud image ships
# root locked, and --root-password used to unlock it as a side effect of
# setting one; without that side effect the lock would remain, and whether
# key-based root login still works past it is an image-and-PAM detail rather
# than something to leave to chance on twenty hosts. -f because passwd
# refuses to unlock an account that has no password at all.
#
# no_log: the command line carries lab_root_password when one is set.
#
# DO NOT wrap the lines below. This is a YAML folded scalar (>-), which joins
# lines with spaces EXCEPT where a continuation is indented further - those
# keep their newline. A newline lands in the middle of the shell command and
# splits it in two, so `virt-customize -a IMAGE` runs with no options at all
# and the rest becomes a second command that does not exist. Caught exactly
# that way when the optional-password conditional was first written across
# two lines.
- name: Remove Cloud-Init, inject the lab key, optionally set a root password
  ansible.builtin.shell:
    cmd: >-
      export LIBGUESTFS_BACKEND=direct &&
      virt-customize -a "{{ base_image_dir }}/{{ rhel9_kvm_image }}"
      {{ '--root-password "password:' + lab_root_password + '"' if lab_root_password is defined else '' }}
      --ssh-inject "root:file:{{ lab_ssh_pubkey_path | default('/root/.ssh/lab_rsa.pub') }}"
      --selinux-relabel
      --run-command 'yum remove cloud-init* -y'
      --run-command 'passwd -u -f root || true'
      --run-command 'grep -q "^PermitRootLogin yes" /etc/ssh/sshd_config || echo "PermitRootLogin yes" >>/etc/ssh/sshd_config'
  no_log: "{{ lab_root_password is defined }}"
  when: >-
    base_image_authkeys.rc != 0 or
    (lab_pubkey.content | b64decode | trim) not in
    (base_image_authkeys.stdout | default(''))
  tags:
    - baseimage


# Once Check if Key Exists
- name: Check the Helper Disk Existence
  stat:
    path: "/var/lib/libvirt/images/{{ helper_disk }}"
  register: helper_disk_status
  tags:
    - virt
   
# Prepare the Helper Image
#
# The RHEL9 base image is only 10G, and the helper is not just DNS/HAProxy -
# its httpd serves the PXE rootfs and, on a disconnected hub, the RHCOS live
# ISOs the AgentServiceConfig points at (roles/setup-hub-acm stages them in
# /var/www/html/bootp, ~1.3G each). 10G runs out part-way through that copy,
# so the base image is expanded into a helper_disk_size disk instead of being
# copied as-is. Same offline virt-resize pattern as setup-minio-vm and
# setup-ceph-vm; the qcow2 is sparse, so the larger size costs nothing until
# it is used.
#
# This only applies to a helper that does not exist yet. An existing 10G
# helper is left alone - delete its disk and re-run this play to rebuild it at
# the new size, or grow it in place with qemu-img resize + growpart/xfs_growfs.
- name: Create Helper VM Disk ({{ helper_disk_size }}, sparse, no preallocation)
  ansible.builtin.command:
    cmd: "qemu-img create -f qcow2 /var/lib/libvirt/images/{{ helper_disk }} {{ helper_disk_size }}"
  when: helper_disk_status.stat.exists == false
  tags:
  - virt

- name: Expand base RHEL9 image into the new helper disk (virt-resize)
  ansible.builtin.command:
    cmd: >
      virt-resize --expand {{ helper_resize_partition }}
      {{ base_image_dir }}/{{ customized_lab_helper_image | default(rhel9_kvm_image) }}
      /var/lib/libvirt/images/{{ helper_disk }}
  when: helper_disk_status.stat.exists == false
  tags:
  - virt


- name: Deploy modified default-network.xml
  template:
    src: default-network.xml.j2
    dest: /tmp/default-network.xml 
  tags:
  - virtnet

- name: Delete the default network and deploy from template
  shell: |
    virsh net-destroy default && virsh net-undefine default && virsh net-define /tmp/default-network.xml && virsh net-start default && virsh net-autostart default 
  tags:
  - virtnet


- name: Check if VM is running using virsh
  shell: "virsh dominfo helper| grep 'State' | awk '{print $2}'"
  register: vm_state
  tags:
  - virt

- name: Define the Helper VM 
  shell: |
    virt-install \
    --import \
    --name "{{ helper_name }}" \
    --memory "{{ helper_memory }}" \
    --vcpus "{{ helper_vcpus }}" \
    --disk "/var/lib/libvirt/images/{{ helper_disk }}",format=qcow2,cache=none,bus=virtio \
    --os-variant=rhel9.5 \
    --memballoon model=virtio,freePageReporting=on \
    --noautoconsole \
    --network network:default,mac=52:54:00:e2:54:{{ip_list.helper_server}}
  when: vm_state.stdout == ''
  tags:
  - virt

- name: Wait for the VM to boot
  shell: |
    sleep 30s

- name: Install VBMC 
  shell: pip install virtualbmc

