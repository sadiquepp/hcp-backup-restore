---
# defaults file for setup-bminfra
bminfra_location: singapore
## Standalone fallback only - vars.yaml sets this to ocp_major_version, so bump
## that one number rather than this literal.
bminfra_ocp_version: '4.21'

## Gates the disconnected rendering below. setup_mirror_registry.yaml and
## setup_hub_cluster.yaml are what make it meaningful; set it in
## vars.yaml or pass -e disconnected_install=true. Repeated here so the role
## still evaluates standalone.
disconnected_install: false

## What templates/02-pullsecret.yaml.j2 encodes into the InfraEnv's pull-secret,
## as a JSON string. Connected runs use vault.yaml's pull_secret unchanged;
## disconnected runs overwrite this with the mirror registry's own credentials
## in tasks/disconnected-pull-secret.yml (a set_fact, which wins over this
## default) - see that file for why the vault secret is wrong there.
##
## The filters are load-bearing, not decoration - a bare "{{ pull_secret }}"
## here is what produced this at oc apply time:
##
##   The Secret "pullsecret-bminfra" is invalid: data[.dockerconfigjson]:
##   Invalid value: "<secret contents redacted>": invalid character '\''
##   looking for beginning of object key string
##
## Ansible converts a template's result back into a Python object when the whole
## thing looks like one (safe_eval on anything starting with `{`), so vault.yaml's
## pull_secret - a correctly quoted JSON *string* - came back out of this one
## variable hop as a dict:
##
##   pull_secret type:         AnsibleUnicode
##   bminfra_pull_secret type: dict
##
## and `| b64encode` in the template then encoded str(dict), single quotes and
## all. `string` is one of Ansible's STRING_TYPE_FILTERS: ending the template
## with one suppresses that conversion, so the vault's own bytes survive intact.
## The to_json branch covers a vault.yaml that spells the secret as a YAML
## mapping rather than a quoted string - JSON is valid YAML, so both spellings
## are things people paste in, and str(dict) is not JSON for either of them.
##
## Roles that use pull_secret directly (create-hosted-cluster's
## hosted-cluster.yaml.j2, setup-hub-cluster's install-config) never hit this -
## it takes the extra variable hop to trigger it. tasks/disconnected-pull-secret.yml
## is safe for the same reason: its template ends in `| to_json`.
bminfra_pull_secret: "{{ (pull_secret | to_json) if (pull_secret is mapping) else (pull_secret | string) }}"

## InfraEnv ignition config override - see tasks/disconnected-ignition-override.yml
## for the failure this exists to prevent ("A signature was required, but no
## signature exists" when the discovery host pulls the assisted-installer agent
## through the mirror registry). Empty on a connected run, so
## templates/03-infraenv.yaml.j2 emits no ignitionConfigOverride at all.
bminfra_ignition_config_override: ""

## Ignition spec version of that override. assisted-service merges it into the
## discovery ignition, so any 3.x it can parse works; 3.2.0 is what RHCOS 4.x
## ships with.
bminfra_ignition_version: "3.2.0"

## Whether the override replaces /etc/containers/policy.json on the discovery
## host with one that does not require a Red Hat GPG signature. Set false if you
## have mirrored Red Hat's sigstore and would rather keep signature checking -
## then point bminfra_ignition_extra_files at your own
## /etc/containers/registries.d/ drop-in.
bminfra_disconnected_relax_image_policy: true

## The policy.json written when the above is true. Identical to what RHCOS ships
## except that the two Red Hat registries fall back to insecureAcceptAnything,
## because their detached signatures are not reachable from a disconnected node
## and mirror-registry does not serve them.
bminfra_discovery_image_policy:
  default:
    - type: insecureAcceptAnything
  transports:
    docker:
      registry.access.redhat.com:
        - type: insecureAcceptAnything
      registry.redhat.io:
        - type: insecureAcceptAnything
    docker-daemon:
      "":
        - type: insecureAcceptAnything

## Extra ignition storage.files entries appended to the override, in ignition's
## own schema ({path, mode, overwrite, contents: {source: "data:..."}}).
bminfra_ignition_extra_files: []
