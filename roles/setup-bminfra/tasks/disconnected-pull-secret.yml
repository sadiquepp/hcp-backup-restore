---
# Reduces the pull-secret the InfraEnv hands to the discovery agent down to the
# mirror registry's own credentials.
#
# Included from tasks/main.yml only when disconnected_install is true, before
# the manifests are rendered - it sets bminfra_pull_secret, which
# templates/02-pullsecret.yaml.j2 reads.
#
# Why this is not just vault.yaml's pull_secret:
#
# On a disconnected hub, assisted-service resolves the discovery agent image
# through the mirror mappings in the mirror-registry ConfigMap that
# roles/setup-hub-acm publishes (spec.mirrorRegistryRef), so the agent's podman
# rewrites e.g.
#   registry.redhat.io/multicluster-engine/assisted-installer-agent-rhel9@sha256:...
# to the mirror. Credentials, though, are looked up per *physical* registry: the
# pull is now against {{ mirror_registry_domain }}:{{ mirror_registry_port }},
# and vault.yaml's pull_secret has no entry for that host. The mirror then
# rejects the pull, podman falls back to the source registry, and on a host with
# no route out that ends as:
#
#   Mirrors also failed: [<mirror>/multicluster-engine/assisted-installer-agent-rhel9@sha256:...:
#   unauthorized: access to the requested resource is not authorized]):
#   registry.redhat.io/...: pinging container registry registry.redhat.io:
#   dial tcp ...: connect: no route to host
#
# Same reduction, and the same reasoning, as the disconnected hub's own
# install-config (roles/setup-hub-cluster-disconnected): the mirror mappings
# redirect every pull the agent makes, so it never needs a quay.io or
# registry.redhat.io credential - and handing it one would give every discovered
# host a working route back to the real registries, so a pull the mirror is
# missing could succeed for the wrong reason and quietly undo the disconnection.

- name: Check the disconnected variables this role needs are set
  ansible.builtin.assert:
    that:
      - mirror_registry_domain is defined
      - mirror_registry_port is defined
      - mirror_registry_authfile is defined
    fail_msg: >-
      Running setup-bminfra disconnected needs the mirror registry variables
      from vars.yaml (mirror_registry_domain, mirror_registry_port,
      mirror_registry_authfile). Load vars.yaml in the playbook, or drop
      -e disconnected_install=true.

- name: Check the mirror registry authfile is present on the baremetal host
  ansible.builtin.stat:
    path: "{{ mirror_registry_authfile }}"
  register: bminfra_mirror_authfile_status
  become: true

- ansible.builtin.assert:
    that:
      - bminfra_mirror_authfile_status.stat.exists
    fail_msg: >-
      {{ mirror_registry_authfile }} not found - roles/setup-mirror-registry-trust
      is what logs podman in there, so run setup_mirror_registry.yaml first.

- name: Read the mirror registry authfile (written by setup-mirror-registry-trust)
  ansible.builtin.slurp:
    src: "{{ mirror_registry_authfile }}"
  register: bminfra_mirror_authfile_b64
  become: true

# mirror_registry_authfile is the host's shared podman config, so it holds the
# mirror registry's entry merged into whatever quay.io / registry.redhat.io /
# cloud.openshift.com credentials the host already had. Only the first is wanted
# here; see the header comment.
- name: Work out which authfile entry belongs to the mirror registry
  ansible.builtin.set_fact:
    bminfra_mirror_registry_host: "{{ mirror_registry_domain }}:{{ mirror_registry_port }}"
    bminfra_authfile_auths: "{{ (bminfra_mirror_authfile_b64.content | b64decode | from_json).auths | default({}, true) }}"
  no_log: true

- name: Fail if the host is not logged in to the mirror registry
  ansible.builtin.assert:
    that:
      - bminfra_mirror_registry_host in bminfra_authfile_auths
    fail_msg: >-
      {{ mirror_registry_authfile }} has no credentials for
      {{ bminfra_mirror_registry_host }} - it holds entries for
      [{{ bminfra_authfile_auths.keys() | list | join(', ') }}].
      roles/setup-mirror-registry-trust is what logs podman in there, so run
      setup_mirror_registry.yaml first.

# to_json here rather than in the template: the Secret's .dockerconfigjson is a
# base64 blob, so what matters is that the value being encoded is exactly the
# JSON document podman expects, with every credential escaped by the serialiser
# rather than pasted in as text. bminfra_pull_secret is a plain JSON string in
# both branches (defaults/main.yml keeps vault.yaml's pull_secret for connected
# runs), so the template stays one line either way.
- name: Reduce the InfraEnv pull-secret to the mirror registry's own credentials
  ansible.builtin.set_fact:
    bminfra_pull_secret: "{{ {'auths': {bminfra_mirror_registry_host: bminfra_authfile_auths[bminfra_mirror_registry_host]}} | to_json }}"
  no_log: true

- name: Report which registry the InfraEnv pull-secret covers
  ansible.builtin.debug:
    msg: >-
      InfraEnv pull-secret carries credentials for
      {{ bminfra_mirror_registry_host }} only (disconnected) - the discovery
      agent pulls every image through the mirror mappings in
      roles/setup-hub-acm's mirror-registry ConfigMap.
