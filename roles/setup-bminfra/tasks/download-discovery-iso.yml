---
# Fetch InfraEnv.status.isoDownloadURL and bootArtifacts (kernel/initrd/rootfs).
# Cache the discovery ISO on the bare-metal host; copy PXE artifacts to helper
# paths used by roles/setup-tftp/templates/default.j2.
# Requires KUBECONFIG in the task environment (set by the calling playbook).
#
# get_url only re-fetches a dest that already exists when it is forced, so a
# cached ISO wins over a newly rebuilt one. tasks/ensure-ignition-override.yml
# sets discovery_iso_force_download when it changed the InfraEnv and the ISO was
# therefore rebuilt; nothing else needs to force a ~1G download.

# A PXE-booted node never touches the ISO - it gets the same agent as kernel,
# initrd and rootfs, which the three tasks below stage on the helper. So a
# caller that only PXE-boots (setup_hosted_cluster2_vm.yaml) sets
# discovery_download_iso false and skips a ~1G download it would not use.
- name: Wait for InfraEnv discovery ISO URL
  when: discovery_download_iso | default(true) | bool
  ansible.builtin.shell: >
    oc get infraenv "{{ oadp_bminfra_namespace }}" -n "{{ oadp_bminfra_namespace }}"
    -o jsonpath='{.status.isoDownloadURL}'
  register: infraenv_iso_url
  until: infraenv_iso_url.stdout | length > 0
  retries: 60
  delay: 15
  changed_when: false

- name: Wait for InfraEnv PXE boot artifact URLs
  ansible.builtin.shell: >
    oc get infraenv "{{ oadp_bminfra_namespace }}" -n "{{ oadp_bminfra_namespace }}"
    -o jsonpath='{.status.bootArtifacts.kernel}{"\n"}{.status.bootArtifacts.initrd}{"\n"}{.status.bootArtifacts.rootfs}'
  register: infraenv_boot_artifacts
  until: >
    (infraenv_boot_artifacts.stdout_lines | length) >= 3
    and (infraenv_boot_artifacts.stdout_lines[0] | default('') | length) > 0
    and (infraenv_boot_artifacts.stdout_lines[1] | default('') | length) > 0
    and (infraenv_boot_artifacts.stdout_lines[2] | default('') | length) > 0
  retries: 60
  delay: 15
  changed_when: false

- name: Set InfraEnv boot artifact URLs
  ansible.builtin.set_fact:
    infraenv_boot_kernel_url: "{{ infraenv_boot_artifacts.stdout_lines[0] }}"
    infraenv_boot_initrd_url: "{{ infraenv_boot_artifacts.stdout_lines[1] }}"
    infraenv_boot_rootfs_url: "{{ infraenv_boot_artifacts.stdout_lines[2] }}"

- name: Ensure download directory exists
  ansible.builtin.file:
    path: "{{ download_dir }}"
    state: directory
    mode: '0755'

- name: Download discovery ISO from InfraEnv
  when: discovery_download_iso | default(true) | bool
  ansible.builtin.get_url:
    url: "{{ infraenv_iso_url.stdout }}"
    dest: "{{ download_dir }}/{{ discovery_iso_filename }}"
    validate_certs: false
    force: "{{ discovery_iso_force_download | default(false) | bool }}"
    mode: '0644'

- name: Download InfraEnv PXE boot artifacts
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ download_dir }}/{{ item.filename }}"
    validate_certs: false
    force: "{{ discovery_iso_force_download | default(false) | bool }}"
    mode: '0644'
  loop:
    - url: "{{ infraenv_boot_kernel_url }}"
      filename: "{{ discovery_boot_kernel_filename }}"
    - url: "{{ infraenv_boot_initrd_url }}"
      filename: "{{ discovery_boot_initrd_filename }}"
    - url: "{{ infraenv_boot_rootfs_url }}"
      filename: "{{ discovery_boot_rootfs_filename }}"
  loop_control:
    label: "{{ item.filename }}"

# Left undefined when the ISO was not downloaded, so a caller that boots from
# it fails on the undefined variable rather than on a path that is not there.
- name: Set discovery_image_url to local ISO path
  when: discovery_download_iso | default(true) | bool
  ansible.builtin.set_fact:
    discovery_image_url: "{{ download_dir }}/{{ discovery_iso_filename }}"

# The helper's PXE paths are one set of files, owned by the hub's hosted
# cluster workers. discovery_copy_pxe_to_helper (vars.yaml) is false for the
# compact cluster's InfraEnv, whose workers boot the ISO instead.
- name: Ensure PXE directories exist on helper
  when: discovery_copy_pxe_to_helper | default(true) | bool
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/lib/tftpboot/images
    - /var/www/html/bootp
  delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"
  become: true

- name: Copy PXE boot artifacts to helper
  when: discovery_copy_pxe_to_helper | default(true) | bool
  ansible.builtin.copy:
    src: "{{ download_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - src: "{{ discovery_boot_kernel_filename }}"
      dest: /var/lib/tftpboot/images/vmlinuz
    - src: "{{ discovery_boot_initrd_filename }}"
      dest: /var/lib/tftpboot/images/initrd.img
    - src: "{{ discovery_boot_rootfs_filename }}"
      dest: /var/www/html/bootp/rootfs.img
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"
  become: true

- name: Report discovery image and PXE boot artifact paths
  ansible.builtin.debug:
    msg: >-
      {{ (['Discovery ISO ready at ' ~ discovery_image_url]
          if (discovery_download_iso | default(true) | bool)
          else ['Discovery ISO not downloaded (discovery_download_iso is false) - PXE artifacts only'])
         + (['PXE kernel on helper: /var/lib/tftpboot/images/vmlinuz',
             'PXE initrd on helper: /var/lib/tftpboot/images/initrd.img',
             'PXE rootfs on helper: /var/www/html/bootp/rootfs.img']
            if (discovery_copy_pxe_to_helper | default(true) | bool)
            else ['PXE artifacts left off the helper (discovery_copy_pxe_to_helper is false)']) }}
