---
# Tasks file for setup-bminfra
#
# Creates the namespace, pull-secret, InfraEnv and capi-provider RBAC
# needed before agent-based hosted-cluster nodes can discover/register.
# Run against whichever hub currently owns the InfraEnv - normally hub1,
# or hub2 post-cutover if you're re-creating it there.
#
# pull_secret and ssh_key are the same vars already used by
# roles/setup-hub-cluster's install-config.yaml.j2 - stored once in
# vault.yaml, reused here rather than duplicated.

# The InfraEnv's pull-secret is the one manifest that cannot be rendered the
# same way on both kinds of hub: disconnected, the discovery agent pulls
# through the mirror registry and needs that registry's credentials, not the
# vault's Red Hat ones. Connected runs skip this and render exactly what they
# always did (defaults/main.yml keeps bminfra_pull_secret as pull_secret).
- name: Reduce the InfraEnv pull-secret to the mirror registry (disconnected)
  ansible.builtin.include_tasks: disconnected-pull-secret.yml
  when: disconnected_install | bool

# The InfraEnv also needs an ignitionConfigOverride disconnected, so the
# discovery host does not demand a Red Hat GPG signature for the agent image it
# pulls through the mirror. Built before the manifests are rendered, so
# templates/03-infraenv.yaml.j2 carries it.
- name: Build the InfraEnv ignition config override (disconnected)
  ansible.builtin.include_tasks: disconnected-ignition-override.yml
  when: disconnected_install | bool

# The InfraEnv pull-secret is base64 in the Secret, so nothing catches a
# malformed document until the API server decodes it:
#
#   The Secret "pullsecret-bminfra" is invalid: data[.dockerconfigjson]:
#   Invalid value: "<secret contents redacted>": invalid character '\''
#   looking for beginning of object key string
#
# Those single quotes are Python's: str({'auths': ...}), not JSON. defaults/main.yml
# is where that is kept from happening (and why the filters on bminfra_pull_secret
# are not decoration); this is the guard that would have caught it here, in the
# play, naming the variable - rather than at oc apply with the contents redacted.
# It doubles as the check on a truncated or placeholder secret.
- name: Check the InfraEnv pull-secret is a dockerconfigjson document
  ansible.builtin.assert:
    that:
      - bminfra_pull_secret | length > 0
      - bminfra_pull_secret | first == '{'
      - bminfra_auths_key in bminfra_pull_secret
    fail_msg: >-
      The InfraEnv pull-secret is not a JSON document with an "auths" object.
      Connected runs render vault.yaml's pull_secret verbatim - it must be the
      whole secret from console.redhat.com. Disconnected runs build it from
      {{ mirror_registry_authfile | default('mirror_registry_authfile') }}.
  vars:
    bminfra_auths_key: '"auths"'

- name: Render bminfra manifests
  template:
    src: "{{ item }}"
    dest: "{{ role_path }}/templates/.rendered-{{ item | basename | regex_replace('\\.j2$', '') }}"
  loop:
    - 01-namespace.yaml.j2
    - 02-pullsecret.yaml.j2
    - 03-infraenv.yaml.j2
    - 04-capi-role.yaml.j2
  loop_control:
    label: "{{ item }}"

# The InfraEnv cannot do anything useful until AgentServiceConfig exists on
# this hub - assisted-service is what serves the discovery ISO. That apply is
# still manual (roles/setup-hub-acm renders it and README.md/steps.md apply
# it), so check for it here rather than creating an InfraEnv that will sit
# there doing nothing with no indication why.
- name: Check AgentServiceConfig exists on this hub
  shell: |
    oc get agentserviceconfig agent -o name 2>/dev/null || true
  register: bminfra_asc
  changed_when: false

- name: Fail with a clear message if it is missing
  ansible.builtin.fail:
    msg: >-
      No AgentServiceConfig on this hub, so an InfraEnv here would never
      produce a discovery ISO. Apply the one roles/setup-hub-acm rendered
      first - `oc apply -f roles/setup-hub-acm/files/.rendered-05-agentserviceconfig.yaml`
      - wait for assisted-service to come up in multicluster-engine, then
      re-run this playbook.
  when: bminfra_asc.stdout | trim == ''

# Order matters: namespace before the objects in it, and the pull-secret
# before the InfraEnv that references it.
- name: Apply bminfra manifests
  shell: |
    oc apply -f "{{ role_path }}/templates/.rendered-01-namespace.yaml"
    oc apply -f "{{ role_path }}/templates/.rendered-02-pullsecret.yaml"
    oc apply -f "{{ role_path }}/templates/.rendered-03-infraenv.yaml"
    oc apply -f "{{ role_path }}/templates/.rendered-04-capi-role.yaml"

- name: Report what was applied
  debug:
    msg: >-
      Applied namespace, pull-secret, InfraEnv and capi-provider RBAC to
      {{ hub_install_folder_selected | default('this hub') }}. The
      pull-secret is rendered for a
      {{ 'disconnected' if disconnected_install | bool else 'connected' }}
      hub. Rendered files are left under
      {{ role_path }}/templates/.rendered-*.yaml for inspection.

# The InfraEnv is applied above, but an InfraEnv that already existed on this
# hub may predate the ignition override. Patch it on there too, and wait for
# the ISO to be rebuilt, rather than caching an ISO whose hosts cannot pull
# the agent.
- name: Make sure the live InfraEnv carries the ignition override (disconnected)
  ansible.builtin.include_tasks: ensure-ignition-override.yml
  when: disconnected_install | bool

- name: Download discovery ISO from InfraEnv
  ansible.builtin.include_tasks: download-discovery-iso.yml

# Cleanup stays disabled deliberately, even though the apply above is now
# enabled: the rendered files are the record of what went onto the hub, the
# disconnected flow inspects .rendered-03-infraenv.yaml, and README.md points
# at these paths. They cost nothing to keep.
# - name: Clean up rendered scratch files
#   ansible.builtin.file:
#     path: "{{ role_path }}/templates/{{ item }}"
#     state: absent
#   loop:
#     - .rendered-01-namespace.yaml
#     - .rendered-02-pullsecret.yaml
#     - .rendered-03-infraenv.yaml
#     - .rendered-04-capi-role.yaml
