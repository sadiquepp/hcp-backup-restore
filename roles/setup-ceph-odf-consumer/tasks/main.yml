---
# Tasks file for setup-ceph-odf-consumer
#
# This role runs in two stages, selected by ceph_odf_consumer_stage
# (see setup_ceph_odf.yaml), because ODF has to be installed BEFORE
# the export play (so we can extract the version-matched exporter
# script from the operator CSV), but the StorageCluster can only be
# created AFTER the export play has produced the JSON:
#
#   stage: install   -> install-operator.yml
#                       (operator + extract version-matched script)
#   stage: create    -> create-storagecluster.yml
#                       (external-cluster secret + StorageCluster CR)
#
# Both stages run with KUBECONFIG pointed at the target OCP cluster.

- name: Install ODF operator and extract the version-matched exporter script
  ansible.builtin.include_tasks: install-operator.yml
  when: ceph_odf_consumer_stage == 'install'

- name: Create the external-cluster secret and StorageCluster
  ansible.builtin.include_tasks: create-storagecluster.yml
  when: ceph_odf_consumer_stage == 'create'
