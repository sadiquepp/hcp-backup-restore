---
# In-guest configuration for the client VM. Delegated to it.

- name: Install test tooling on the client VM
  ansible.builtin.dnf:
    name:
      - iproute
      - tcpdump
      - bind-utils
    state: present

- name: Install the client routing script
  ansible.builtin.template:
    src: udn-client-routes.sh.j2
    dest: /usr/local/sbin/udn-client-routes.sh
    mode: "0755"
  register: udn_client_script

- name: Install the client routing unit
  ansible.builtin.template:
    src: udn-client-routes.service.j2
    dest: /etc/systemd/system/udn-client-routes.service
    mode: "0644"
  register: udn_client_unit

- name: Enable and run the client routing unit
  ansible.builtin.systemd:
    name: udn-client-routes.service
    enabled: true
    state: "{{ 'restarted' if (udn_client_script is changed or udn_client_unit is changed) else 'started' }}"
    daemon_reload: true
