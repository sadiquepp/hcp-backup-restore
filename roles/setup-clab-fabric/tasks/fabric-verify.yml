---
# Phase 0f - prove the fabric is wired, not merely deployed.
#
# containerlab reports success once the containers start. It says nothing
# about whether leaf1's exec: block actually ran, whether eth1 ended up with
# an address, or whether the bridge the topology names reaches the OCP nodes
# at all. Each of those failures looks identical much later and a long way
# from here: a BGP session stuck in Active, and a pod ping answered with
# "Destination Host Unreachable" by the node's own kernel because it could
# not ARP the leaf. Checking here costs seconds and names the cause.

- name: Read the border leaf's fabric interface
  ansible.builtin.command:
    cmd: "docker exec clab-{{ clab_lab_name }}-leaf1 ip -o addr show dev eth1"
  register: clab_leaf1_eth1
  changed_when: false
  failed_when: false

- name: Fail if the border leaf never got its fabric address
  ansible.builtin.assert:
    that:
      - clab_leaf1_eth1.rc == 0
      - (clab_fabric_prefix ~ '.' ~ clab_fabric_router_octet) in clab_leaf1_eth1.stdout
    fail_msg: >-
      leaf1 has no {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }} on
      eth1. What leaf1 reports now:
      {{ clab_leaf1_eth1.stdout | default(clab_leaf1_eth1.stderr, true) }}
      -- If eth1 does not exist at all, the container has been RESTARTED
      since the lab was deployed. containerlab builds every link but eth0 as
      a veth into the container's network namespace, and a restart destroys
      that namespace: the node comes back with lo and its management eth0 and
      nothing else, still running, still healthy-looking, and completely
      disconnected from the fabric. The exec: block that addresses eth1 runs
      only at creation, so it does not re-run either. A redeploy is the fix,
      not a docker start: re-run this role with --tags clabdeploy, which uses
      `containerlab deploy --reconfigure`.
    success_msg: >-
      leaf1 holds {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }} on eth1.

# Resolved here rather than reused from clab-install.yml so this file stands
# on its own: --tags clabverify has to work against a fabric that is already
# up, without re-running the install.
- name: Find the fabric NIC inside the containerlab VM by MAC
  ansible.builtin.shell:
    cmd: >-
      ip -o link show |
      awk '/{{ clab_fabric_mac_prefix }}:{{ ip_list.clab }}/ && !f {gsub(":","",$2); print $2; f=1}'
  register: clab_verify_nic
  changed_when: false
  when: clab_deploy_mode == 'vm'

# A restart is the one failure that leaves every other symptom looking fine,
# so check it directly rather than inferring it from a missing interface.
# Docker counts restarts for us.
- name: Read how many times the border leaf has restarted
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {{ '{{' }}.RestartCount{{ '}}' }}
      clab-{{ clab_lab_name }}-leaf1
  register: clab_leaf1_restarts
  changed_when: false
  failed_when: false

- name: Fail if the border leaf has restarted since it was deployed
  ansible.builtin.assert:
    that:
      - clab_leaf1_restarts.rc != 0 or (clab_leaf1_restarts.stdout | trim | int) == 0
    fail_msg: >-
      clab-{{ clab_lab_name }}-leaf1 has restarted
      {{ clab_leaf1_restarts.stdout | trim }} time(s) since it was created.
      containerlab builds every link but the management eth0 as a veth in the
      container's network namespace, and a restart destroys it: the node is
      running and looks healthy while having no fabric connection at all, and
      the exec: block that addressed those links does not re-run. Redeploy
      with --tags clabdeploy - `docker start` cannot repair this.
    success_msg: >-
      clab-{{ clab_lab_name }}-leaf1 has not restarted since deploy.

# vtysh answering is not the same as bgpd running. With the daemons down,
# vtysh still starts, still prints output, and reports
# "Configuration file[/etc/frr/frr.conf] processing failure: N" - N being the
# number of config lines it could not push to a daemon that is not there.
# Checking that each node appears as a neighbour proves bgpd is up AND holds
# the configuration, which is what the cluster side is about to depend on.
- name: Read the border leaf's BGP neighbours
  ansible.builtin.command:
    cmd: "docker exec clab-{{ clab_lab_name }}-leaf1 vtysh -c 'show bgp summary'"
  register: clab_leaf1_bgp
  changed_when: false
  failed_when: false

- name: Fail if the border leaf is not running BGP for every node
  ansible.builtin.assert:
    that:
      - clab_leaf1_bgp.rc == 0
      - (clab_fabric_prefix ~ '.' ~ ip_list[item.ip_key]) in clab_leaf1_bgp.stdout
    fail_msg: >-
      leaf1 has no BGP neighbour for
      {{ clab_fabric_prefix }}.{{ ip_list[item.ip_key] }} ({{ item.ip_key }}).
      leaf1 reports: {{ clab_leaf1_bgp.stdout | default(clab_leaf1_bgp.stderr, true) }}
      -- "Configuration file[/etc/frr/frr.conf] processing failure: N" means
      the FRR daemons are not running: vtysh starts anyway, cannot push the
      config to anything, and counts the lines that failed. The cluster side
      of this shows as a session stuck in Active with MsgSent climbing and
      MsgRcvd at 0 - the node's SYNs are refused because nothing is listening
      on port 179. Redeploy with --tags clabdeploy.
    success_msg: >-
      leaf1 is peering with {{ clab_fabric_prefix }}.{{ ip_list[item.ip_key] }}
      ({{ item.ip_key }}).
  loop: "{{ clab_fabric_nodes }}"
  loop_control:
    label: "{{ item.ip_key }}"

- name: Read the fabric bridge's ports
  ansible.builtin.command:
    cmd: "ip -br link show master {{ clab_bridge_for_topology }}"
  register: clab_bridge_ports
  changed_when: false
  failed_when: false

# Two ports have to be on this bridge for anything to work: the veth
# containerlab gave leaf1, and - in vm mode - the NIC that carries the L2
# domain out to virbr1 and the OCP nodes. A bridge with only the veth is the
# exact shape of failure that leaves every node unable to ARP the leaf while
# leaf1 itself looks perfectly healthy.
- name: Fail if the fabric bridge is missing a port
  ansible.builtin.assert:
    that:
      - clab_bridge_ports.rc == 0
      - "'leaf1-fab' in clab_bridge_ports.stdout"
      - clab_deploy_mode != 'vm' or clab_verify_nic.stdout in clab_bridge_ports.stdout
    fail_msg: >-
      {{ clab_bridge_for_topology }} is not wired as expected. Expected the
      leaf1-fab veth
      {{ ('and the fabric NIC ' ~ clab_verify_nic.stdout) if clab_deploy_mode == 'vm' else '' }}
      to be enslaved to it. Ports found:
      {{ clab_bridge_ports.stdout_lines | default([], true) }}
      -- Without the fabric NIC on this bridge the containers can talk to
      each other and to nothing else, which presents on the cluster side as
      every BGP session stuck in Active.
    success_msg: >-
      {{ clab_bridge_for_topology }} carries the expected ports.

# Per-tenant plumbing. Until now this file checked the fabric link and the
# BGP session and stopped - which is everything the tenants ride on and
# nothing about the tenants themselves. A tenant whose VLAN, VRF or external
# endpoint never got built looks completely healthy from every check above,
# and only shows up as one phase-3 ping that will not answer.
#
# Note what is NOT checked here: whether a tenant is Layer2 or Layer3. That
# is a property of the ClusterUserDefinedNetwork, not of the fabric. leaf1
# hands every tenant a VLAN into a VRF the same way whatever its topology,
# so green and orange are expected to look identical from this side.
- name: Read the border leaf's interfaces
  ansible.builtin.command:
    cmd: "docker exec clab-{{ clab_lab_name }}-leaf1 ip -o addr show"
  register: clab_leaf1_ifaces
  changed_when: false
  failed_when: false

- name: Read the border leaf's link masters
  ansible.builtin.command:
    cmd: "docker exec clab-{{ clab_lab_name }}-leaf1 ip -o link show"
  register: clab_leaf1_masters
  changed_when: false
  failed_when: false

- name: Fail if a tenant's VLAN, VRF or external interface is missing on the leaf
  ansible.builtin.assert:
    that:
      # the VRF device, and the VLAN subinterface enslaved to it
      - clab_leaf1_masters.stdout is search(item.name ~ ':')
      - clab_leaf1_masters.stdout is search('eth1\\.' ~ item.vlan ~ '.*master ' ~ item.name)
      # the handoff address the cluster peers with
      - clab_leaf1_ifaces.stdout is search(item.vrf_prefix ~ '\\.' ~ clab_fabric_router_octet ~ '/')
      # the tenant's own external network, behind the leaf
      - clab_leaf1_ifaces.stdout is search(item.external_gw | replace('.', '\\.') ~ '/')
    fail_msg: >-
      leaf1 is missing part of tenant '{{ item.name }}': expected a VRF named
      {{ item.name }}, eth1.{{ item.vlan }} enslaved to it holding
      {{ item.vrf_prefix }}.{{ clab_fabric_router_octet }}, and
      {{ item.name }}-ext holding {{ item.external_gw }}.
      These are built by the topology's exec: block, which runs only when the
      container is created - so a redeploy that reused it, or a tenant added
      to vars.yaml since the last --tags fabric, produces exactly this.
      Re-run --tags fabric.
      What leaf1 has: {{ clab_leaf1_ifaces.stdout_lines | default([], true) }}
    success_msg: >-
      {{ item.name }}: VRF, VLAN {{ item.vlan }} at
      {{ item.vrf_prefix }}.{{ clab_fabric_router_octet }}, external
      {{ item.external_gw }}.
  loop: "{{ udn_bgp_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  when: clab_topology != 'evpn'

- name: Read each tenant's external endpoint
  ansible.builtin.command:
    cmd: "docker exec clab-{{ clab_lab_name }}-{{ item.name }}-ext ip -o addr show eth1"
  loop: "{{ udn_bgp_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  register: clab_ext_hosts
  changed_when: false
  failed_when: false

- name: Fail if a tenant's external endpoint is not addressed
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout is search(item.item.external_host | replace('.', '\\.') ~ '/')
    fail_msg: >-
      The {{ item.item.name }}-ext container is missing or has no
      {{ item.item.external_host }}. This is what a {{ item.item.name }} pod
      is supposed to reach in phase 3, so the isolation test would fail for a
      reason that has nothing to do with isolation.
      It reports: {{ item.stdout | default(item.stderr, true) }}
    success_msg: >-
      {{ item.item.name }}-ext holds {{ item.item.external_host }}.
  loop: "{{ clab_ext_hosts.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Report the per-tenant plumbing
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_tenants | map(attribute='name') | list }} on leaf1 -
      {{ clab_leaf1_ifaces.stdout_lines | default([], true) | select('search', 'eth1\\.') | list }}

- name: Report the fabric bridge's ports
  ansible.builtin.debug:
    msg: "{{ clab_bridge_ports.stdout_lines | default([], true) }}"
