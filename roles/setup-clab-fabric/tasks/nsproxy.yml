---
# Tenant ingress on the namespace client (--tags clabnsproxy).
#
# Answers the question the isolation matrix provokes: if green and purple
# genuinely hold the same address, how does an end user reach either? With a
# proxy that is multi-homed into every tenant and picks the namespace by Host.
#
# Runs in two places. Backend discovery needs `oc` and so runs on localhost;
# everything after it is delegated to the VM by the caller in main.yml.
#
# Phase-independent, and deliberately so. Nothing here names a leaf, a VRF, a
# VLAN or a topology: the proxy discovers each tenant's pod address with `oc`
# and dials it from inside that tenant's network namespace. Whatever carries
# the namespace to the pod - leaf1's VRF under VRF-Lite, leaf2's VRF or L2VNI
# under EVPN - is somebody else's problem by the time this runs. So it works
# unchanged in phase 4, and the same property is why it answers the overlapping
# -address question at all: the proxy never needs one routing table to hold two
# routes to the same prefix, because each backend is resolved in its own.

# ---------------------------------------------------------------------------
# What to proxy to. The pod addresses are not stable - any --tags web re-run
# replaces the pods and changes them - so they are read now and recorded in
# the manifest, and the demo compares the two to tell a stale config from a
# routing fault.
# ---------------------------------------------------------------------------
# One route per (cluster, tenant) the ingress will front. The label is what
# becomes a hostname: bare for the first cluster in udn_proxy_clusters, suffixed
# for the rest, so green.<domain> stays hub's and sno's is green-sno.<domain>.
#
# A cluster only contributes the tenants it builds - clab_clusters limits the
# SNO to green and purple - so asking for a tenant it does not have is skipped
# here rather than failing discovery below on a namespace that never existed.
- name: Work out which (cluster, tenant) routes the ingress can front
  ansible.builtin.set_fact:
    udn_proxy_routes: >-
      {{ (udn_proxy_routes | default([])) + [{
           'cluster': item.0,
           'tenant': item.1,
           'label': item.1 if item.0 == udn_proxy_clusters[0]
                    else item.1 ~ '-' ~ item.0 }] }}
  loop: "{{ udn_proxy_clusters | product(udn_proxy_tenants) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  when: item.1 in (clab_clusters[item.0].tenants | default(udn_proxy_tenants))

# The DNS zone is generated from udn_proxy_names in a different playbook
# entirely (setup-dns, via setup_bm_host.yaml --tags dns). If that list and the
# routes built here ever disagree, the symptom is a hostname that resolves and
# returns 404 - which reads as a proxy fault and is not one. Cheap to compare,
# so compare.
- name: Fail if the routes and the DNS name list disagree
  ansible.builtin.assert:
    that:
      - (udn_proxy_routes | map(attribute='label') | list | sort)
        == (udn_proxy_names | default('') | split | sort)
    fail_msg: >-
      The ingress will front
      {{ udn_proxy_routes | map(attribute='label') | list | sort }}
      but udn_proxy_names says
      {{ udn_proxy_names | default('') | split | sort }}. Both are built from
      udn_proxy_clusters, udn_proxy_tenants and clab_clusters in vars.yaml, so
      they should not be able to differ - if they do, one of those changed
      while a rendered manifest did not. The DNS zone is generated from
      udn_proxy_names, so the mismatch would show up as a hostname that
      resolves and 404s.
    success_msg: >-
      {{ udn_proxy_routes | length }} route(s) match the names DNS will serve.

- name: Fail if no cluster offers any of the requested tenants
  ansible.builtin.assert:
    that: (udn_proxy_routes | default([])) | length > 0
    fail_msg: >-
      None of udn_proxy_clusters
      ({{ udn_proxy_clusters | join(', ') }}) builds any of udn_proxy_tenants
      ({{ udn_proxy_tenants | join(', ') }}). clab_clusters in vars.yaml says
      which tenants each cluster builds.

# ---------------------------------------------------------------------------
# What to proxy to. The pod addresses are not stable - any --tags web re-run
# replaces the pods and changes them - so they are read now and recorded in
# the manifest, and the demo compares the two to tell a stale config from a
# routing fault.
#
# KUBECONFIG is set per route rather than inherited: this task runs in the
# FABRIC play, which sets no kubeconfig at all, so without this every route
# would be read from whatever ambient kubeconfig the shell happens to have -
# the hub's, silently, including for the SNO's routes.
# ---------------------------------------------------------------------------
- name: Read each tenant's web pod address in each cluster
  ansible.builtin.shell:
    # Literal block, not folded. A folded scalar keeps the newline before any
    # line that is MORE INDENTED than its first line, so the continuations here
    # survived into the shell and '-o jsonpath=...' ran as its own command
    # ("-o: command not found"), leaving stdout empty and rc 0.
    cmd: |
      pod=$(oc -n udn-{{ item.tenant }} get pods -l app=udn-web -o jsonpath='{.items[0].metadata.name}')
      [ -n "$pod" ] || { echo "no udn-web pod in udn-{{ item.tenant }} on {{ item.cluster }}" >&2; exit 1; }
      oc -n udn-{{ item.tenant }} exec "$pod" -c httpd -- cat /var/www/html/index.html 2>/dev/null |
        awk '/^udn:/ {split($2, a, "/"); print a[1]}'
  environment:
    KUBECONFIG: "{{ clab_clusters[item.cluster].install_folder }}/auth/kubeconfig"
  loop: "{{ udn_proxy_routes }}"
  loop_control:
    label: "{{ item.label }}"
  register: udn_proxy_addr_probe
  changed_when: false
  failed_when: false
  delegate_to: localhost

- name: Fail if a route has no web pod to proxy to
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim | length > 0
    fail_msg: >-
      No web pod address for {{ item.item.label }} (tenant
      {{ item.item.tenant }} on cluster {{ item.item.cluster }}). The ingress
      proxies to the per-tenant web workload, it does not create one - run
      --tags web against that cluster first:
        ansible-playbook ... --tags web -e udn_bgp_cluster={{ item.item.cluster }}
      Note udn_proxy_tenants defaults to udn_web_tenants, so a tenant listed in
      one and not deployed by the other cannot work.
    success_msg: "{{ item.item.label }} -> {{ item.stdout | trim }}"
  loop: "{{ udn_proxy_addr_probe.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  delegate_to: localhost

- name: Record the backend address of each route
  ansible.builtin.set_fact:
    udn_proxy_backends: >-
      {{ (udn_proxy_backends | default([]))
         + [ item.item | combine({'addr': item.stdout | trim}) ] }}
  loop: "{{ udn_proxy_addr_probe.results }}"
  loop_control:
    label: "{{ item.item.label }} -> {{ item.stdout | trim }}"

- name: Record where the ingress listens
  ansible.builtin.set_fact:
    udn_proxy_bind_addr: "{{ lab_network_prefix }}.{{ ip_list[udn_nsclient_vm_name] }}"

- name: Point out that the zone is rendered by a different playbook
  ansible.builtin.debug:
    msg: >-
      These names are served by haproxy as soon as this task file finishes, and
      the demo reaches them with an explicit Host header, so nothing here needs
      DNS. Resolving them - in a browser, or with plain curl - needs the hub
      zone regenerated, which is a different playbook:
        ansible-playbook -i inventory/hosts setup_bm_host.yaml --ask-vault-pass --tags dns
      Adding a cluster to udn_proxy_clusters adds names
      ({{ udn_proxy_names | default('') | split | join(', ') }}), so that run is
      needed again each time.

- name: Record the ingress for the demo script
  ansible.builtin.template:
    src: tenant-proxy.env.j2
    dest: "{{ playbook_dir }}/udn-bgp/tenant-proxy.env"
    mode: "0644"
  delegate_to: localhost

# Two tenants SHARING a backend address is the case this exists for, so it is
# not an error - but a tenant whose address is shared and whose namespace is
# wrong would be undetectable by reading the config, so say it out loud.
- name: Report the routes the ingress will front
  ansible.builtin.debug:
    msg: >-
      {% for b in udn_proxy_backends %}
      {{ b.label }}.{{ udn_proxy_domain }} -> {{ b.addr }}
      (tenant {{ b.tenant }} on {{ b.cluster }}, dialled inside netns
      {{ b.tenant }}){{ "\n" }}
      {% endfor %}
