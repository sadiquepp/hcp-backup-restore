---
# Two waits, because they fail for different reasons - see
# roles/setup-sno/tasks/wait.yml. Then one check the SNO does not need: that
# every node really came up on a mode-1 bond with both ports enslaved.

- name: Wait for bootstrap to complete (up to {{ compact_bootstrap_timeout_min }}m)
  ansible.builtin.command:
    cmd: >-
      {{ compact_install_folder }}/openshift-install --dir {{ compact_install_folder }}
      agent wait-for bootstrap-complete --log-level=info
  register: compact_bootstrap
  changed_when: false
  failed_when: false
  timeout: "{{ (compact_bootstrap_timeout_min | int) * 60 }}"

- name: Report the bootstrap result
  ansible.builtin.debug:
    msg: "{{ (compact_bootstrap.stderr_lines | default([], true) + compact_bootstrap.stdout_lines | default([], true))[-25:] }}"

# Deliberately NOT fatal. bootstrap-complete is a progress milestone as the
# INSTALLER sees it, and it gives up on things the cluster recovers from by
# itself - a host that registers late, the API unreachable through the pivot.
# A compact cluster that looked stuck here has gone on to install fine a while
# later.
#
# Failing here ended the run, and that dropped every step after it - LVM
# Storage most of all, so the cluster came up with no default StorageClass and
# nothing said why. So record it and let the install wait below decide: it asks
# the same question of the whole cluster, and it cannot pass if bootstrap
# really never finished.
- name: Note that bootstrap did not report complete
  ansible.builtin.debug:
    msg: >-
      bootstrap-complete gave up after {{ compact_bootstrap_timeout_min }}m.
      Not fatal on its own - carrying on to wait for the install to finish.
      If that times out too, start with the rendezvous host; it runs the
      assisted service the other two register with:
        virsh console {{ compact_hosts[0].domain }}
        ssh -i ~/.ssh/lab_rsa core@{{ compact_rendezvous_ip }} 'sudo journalctl -u assisted-service -u agent'
      A node that never got an address means its bond did not come up: check
      the MACs in {{ compact_install_folder }}/rendered/agent-config.yaml
      against `virsh domiflist <node>`. Fewer than three hosts registered
      usually means a node cannot reach {{ compact_rendezvous_ip }}.
  when: compact_bootstrap.rc != 0

- name: Wait for the install to complete (up to {{ compact_install_timeout_min }}m)
  ansible.builtin.command:
    cmd: >-
      {{ compact_install_folder }}/openshift-install --dir {{ compact_install_folder }}
      agent wait-for install-complete --log-level=info
  register: compact_complete
  changed_when: false
  failed_when: false
  timeout: "{{ (compact_install_timeout_min | int) * 60 }}"

- name: Report the install result
  ansible.builtin.debug:
    msg: "{{ (compact_complete.stderr_lines | default([], true) + compact_complete.stdout_lines | default([], true))[-25:] }}"

# Last resort, and the authoritative one: the installer's wait exits non-zero
# on transients, so when it gives up, ask the cluster. ClusterVersion Available
# is the same condition tasks/storage.yml waits on.
- name: Ask the cluster itself whether it became Available (up to {{ compact_settle_extra_min }}m more)
  ansible.builtin.command:
    cmd: >-
      oc get clusterversion version
      -o 'jsonpath={.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ compact_install_folder }}/auth/kubeconfig"
    PATH: "{{ compact_install_folder }}:{{ lookup('env', 'PATH') }}"
  register: compact_settled
  retries: "{{ [1, ((compact_settle_extra_min | int) * 3)] | max }}"
  delay: 20
  until: compact_settled.stdout | trim == 'True'
  changed_when: false
  failed_when: false
  when: compact_complete.rc != 0

- name: Fail if the cluster never came up
  ansible.builtin.assert:
    that: compact_complete.rc == 0 or (compact_settled.stdout | default('') | trim) == 'True'
    fail_msg: >-
      {{ compact_name }} did not come up: the install wait timed out and
      ClusterVersion was still not Available {{ compact_settle_extra_min }}m
      later. Look at it directly - it may still be reachable:
        export KUBECONFIG={{ compact_install_folder }}/auth/kubeconfig
        oc get nodes ; oc get clusteroperators
      Degraded ingress or console operators usually mean *.apps.{{ compact_cluster_domain }}
      does not resolve to the ingress VIP {{ compact_ingress_vip }}.
      {{ ('Bootstrap did not report complete either, so start further back: '
          if compact_bootstrap.rc != 0 else '') }}
        virsh console {{ compact_hosts[0].domain }}
        ssh -i ~/.ssh/lab_rsa core@{{ compact_rendezvous_ip }} 'sudo journalctl -u assisted-service -u agent'
      A node that never got an address means its bond did not come up: check
      the MACs in {{ compact_install_folder }}/rendered/agent-config.yaml
      against `virsh domiflist <node>`. Fewer than three hosts registered
      usually means a node cannot reach {{ compact_rendezvous_ip }}.
      Nothing after this step has run - LVM Storage above all, so there is no
      default StorageClass and any PVC naming none will sit Pending. Once
      `oc get clusterversion` does report Available, finish the build with:
        cd compact-cluster && ansible-playbook -i ../inventory/hosts
        setup_compact_cluster.yaml --ask-vault-pass --tags compactstorage
    success_msg: >-
      {{ compact_name }} is installed{{ ''
         if compact_complete.rc == 0
         else " - the installer's wait gave up, but ClusterVersion reports
               Available, so the build carries on" }}.

# Read straight from the kernel, over ssh, rather than from the
# NodeNetworkState: it needs no operator, and /proc/net/bonding is the one
# place that cannot be out of date about which port is carrying traffic.
- name: Read each node's bond state
  ansible.builtin.command:
    cmd: >-
      ssh -i {{ compact_ssh_public_key_file | regex_replace('[.]pub$', '') }}
      -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10 core@{{ item.ip }}
      cat /proc/net/bonding/{{ compact_bond_name }}
  register: compact_bond_state
  changed_when: false
  failed_when: false
  loop: "{{ compact_hosts }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Fail if a node is not on an active-backup bond over both NICs
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - "'fault-tolerance (active-backup)' in item.stdout"
      - "('Slave Interface: ' ~ compact_bond_primary_nic) in item.stdout"
      - "('Slave Interface: ' ~ compact_bond_secondary_nic) in item.stdout"
    fail_msg: >-
      {{ item.item.hostname }} ({{ item.item.ip }}) is not running
      {{ compact_bond_name }} in active-backup mode over
      {{ compact_bond_primary_nic }} and {{ compact_bond_secondary_nic }}:
      {{ (item.stdout_lines | default([])) + (item.stderr_lines | default([])) }}
      The cluster itself is up, but nothing after this step has run - LVM
      Storage above all. Add it with `--tags compactstorage` once the bond is
      fixed, or now if you want the StorageClass regardless.
    success_msg: >-
      {{ item.item.hostname }}: {{ compact_bond_name }} active-backup,
      {{ item.stdout | regex_search('Currently Active Slave: \S+') }}
  loop: "{{ compact_bond_state.results }}"
  loop_control:
    label: "{{ item.item.hostname }}"

- name: Report how to use the cluster
  ansible.builtin.debug:
    msg:
      - "export KUBECONFIG={{ compact_install_folder }}/auth/kubeconfig"
      - "kubeadmin password: {{ compact_install_folder }}/auth/kubeadmin-password"
      - "console: https://console-openshift-console.apps.{{ compact_cluster_domain }}"
