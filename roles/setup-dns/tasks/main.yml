---
# tasks file for setup_dns
- name: Setup Hostname
  shell: hostnamectl set-hostname helper.mylab.com
  retries: 10
  delay: 5
  register: result
  until: result.rc == 0

# dns_forwarders: auto (the default) - use the lab host's own resolvers. See
# defaults/main.yml for what is filtered out and why. Read on the lab host,
# not the helper this role is delegated to: the helper's resolver is the
# thing being configured.
#
# The last usable answer is kept in setup_dns_forwarders_file and used when
# the host has none left to offer. That is the state after the workshop's A5
# on a host with a STATIC resolver: `nmcli con mod ... ipv4.dns <helper>`
# replaces it, the host then lists only the helper, and a re-run of this role
# would otherwise have nothing to forward to. (With DHCP, the leased resolver
# stays listed after the helper and is found again.)
- name: Read the lab host's resolvers
  ansible.builtin.shell:
    cmd: |
      found=$(for f in /etc/resolv.conf /run/systemd/resolve/resolv.conf; do
                [ -r "$f" ] && awk '$1 == "nameserver" {print $2}' "$f"
              done | grep -Ev '^(127[.]|::1$|{{ lab_network_prefix | regex_escape }}[.])' | awk '!seen[$0]++')
      if [ -n "$found" ]; then
        printf '%s\n' "$found" > {{ setup_dns_forwarders_file }}
        printf '%s\n' "$found"
      elif [ -s {{ setup_dns_forwarders_file }} ]; then
        cat {{ setup_dns_forwarders_file }}
      fi
      true
  register: setup_dns_host_resolvers
  changed_when: false
  delegate_to: localhost
  when: dns_forwarders == 'auto'

- name: Work out the forwarders
  ansible.builtin.set_fact:
    setup_dns_forwarders: >-
      {{ setup_dns_host_resolvers.stdout_lines
         if dns_forwarders == 'auto' else dns_forwarders }}

# An empty list renders `forwarders { };` and named then SERVFAILs every
# external name, while the zones it is authoritative for keep answering - so
# nothing looks wrong until something needs an outside name. That exact failure
# (8.8.8.8, unreachable from this lab) went unnoticed until an agent installer
# refused to start. Cheap to check here, expensive to find later.
- name: Fail if no upstream resolver is configured
  ansible.builtin.assert:
    that: setup_dns_forwarders | length > 0
    fail_msg: >-
      No upstream resolver for the helper.
      {{ ('The lab host resolver configuration names none that can be used'
          ~ ' (loopback and ' ~ lab_network_prefix ~ '.x addresses would have the helper'
          ~ ' forwarding to itself), and ' ~ setup_dns_forwarders_file ~ ' has no earlier answer.')
         if dns_forwarders == 'auto' else 'dns_forwarders is an empty list.' }}
      Set dns_forwarders in vault.yaml to the resolvers the lab host should use.
    success_msg: >-
      Forwarding to {{ setup_dns_forwarders | join(', ') }}{{
      ' (read from the lab host resolver configuration)' if dns_forwarders == 'auto' else '' }}.

# Installed, or - when the helper was built from the customized lab image -
# verified present with rpm -q. See roles/lab-image/tasks/packages.yml.
- name: Install DNS Packages
  ansible.builtin.include_role:
    name: lab-image
    tasks_from: packages
  vars:
    lab_pkg_list: "{{ dns_packages }}"
    lab_pkg_what: helper DNS
    lab_pkg_use_image: "{{ customized_lab_helper_ready | default(false) }}"

- name: Deploy named.conf
  template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy named.rfc1912.zone
  template:
    src: named.rfc1912.zones.j2
    dest: /etc/named.rfc1912.zones
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy "{{ hub_domain }}" - Forward zonefile
  template:
    src: hub_domain.j2
    dest: "/var/named/{{ hub_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hub_domain }}" - Reverse zonefile
  template:
    src: named-reverse.hub.j2
    dest: "/var/named/named-reverse.{{ hub_domain }}.db" 
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy "{{ hub2_domain }}" - Forward zonefile
  template:
    src: hub2_domain.j2
    dest: "/var/named/{{ hub2_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hub_disconnected_domain }}" - Forward zonefile
  template:
    src: hub_disconnected_domain.j2
    dest: "/var/named/{{ hub_disconnected_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hub2_disconnected_domain }}" - Forward zonefile
  template:
    src: hub2_disconnected_domain.j2
    dest: "/var/named/{{ hub2_disconnected_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

# The single-node cluster (setup_sno.yaml), when vars.yaml carries one.
#
# Rendered whether or not the cluster has been built: the agent installer needs
# api.<zone> to resolve before it can watch its own install, so the zone has to
# exist first. Guarded on the SAME condition as the stanza in
# named.rfc1912.zones.j2 - a stanza without its file stops named from starting,
# which would take every other zone down with it.
- name: Deploy "{{ sno_name | default('') }}.{{ base_domain }}" - Forward zonefile
  template:
    src: sno_domain.j2
    dest: "/var/named/{{ sno_name }}.{{ base_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  when:
    - (sno_name | default('')) | length > 0
    - ip_list[sno_name] is defined
  notify:
    -  Restart_Named

# The three-node compact clusters (compact-cluster/setup_compact_cluster.yaml
# and compact-cluster/setup_compact_cluster_disconnected.yaml), one zone per compact_clusters
# entry. Same guard discipline as the SNO above: this condition is repeated in
# named.rfc1912.zones.j2, because a stanza without its file stops named from
# starting.
- name: Deploy the compact clusters' forward zonefiles
  template:
    src: compact_domain.j2
    dest: "/var/named/{{ compact_cluster.name }}.{{ base_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  loop: "{{ compact_clusters | default([]) }}"
  loop_control:
    loop_var: compact_cluster
    label: "{{ compact_cluster.name }}.{{ base_domain }}"
  when:
    - (compact_cluster.name | default('')) | length > 0
    - (compact_cluster.api_vip_key | default('')) in ip_list
    - (compact_cluster.ingress_vip_key | default('')) in ip_list
  notify:
    -  Restart_Named

# Every hosted cluster gets a zone, connected and disconnected alike, in one
# unconditional pass - the helper serves all of them at once and never needs
# rebuilding to switch between the two. The zones are derived from the cluster
# lists rather than from hosted_domain/2/3, which is what stopped the '-d'
# clusters silently having no zone at all.
#
# An entry in either list is a bare name or a dict with 'name'.
- name: Work out the hosted cluster names
  ansible.builtin.set_fact:
    dns_connected_clusters: >-
      {{ (hosted_clusters | default([]) | select('mapping') | map(attribute='name') | list)
         + (hosted_clusters | default([]) | reject('mapping') | list) }}
    dns_disconnected_clusters: >-
      {{ (hosted_clusters_disconnected | default([]) | select('mapping') | map(attribute='name') | list)
         + (hosted_clusters_disconnected | default([]) | reject('mapping') | list) }}

# Which hub each cluster's api/api-int points at - see setup_dns_hub_* in
# defaults/main.yml for why it is resolved per cluster and not per run.
- name: Plan the connected hosted cluster zones
  ansible.builtin.set_fact:
    hosted_cluster_zone_plan: >-
      {{ hosted_cluster_zone_plan | default([]) + [{
           'name': item,
           'hub': setup_dns_hub_connected
                  if (hosted_cluster_metallb_pools[item].ip | default({}))[setup_dns_hub_connected] is defined
                  else 'hub' }] }}
  loop: "{{ dns_connected_clusters }}"
  when: item in (hosted_cluster_metallb_pools | default({}))

- name: Plan the disconnected hosted cluster zones
  ansible.builtin.set_fact:
    hosted_cluster_zone_plan: >-
      {{ hosted_cluster_zone_plan | default([]) + [{
           'name': item,
           'hub': 'hub2' if (target_hub | default('hub')) == 'hub2'
                  else setup_dns_hub_disconnected }] }}
  loop: "{{ dns_disconnected_clusters }}"
  when: item in (hosted_cluster_metallb_pools | default({}))

- name: Fail fast if a hosted cluster has no MetalLB pool entry
  ansible.builtin.assert:
    that:
      - item in (hosted_cluster_metallb_pools | default({}))
    fail_msg: >-
      Hosted cluster '{{ item }}' has no entry in hosted_cluster_metallb_pools
      (vars.yaml), so its zone has no address to publish as api/api-int. Add
      one - a disconnected cluster needs a 'hubd' address, a connected one a
      'hub' address - and re-run setup-hub-acm so the matching IPAddressPool
      exists too.
  loop: "{{ dns_connected_clusters + dns_disconnected_clusters }}"

- name: Deploy the hosted cluster forward zonefiles
  template:
    src: hosted_cluster_zone.j2
    dest: "/var/named/{{ item.name }}.{{ base_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  loop: "{{ hosted_cluster_zone_plan | default([]) }}"
  loop_control:
    label: "{{ item.name }}.{{ base_domain }} -> {{ item.hub }}"
  vars:
    zone: "{{ item }}"
  notify:
    -  Restart_Named

- name: Show which address each hosted cluster zone publishes
  ansible.builtin.debug:
    msg: >-
      api.{{ item.name }}.{{ base_domain }} ->
      {{ (hosted_cluster_metallb_network_prefixes | default({}))[item.hub] | default(lab_network_prefix) }}.{{ hosted_cluster_metallb_pools[item.name].ip[item.hub] }}
      (hub {{ item.hub }}, MetalLB pool {{ hosted_cluster_metallb_pools[item.name].pool }})
  loop: "{{ hosted_cluster_zone_plan | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# Deployed unconditionally, exactly like the hub_disconnected_domain zone
# above: the zone costs nothing when the disconnected hosted cluster has not
# been built, and having it always present means `--tags dns` never has to be
# re-run with -e disconnected_install=true just to make its names resolve.
# What target_hub it is rendered with still matters - see the template.

- name: Start Named Service
  service:
    name: named
    state: started 
    enabled: true
