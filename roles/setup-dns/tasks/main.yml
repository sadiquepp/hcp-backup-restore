---
# tasks file for setup_dns
- name: Setup Hostname
  shell: hostnamectl set-hostname helper.mylab.com
  retries: 10
  delay: 5
  register: result
  until: result.rc == 0

- name: Install DNS Packages
  dnf:
    name: "{{ dns_packages }}"
    state: installed

- name: Deploy named.conf
  template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy named.rfc1912.zone
  template:
    src: named.rfc1912.zones.j2
    dest: /etc/named.rfc1912.zones
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy "{{ hub_domain }}" - Forward zonefile
  template:
    src: hub_domain.j2
    dest: "/var/named/{{ hub_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hub_domain }}" - Reverse zonefile
  template:
    src: named-reverse.hub.j2
    dest: "/var/named/named-reverse.{{ hub_domain }}.db" 
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy "{{ hub2_domain }}" - Forward zonefile
  template:
    src: hub2_domain.j2
    dest: "/var/named/{{ hub2_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hub_disconnected_domain }}" - Forward zonefile
  template:
    src: hub_disconnected_domain.j2
    dest: "/var/named/{{ hub_disconnected_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hosted_domain }}" zonefile
  template:
    src: hosted_domain.j2
    dest: "/var/named/{{ hosted_domain }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named
    
- name: Deploy "{{ hosted_domain2 }}" zonefile
  template:
    src: hosted_domain2.j2
    dest: "/var/named/{{ hosted_domain2 }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Deploy "{{ hosted_domain3 }}" zonefile
  template:
    src: hosted_domain3.j2
    dest: "/var/named/{{ hosted_domain3 }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

# Deployed unconditionally, exactly like the hub_disconnected_domain zone
# above: the zone costs nothing when the disconnected hosted cluster has not
# been built, and having it always present means `--tags dns` never has to be
# re-run with -e disconnected_install=true just to make its names resolve.
# What target_hub it is rendered with still matters - see the template.
- name: Deploy "{{ hosted_domain_disconnected }}" zonefile
  template:
    src: hosted_domain_disconnected.j2
    dest: "/var/named/{{ hosted_domain_disconnected }}.db"
    owner: root
    group: named
    mode: u=rw,g=r,o=r
  notify:
    -  Restart_Named

- name: Start Named Service
  service:
    name: named
    state: started 
    enabled: true
