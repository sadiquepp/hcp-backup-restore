---
# tasks file for setup-hub-acm
- name: Lets wait for 120 seconds for the workers to settle
  ansible.builtin.wait_for:
    timeout: 120

# Every operator Subscription below names a CatalogSource, and that is the one
# thing about them that differs disconnected: the built-in redhat-operators is
# disabled on a disconnected hub, so they have to resolve against the catalog
# oc-mirror generated for the mirrored index (cs-redhat-operator-index-v4-21 and
# the like). It is one value, acm_catalog_source, so the Subscriptions are one
# template per operator rather than a connected and a disconnected copy of each.
- name: Check the mirrored CatalogSource exists before subscribing to anything
  ansible.builtin.include_tasks: disconnected-catalog-source.yml
  when: disconnected_install | bool

- name: Render the operator Subscriptions
  ansible.builtin.template:
    src: "{{ item }}/03-subscription.yaml.j2"
    dest: "{{ role_path }}/files/{{ item }}/.rendered-03-subscription.yaml"
  loop:
    - acm
    - lvm-storage
    - metal-lb
    - oadp

- name: Report which catalog the operators will resolve against
  ansible.builtin.debug:
    msg: >-
      Subscriptions point at CatalogSource '{{ acm_catalog_source }}' in
      {{ acm_catalog_source_namespace }}
      ({{ 'disconnected' if disconnected_install | bool else 'connected' }}).

- name: Deploy ACM Operator
  shell: |
    oc apply -f "{{ role_path }}/files/acm/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/acm/02-acm-operatorgroup.yaml"
    oc apply -f "{{ role_path }}/files/acm/.rendered-03-subscription.yaml"


- name: Deploy LVM Storage Operator
  shell: |
    oc apply -f "{{ role_path }}/files/lvm-storage/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/lvm-storage/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/lvm-storage/.rendered-03-subscription.yaml"
  when: use_lvm_storage == true


- name: Deploy MetalLB Operator  
  shell: |
    oc apply -f "{{ role_path }}/files/metal-lb/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/.rendered-03-subscription.yaml"

- name: Deploy OADP Operator
  shell: |
    oc apply -f "{{ role_path }}/files/oadp/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/oadp/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/oadp/.rendered-03-subscription.yaml"

- name: Lets wait for 300 seconds for Operators to be ACTIVE
  ansible.builtin.wait_for:
     timeout: 300

- name: Setup MultiClusterHub Resource
  shell: |
    oc apply -f "{{ role_path }}/files/acm/04-multicluster-hub.yaml"

- name: Wait for the Provisioning CRD to be established
  shell: |
    oc wait --for=condition=Established crd/provisionings.metal3.io --timeout=300s
  register: provisioning_crd_wait
  retries: 3
  delay: 20
  until: provisioning_crd_wait.rc == 0

- name: Apply Provisioning configuration (required by metal3/baremetal-operator before AgentServiceConfig)
  shell: |
    oc apply -f "{{ role_path }}/files/acm/04b-provisioning.yaml"

- name: Setup LVMCluster Resource
  shell: |
    oc apply -f "{{ role_path }}/files/lvm-storage/04-lvm-cluster.yaml"
  when: use_lvm_storage == true

# Pool names are hub-independent but their addresses are not: hub2 is the DR
# hub on its own segment and hubd the disconnected one, so each hosted cluster
# carries one address per hub - and only for the hubs it can actually run on.
# The connected clusters deliberately have no 'hubd' address and the '-d'
# clusters no 'hub' address (see the comments above
# hosted_cluster_metallb_pools in vars.yaml), so "every cluster on every hub"
# was never true and asserting it here failed every connected run on the '-d'
# clusters and every disconnected run on the connected three.
#
# So the hub renders pools for the clusters that carry an address for IT and
# are part of this run's install mode (see the next block), and leaves the rest
# alone - the same per-cluster resolution roles/setup-dns
# (hosted_cluster_zone_plan) and roles/create-hosted-cluster
# (hosted_cluster_vip_plan) already do. Skipping is the right outcome and not
# a silent one: a cluster genuinely missing an address on the hub it will run
# on still fails, in roles/create-hosted-cluster, which knows which clusters
# that hub is actually getting - this role does not.
- name: Fail fast if a hosted cluster's MetalLB pool entry is incomplete
  ansible.builtin.assert:
    that:
      - item.value.pool is defined
      - item.value.ip is defined
      - item.value.ip | length > 0
    fail_msg: >-
      Hosted cluster '{{ item.key }}' has an incomplete entry in
      hosted_cluster_metallb_pools (vars.yaml). It needs a 'pool' name and a
      non-empty 'ip' map of <hub>: <last octet>, one entry per hub the cluster
      can run on, e.g. "pool: {{ item.key }}-api-pool" with
      "ip: {hub: 60, hub2: 90}".
  loop: "{{ hosted_cluster_metallb_pools | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Carrying an address for this hub is necessary but not sufficient. A hub can
# hold addresses for both the connected clusters and the '-d' ones - hub2 does,
# because it is the DR hub for both - and rendering that union would give a
# connected hub2 six pools, three of them for disconnected clusters it is not
# hosting. So the second half of the selection is the install mode, decided by
# the same disconnected_install switch the rest of the repo already runs on:
# true means this run is about hosted_clusters_disconnected, false about
# hosted_clusters. That is the identical choice roles/create-hosted-cluster
# makes (hosted_cluster_source), which is what keeps the pools a hub carries
# and the HostedClusters actually rendered onto it the same set.
#
# The addresses for the other mode are not lost, they are still the
# reservation vars.yaml says they are - re-running this role's 'acm' tag with
# the other value of disconnected_install renders them. That re-run is the step
# before restoring a '-d' hosted cluster onto hub2.
#
# An entry in either list is a bare name or a dict with 'name', so flatten both
# shapes the way create-hosted-cluster and setup-dns do. Both lists empty (the
# role used standalone, without vars.yaml) means "no opinion" rather than
# "nothing": it falls back to every cluster in the map, so the selection is
# then by hub alone, exactly as it was before.
- name: Work out which hosted clusters this run is for
  ansible.builtin.set_fact:
    metallb_run_cluster_names: >-
      {{ ((metallb_run_cluster_source | select('mapping') | map(attribute='name') | list)
          + (metallb_run_cluster_source | reject('mapping') | list))
         or (hosted_cluster_metallb_pools | default({}) | list) }}
  vars:
    metallb_run_cluster_source: >-
      {{ (hosted_clusters_disconnected | default([]))
         if disconnected_install | bool
         else (hosted_clusters | default([])) }}

- name: Select the hosted clusters that have a MetalLB address on this hub
  ansible.builtin.set_fact:
    metallb_hub_pools: >-
      {{ hosted_cluster_metallb_pools | default({}) | dict2items
         | selectattr('value.ip', 'contains', metallb_hub)
         | selectattr('key', 'in', metallb_run_cluster_names)
         | items2dict }}

# An empty selection is the one case that is still an error: the hub would come
# up with no IPAddressPool at all rather than with the subset it should have.
# Two things can cause it now - metallb_hub naming a hub nothing in the map
# knows about (a typo, or a new hub whose addresses were never added), or
# disconnected_install set the wrong way round for this hub - so the message
# prints both halves of the selection and lets the reader see which one is
# empty.
- name: Fail fast if no hosted cluster in this run has a MetalLB address for this hub
  ansible.builtin.assert:
    that:
      - metallb_hub_pools | length > 0
    fail_msg: >-
      No cluster in this run carries a '{{ metallb_hub }}' address, so this hub
      would get no IPAddressPool at all.
      disconnected_install={{ disconnected_install | bool }}, so this run is for
      {{ (disconnected_install | bool)
         | ternary('hosted_clusters_disconnected', 'hosted_clusters') }}:
      {{ metallb_run_cluster_names | sort | join(', ') | default('none', true) }}.
      Clusters carrying a '{{ metallb_hub }}' address in
      hosted_cluster_metallb_pools (vars.yaml):
      {{ hosted_cluster_metallb_pools | default({}) | dict2items
         | selectattr('value.ip', 'contains', metallb_hub)
         | map(attribute='key') | sort | join(', ') | default('none', true) }}.
      metallb_hub is set by the hub playbook - hub (setup_hub_cluster.yaml),
      hub2 (setup_hub_cluster2.yaml) or hubd (setup_hub_cluster.yaml with
      disconnected_install). Hubs named in that map:
      {{ hosted_cluster_metallb_pools | default({}) | dict2items
         | map(attribute='value.ip') | map('list') | flatten
         | unique | sort | join(', ') }}.

- name: Show which hosted clusters get a MetalLB pool on this hub
  ansible.builtin.debug:
    msg: >-
      metallb_hub={{ metallb_hub }}
      disconnected_install={{ disconnected_install | bool }}
      renders pools for:
      {{ metallb_hub_pools | list | sort | join(', ') }}
      | not rendered here (no '{{ metallb_hub }}' address, or not in this
      install mode):
      {{ (hosted_cluster_metallb_pools | default({}) | list
          | difference(metallb_hub_pools | list) | sort | join(', '))
         | default('none', true) }}

- name: Render MetalLB IPAddressPools (one single-address pool per hosted cluster)
  template:
    src: metal-lb/05-ip-pool.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-ip-pool.yaml"

- name: Render MetalLB L2Advertisements (one per pool)
  template:
    src: metal-lb/06-L2Advertisement.yaml.j2
    dest: "{{ role_path }}/files/.rendered-06-l2advertisement.yaml"

- name: Setup MetalLB Resource
  shell: |
    oc apply -f "{{ role_path }}/files/metal-lb/04-metalLB.yaml"

# The old shared hcp-ip-pool covered a whole range per hub (.60-.63 on hub,
# .64-.67 on hubd, .90-.93 on hub2), which the per-cluster pools now claim one
# address at a time. MetalLB refuses overlapping IPAddressPools, so on a hub
# that was built before this change the old pool has to go first. Any
# kube-apiserver Service still holding an address from it is reassigned on
# MetalLB's next converge - to the same address, since the per-cluster pool for
# that hosted cluster contains exactly the address DNS publishes for it on
# this hub.
- name: Remove the superseded shared MetalLB pool and advertisement
  shell: |
    oc delete l2advertisement "{{ metallb_legacy_l2advertisement_name }}" -n metallb-system --ignore-not-found
    oc delete ipaddresspool "{{ metallb_legacy_pool_name }}" -n metallb-system --ignore-not-found
  when: metallb_remove_legacy_shared_pool | bool

- name: Setup per-hosted-cluster MetalLB IPAddressPools and L2Advertisements
  shell: |
    oc apply -f "{{ role_path }}/files/.rendered-05-ip-pool.yaml"
    oc apply -f "{{ role_path }}/files/.rendered-06-l2advertisement.yaml"

# `oc apply` never prunes, so a hub built before the install mode narrowed this
# selection keeps whatever it was given then - a hub2 built when both sets were
# rendered still shows six pools after a connected re-run, which is exactly the
# state this is here to clear. Only pools named in hosted_cluster_metallb_pools
# and carrying an address for THIS hub are ever considered: anything else on
# the hub is somebody else's and is left alone.
#
# A pool whose address a Service currently holds is never deleted, whatever
# mode this run is. Nothing stops a connected hosted cluster and a restored
# '-d' one from being up on hub2 at the same time, and deleting the pool under
# a live kube-apiserver Service would strip its VIP - so an in-use pool is
# reported and skipped, and the run carries on.
- name: Select the other install mode's pools this hub still carries
  ansible.builtin.set_fact:
    metallb_other_mode_pools: >-
      {{ hosted_cluster_metallb_pools | default({}) | dict2items
         | selectattr('value.ip', 'contains', metallb_hub)
         | rejectattr('key', 'in', metallb_run_cluster_names)
         | items2dict }}

- name: Remove the other install mode's pools, unless a Service is using one
  shell: |
    pool="{{ item.value.pool }}"
    addr="{{ (hosted_cluster_metallb_network_prefixes | default({}))[metallb_hub] | default(lab_network_prefix) }}.{{ item.value.ip[metallb_hub] }}"
    if ! oc get ipaddresspool "$pool" -n metallb-system >/dev/null 2>&1; then
      echo "absent: $pool"
      exit 0
    fi
    if oc get svc -A -o jsonpath='{range .items[*]}{.status.loadBalancer.ingress[*].ip}{"\n"}{end}' \
        | grep -Fxq "$addr"; then
      echo "in use ($addr assigned to a Service), kept: $pool"
      exit 0
    fi
    oc delete l2advertisement "{{ item.value.pool }}-l2" -n metallb-system --ignore-not-found
    oc delete ipaddresspool "$pool" -n metallb-system --ignore-not-found
    echo "deleted: $pool"
  register: metallb_other_mode_cleanup
  changed_when: "'deleted: ' in metallb_other_mode_cleanup.stdout"
  loop: "{{ metallb_other_mode_pools | dict2items }}"
  loop_control:
    label: "{{ item.value.pool }}"
  when: metallb_prune_other_mode_pools | bool

- name: Show what the cleanup did
  ansible.builtin.debug:
    msg: "{{ metallb_other_mode_cleanup.results | map(attribute='stdout') | list }}"
  when:
    - metallb_prune_other_mode_pools | bool
    - metallb_other_mode_pools | length > 0

- name: Clean up rendered scratch files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ role_path }}/files/.rendered-05-ip-pool.yaml"
    - "{{ role_path }}/files/.rendered-06-l2advertisement.yaml"


# Everything below this point renders differently depending on whether the hub
# talks to the internet or only to the mirror registry. The three includes are
# prerequisites for the disconnected AgentServiceConfig rather than optional
# extras: it references the mirror-registry ConfigMap the first one creates,
# and the osImage urls the second one stages. Connected runs skip all of it and
# render exactly what they always did.
- name: Set up the mirror registry trust and mirror mappings (disconnected)
  ansible.builtin.include_tasks: disconnected-mirror-config.yml
  when: disconnected_install | bool

- name: Stage the RHCOS live ISOs on the helper's web server (disconnected)
  ansible.builtin.include_tasks: disconnected-os-images.yml
  when: disconnected_install | bool

- name: Create the ClusterImageSets for the mirrored releases (disconnected)
  ansible.builtin.include_tasks: disconnected-cluster-image-sets.yml
  when: disconnected_install | bool

# Both branches render to the same path, so the review-and-apply step below
# (and the one in the README) is the same either way.
- name: Render AgentServiceConfig (connected)
  template:
    src: acm/05-agentserviceconfig.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"
  when: not (disconnected_install | bool)

- name: Render AgentServiceConfig (disconnected)
  template:
    src: acm/05-agentserviceconfig-disconnected.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"
  when: disconnected_install | bool

#- name: Wait for the AgentServiceConfig CRD to be established
#  shell: |
#    oc wait --for=condition=Established crd/agentserviceconfigs.agent-install.openshift.io --timeout=300s
#  register: asc_crd_wait
#  retries: 3
#  delay: 20
#  until: asc_crd_wait.rc == 0

# REVIEW-BEFORE-APPLY: rendered file is left in place at the path shown
# below - inspect it, then re-enable this task (remove the comment
# markers) once you've manually validated it.
# - name: Apply AgentServiceConfig
#   shell: |
#     oc apply -f "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"

- name: AgentServiceConfig apply is disabled pending manual review
  debug:
    msg: >-
      Apply is commented out - review
      {{ role_path }}/files/.rendered-05-agentserviceconfig.yaml
      ({{ 'disconnected' if disconnected_install | bool else 'connected' }} rendering)
      then re-enable the 'Apply AgentServiceConfig' task in
      roles/setup-hub-acm/tasks/main.yml.

# Cleanup is also disabled while apply is disabled, so the rendered
# file above survives for you to inspect. Re-enable this alongside the
# apply task once you're done reviewing.
# - name: Clean up rendered AgentServiceConfig scratch file
#   ansible.builtin.file:
#     path: "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"
#     state: absent