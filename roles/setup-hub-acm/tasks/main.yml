---
# tasks file for setup-hub-acm
- name: Lets wait for 120 seconds for the workers to settle
  ansible.builtin.wait_for:
    timeout: 120

# Every operator Subscription below names a CatalogSource, and that is the one
# thing about them that differs disconnected: the built-in redhat-operators is
# disabled on a disconnected hub, so they have to resolve against the catalog
# oc-mirror generated for the mirrored index (cs-redhat-operator-index-v4-21 and
# the like). It is one value, acm_catalog_source, so the Subscriptions are one
# template per operator rather than a connected and a disconnected copy of each.
- name: Check the mirrored CatalogSource exists before subscribing to anything
  ansible.builtin.include_tasks: disconnected-catalog-source.yml
  when: disconnected_install | bool

- name: Render the operator Subscriptions
  ansible.builtin.template:
    src: "{{ item }}/03-subscription.yaml.j2"
    dest: "{{ role_path }}/files/{{ item }}/.rendered-03-subscription.yaml"
  loop:
    - acm
    - lvm-storage
    - metal-lb
    - oadp

- name: Report which catalog the operators will resolve against
  ansible.builtin.debug:
    msg: >-
      Subscriptions point at CatalogSource '{{ acm_catalog_source }}' in
      {{ acm_catalog_source_namespace }}
      ({{ 'disconnected' if disconnected_install | bool else 'connected' }}).

- name: Deploy ACM Operator
  shell: |
    oc apply -f "{{ role_path }}/files/acm/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/acm/02-acm-operatorgroup.yaml"
    oc apply -f "{{ role_path }}/files/acm/.rendered-03-subscription.yaml"


- name: Deploy LVM Storage Operator
  shell: |
    oc apply -f "{{ role_path }}/files/lvm-storage/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/lvm-storage/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/lvm-storage/.rendered-03-subscription.yaml"
  when: use_lvm_storage == true


- name: Deploy MetalLB Operator  
  shell: |
    oc apply -f "{{ role_path }}/files/metal-lb/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/.rendered-03-subscription.yaml"

- name: Deploy OADP Operator
  shell: |
    oc apply -f "{{ role_path }}/files/oadp/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/oadp/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/oadp/.rendered-03-subscription.yaml"

- name: Lets wait for 300 seconds for Operators to be ACTIVE
  ansible.builtin.wait_for:
     timeout: 300

- name: Setup MultiClusterHub Resource
  shell: |
    oc apply -f "{{ role_path }}/files/acm/04-multicluster-hub.yaml"

- name: Wait for the Provisioning CRD to be established
  shell: |
    oc wait --for=condition=Established crd/provisionings.metal3.io --timeout=300s
  register: provisioning_crd_wait
  retries: 3
  delay: 20
  until: provisioning_crd_wait.rc == 0

- name: Apply Provisioning configuration (required by metal3/baremetal-operator before AgentServiceConfig)
  shell: |
    oc apply -f "{{ role_path }}/files/acm/04b-provisioning.yaml"

- name: Setup LVMCluster Resource
  shell: |
    oc apply -f "{{ role_path }}/files/lvm-storage/04-lvm-cluster.yaml"
  when: use_lvm_storage == true

- name: Render MetalLB IPAddressPool
  template:
    src: metal-lb/05-ip-pool.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-ip-pool.yaml"

- name: Setup MetalLB Resource
  shell: |
    oc apply -f "{{ role_path }}/files/metal-lb/04-metalLB.yaml"
    oc apply -f "{{ role_path }}/files/.rendered-05-ip-pool.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/06-L2Advertisement.yaml"

- name: Clean up rendered scratch files
  ansible.builtin.file:
    path: "{{ role_path }}/files/.rendered-05-ip-pool.yaml"
    state: absent


# Everything below this point renders differently depending on whether the hub
# talks to the internet or only to the mirror registry. The three includes are
# prerequisites for the disconnected AgentServiceConfig rather than optional
# extras: it references the mirror-registry ConfigMap the first one creates,
# and the osImage urls the second one stages. Connected runs skip all of it and
# render exactly what they always did.
- name: Set up the mirror registry trust and mirror mappings (disconnected)
  ansible.builtin.include_tasks: disconnected-mirror-config.yml
  when: disconnected_install | bool

- name: Stage the RHCOS live ISOs on the helper's web server (disconnected)
  ansible.builtin.include_tasks: disconnected-os-images.yml
  when: disconnected_install | bool

- name: Create the ClusterImageSets for the mirrored releases (disconnected)
  ansible.builtin.include_tasks: disconnected-cluster-image-sets.yml
  when: disconnected_install | bool

# Both branches render to the same path, so the review-and-apply step below
# (and the one in the README) is the same either way.
- name: Render AgentServiceConfig (connected)
  template:
    src: acm/05-agentserviceconfig.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"
  when: not (disconnected_install | bool)

- name: Render AgentServiceConfig (disconnected)
  template:
    src: acm/05-agentserviceconfig-disconnected.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"
  when: disconnected_install | bool

#- name: Wait for the AgentServiceConfig CRD to be established
#  shell: |
#    oc wait --for=condition=Established crd/agentserviceconfigs.agent-install.openshift.io --timeout=300s
#  register: asc_crd_wait
#  retries: 3
#  delay: 20
#  until: asc_crd_wait.rc == 0

# REVIEW-BEFORE-APPLY: rendered file is left in place at the path shown
# below - inspect it, then re-enable this task (remove the comment
# markers) once you've manually validated it.
# - name: Apply AgentServiceConfig
#   shell: |
#     oc apply -f "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"

- name: AgentServiceConfig apply is disabled pending manual review
  debug:
    msg: >-
      Apply is commented out - review
      {{ role_path }}/files/.rendered-05-agentserviceconfig.yaml
      ({{ 'disconnected' if disconnected_install | bool else 'connected' }} rendering)
      then re-enable the 'Apply AgentServiceConfig' task in
      roles/setup-hub-acm/tasks/main.yml.

# Cleanup is also disabled while apply is disabled, so the rendered
# file above survives for you to inspect. Re-enable this alongside the
# apply task once you're done reviewing.
