---
# tasks file for setup-hub-acm
- name: Lets wait for 120 seconds for the workers to settle
  ansible.builtin.wait_for:
    timeout: 120

- name: Deploy ACM Operator
  shell: |
    oc apply -f "{{ role_path }}/files/acm/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/acm/02-acm-operatorgroup.yaml"
    oc apply -f "{{ role_path }}/files/acm/03-subscription.yaml"


- name: Deploy LVM Storage Operator
  shell: |
    oc apply -f "{{ role_path }}/files/lvm-storage/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/lvm-storage/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/lvm-storage/03-subscription.yaml"
  when: use_lvm_storage == true


- name: Deploy MetalLB Operator  
  shell: |
    oc apply -f "{{ role_path }}/files/metal-lb/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/metal-lb/03-subscription.yaml"

- name: Deploy OADP Operator
  shell: |
    oc apply -f "{{ role_path }}/files/oadp/01-namespace.yaml"
    oc apply -f "{{ role_path }}/files/oadp/02-operatorGroup.yaml"
    oc apply -f "{{ role_path }}/files/oadp/03-subscription.yaml"

- name: Lets wait for 300 seconds for Operators to be ACTIVE
  ansible.builtin.wait_for:
     timeout: 300

- name: Setup MultiClusterHub Resource
  shell: |
    oc apply -f "{{ role_path }}/files/acm/04-multicluster-hub.yaml"

- name: Wait for the Provisioning CRD to be established
  shell: |
    oc wait --for=condition=Established crd/provisionings.metal3.io --timeout=300s
  register: provisioning_crd_wait
  retries: 3
  delay: 20
  until: provisioning_crd_wait.rc == 0

- name: Apply Provisioning configuration (required by metal3/baremetal-operator before AgentServiceConfig)
  shell: |
    oc apply -f "{{ role_path }}/files/acm/04b-provisioning.yaml"

- name: Setup LVMCluster Resource
  shell: |
    oc apply -f "{{ role_path }}/files/lvm-storage/04-lvm-cluster.yaml"
  when: use_lvm_storage == true

- name: Render MetalLB IPAddressPools (one single-address pool per hosted cluster)
  template:
    src: metal-lb/05-ip-pool.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-ip-pool.yaml"

- name: Render MetalLB L2Advertisements (one per pool)
  template:
    src: metal-lb/06-L2Advertisement.yaml.j2
    dest: "{{ role_path }}/files/.rendered-06-l2advertisement.yaml"

- name: Setup MetalLB Resource
  shell: |
    oc apply -f "{{ role_path }}/files/metal-lb/04-metalLB.yaml"

# The old shared hcp-ip-pool covered .60-.63, which the per-cluster pools now
# claim one address at a time. MetalLB refuses overlapping IPAddressPools, so
# on a hub that was built before this change the old pool has to go first.
# Any kube-apiserver Service still holding an address from it is reassigned on
# MetalLB's next converge - to the same address, since the per-cluster pool
# for that hosted cluster contains exactly the address DNS publishes for it.
- name: Remove the superseded shared MetalLB pool and advertisement
  shell: |
    oc delete l2advertisement "{{ metallb_legacy_l2advertisement_name }}" -n metallb-system --ignore-not-found
    oc delete ipaddresspool "{{ metallb_legacy_pool_name }}" -n metallb-system --ignore-not-found
  when: metallb_remove_legacy_shared_pool | bool

- name: Setup per-hosted-cluster MetalLB IPAddressPools and L2Advertisements
  shell: |
    oc apply -f "{{ role_path }}/files/.rendered-05-ip-pool.yaml"
    oc apply -f "{{ role_path }}/files/.rendered-06-l2advertisement.yaml"

- name: Clean up rendered scratch files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ role_path }}/files/.rendered-05-ip-pool.yaml"
    - "{{ role_path }}/files/.rendered-06-l2advertisement.yaml"


- name: Render AgentServiceConfig
  template:
    src: acm/05-agentserviceconfig.yaml.j2
    dest: "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"

#- name: Wait for the AgentServiceConfig CRD to be established
#  shell: |
#    oc wait --for=condition=Established crd/agentserviceconfigs.agent-install.openshift.io --timeout=300s
#  register: asc_crd_wait
#  retries: 3
#  delay: 20
#  until: asc_crd_wait.rc == 0

# REVIEW-BEFORE-APPLY: rendered file is left in place at the path shown
# below - inspect it, then re-enable this task (remove the comment
# markers) once you've manually validated it.
# - name: Apply AgentServiceConfig
#   shell: |
#     oc apply -f "{{ role_path }}/files/.rendered-05-agentserviceconfig.yaml"

- name: AgentServiceConfig apply is disabled pending manual review
  debug:
    msg: >-
      Apply is commented out - review
      {{ role_path }}/files/.rendered-05-agentserviceconfig.yaml
      then re-enable the 'Apply AgentServiceConfig' task in
      roles/setup-hub-acm/tasks/main.yml.

