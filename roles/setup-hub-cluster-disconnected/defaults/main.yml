---
# defaults file for setup-hub-cluster-disconnected

# Whether to cut this cluster's nodes off from the real internet: a RETURN at the
# top of libvirt's LIBVIRT_PRT chain (nat) so their traffic is never MASQUERADEd,
# plus a REJECT at the top of LIBVIRT_FWO (filter) so it does not leave the
# hypervisor un-NATed either. See the block at the top of tasks/main.yml.
# Set to false to install from the mirror registry while leaving the nodes able
# to reach the internet - useful when debugging whether a failure is genuinely
# caused by the disconnection.
hub_disconnected_block_node_nat: true

# ip_list keys whose addresses get cut off. Bootstrap + masters + workers only:
# the mirror registry, MinIO, the helper services and the load balancer are
# deliberately left connected (that is what makes them "the disconnected
# environment's infrastructure" rather than part of the cluster).
hub_disconnected_node_ip_keys:
  - hubd_bootstrap
  - hubd_master1
  - hubd_master2
  - hubd_master3
  - hubd_worker1
  - hubd_worker2
  - hubd_worker3

# Where oc-mirror's cluster-resources manifests (ImageDigestMirrorSet /
# ImageTagMirrorSet / CatalogSource) are staged on the hypervisor after being
# pulled off the mirror-registry VM. They are needed at two different points in
# this role, which is why they get staged outside the install directory rather
# than fetched straight into it:
#   1. before the install starts at all, so `oc adm release extract` can be
#      handed the release mirror map via --idms-file
#   2. as manifests copied into the install directory, so the cluster itself
#      keeps the same redirection at runtime
# The staging directory is rebuilt from the archive on every run, so stale
# manifests from a previous oc-mirror run are never reused.
hub_disconnected_cluster_resources_archive: /tmp/hubd-cluster-resources.tar.gz
hub_disconnected_cluster_resources_dir: /tmp/hubd-cluster-resources
