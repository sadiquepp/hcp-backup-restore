---
# Tasks file for setup-mirror-registry-trust
#
# Runs on the baremetal host (localhost) - fetches the mirror registry's
# self-signed CA back from the VM, trusts it locally, and logs baremetal's own
# podman in to the registry.
#
# mirror_registry_authfile defaults to /root/.docker/config.json, which is the
# host's shared podman/docker config rather than a file private to this lab, so
# the login below MERGES the mirror registry's entry into whatever credentials
# are already there (registry.redhat.io, quay.io, cloud.openshift.com...).
# Anything pointed at that authfile therefore sees all of them - which is fine
# for oc-mirror, but not for the cluster, so roles/setup-hub-cluster-disconnected
# reduces it back down to the mirror registry's single entry before putting it
# in install-config.yaml. Point mirror_registry_authfile elsewhere if you would
# rather keep this lab's credentials separate.
#
# Must run after roles/setup-mirror-registry, since that's what generates the CA
# on the VM in the first place.

- name: Ensure podman is installed on baremetal
  dnf:
    name: podman
    state: present

- name: Fetch the Quay root CA from the mirror-registry VM
  ansible.builtin.fetch:
    src: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
    dest: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
    flat: true
  delegate_to: "{{ lab_network_prefix }}.{{ ip_list.registry }}"

- name: Update baremetal's CA trust bundle
  ansible.builtin.command:
    cmd: update-ca-trust extract

- name: Login to the mirror registry and generate password
  shell: |
    podman login --authfile {{ mirror_registry_authfile }} \
    -u init \
    -p {{ mirror_registry_password }} \
    {{ mirror_registry_domain }}:{{ mirror_registry_port }}

- name: Report the authfile location for other tooling (oc-mirror, skopeo, etc.)
  debug:
    msg: >-
      Baremetal is logged in to {{ mirror_registry_domain }}:{{ mirror_registry_port }} -
      use --authfile {{ mirror_registry_authfile }} with podman/skopeo/oc-mirror
      commands run from here.
