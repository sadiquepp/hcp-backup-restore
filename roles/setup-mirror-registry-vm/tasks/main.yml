---
# Tasks file for setup-mirror-registry-vm
#
# Creates the mirror-registry VM on the baremetal host (localhost).
# Reuses the same already-customized RHEL9 base image that
# roles/setup-bm-host prepares for helper (root password + SSH key
# injected, cloud-init removed) - no need to redo that step here.
# Runs only when disconnected_install is true.

- name: Check the mirror-registry Disk Existence
  stat:
    path: "/var/lib/libvirt/images/{{ mirror_registry_disk }}"
  register: mirror_registry_disk_status
  tags:
    - virt

- name: Create mirror-registry VM Disk (500G, sparse, no preallocation)
  ansible.builtin.command:
    cmd: "qemu-img create -f qcow2 /var/lib/libvirt/images/{{ mirror_registry_disk }} {{ mirror_registry_disk_size }}"
  when: not mirror_registry_disk_status.stat.exists
  tags:
    - virt

- name: Report actual partition layout of the base image (verify mirror_registry_resize_partition matches)
  ansible.builtin.command:
   cmd: "virt-filesystems --long --parts --blkdevs -h -a roles/setup-bm-host/files/{{ rhel9_kvm_image }}"
  register: base_image_filesystems
  changed_when: false
  when: not mirror_registry_disk_status.stat.exists
  tags:
    - virt

- name: Show base image partition layout
  ansible.builtin.debug:
  msg: "{{ base_image_filesystems.stdout_lines }}"
  when: not mirror_registry_disk_status.stat.exists
  tags:
    - virt

- name: Expand base RHEL9 image into the new 500G disk (virt-resize)
  ansible.builtin.command:
    cmd: >
      virt-resize --expand {{ mirror_registry_resize_partition }}
      roles/setup-bm-host/files/{{ rhel9_kvm_image }}
      /var/lib/libvirt/images/{{ mirror_registry_disk }}
  when: not mirror_registry_disk_status.stat.exists
  tags:
    - virt

- name: Check if mirror-registry VM is running using virsh
  shell: "virsh dominfo {{ mirror_registry_name }} 2>/dev/null | grep 'State' | awk '{print $2}'"
  register: mirror_registry_vm_state
  changed_when: false
  tags:
    - virt

- name: Define the mirror-registry VM
  shell: |
    virt-install \
    --import \
    --name "{{ mirror_registry_name }}" \
    --memory "{{ mirror_registry_memory }}" \
    --vcpus "{{ mirror_registry_vcpus }}" \
    --disk "/var/lib/libvirt/images/{{ mirror_registry_disk }}",format=qcow2,cache=none,bus=virtio \
    --os-variant=rhel9.5 \
    --memballoon model=virtio,freePageReporting=on \
    --noautoconsole \
    --network network:default,mac=52:54:00:e2:54:{{ ip_list.mirror_registry }}
  when: mirror_registry_vm_state.stdout == ''
  tags:
    - virt

- name: Wait for the mirror-registry VM to boot
  shell: |
    sleep 120s
  when: mirror_registry_vm_state.stdout == ''
