---
# Tasks file for setup-mirror-registry
#
# Runs delegated to the mirror-registry VM (see setup_mirror_registry.yaml).
# Adapted from sadiquepp/openshift's AWS bastion disconnected-install
# playbook, translated to this repo's baremetal/libvirt conventions and
# reusing vars already established here (pull_secret from vault.yaml,
# hub_domain-based hostname) instead of duplicating them.

- name: Wait for SSH on the mirror-registry VM
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 300
    
- name: Install required packages
  dnf:
    name:
      - podman
      - openssl
      - tar
    state: present
  become: true

- name: Create working directory
  file:
    path: /root/mirror
    state: directory

- name: Check if tool tarballs already exist
  stat:
    path: "/root/mirror/{{ item | basename }}"
  loop:
    - "https://mirror.openshift.com/pub/cgw/mirror-registry/latest/mirror-registry-amd64.tar.gz"
    - "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ mirror_ocp_version }}/oc-mirror.rhel9.tar.gz"
    - "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ mirror_ocp_version }}/openshift-client-linux-amd64-rhel9.tar.gz"
  register: tarball_stats
  loop_control:
    label: "{{ item | basename }}"

- name: Download mirror-registry/oc/oc-mirror tarballs
  get_url:
    url: "{{ item.item }}"
    dest: "/root/mirror/{{ item.item | basename }}"
  loop: "{{ tarball_stats.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
  when: not item.stat.exists

- name: Unarchive tool tarballs
  unarchive:
    src: "/root/mirror/{{ item }}"
    dest: /root/mirror/
    remote_src: true
  loop:
    - mirror-registry-amd64.tar.gz
    - oc-mirror.rhel9.tar.gz
    - openshift-client-linux-amd64-rhel9.tar.gz

- name: Copy CLI binaries to /usr/bin
  copy:
    src: "/root/mirror/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    remote_src: true
    mode: '0755'
  loop:
    - oc
    - oc-mirror
    - mirror-registry
  become: true

- name: Create Quay storage directory
  file:
    path: "{{ mirror_registry_quay_root }}"
    state: directory
  become: true

- name: Check if mirror registry is already running
  shell: |
    podman login -u init -p {{ mirror_registry_password }} {{ mirror_registry_domain }}:{{ mirror_registry_port }} 2>/dev/null
  register: registry_check
  ignore_errors: true
  changed_when: false

- name: Install Mirror Registry
  shell: |
    /root/mirror/mirror-registry install \
      --quayHostname {{ mirror_registry_domain }}:{{ mirror_registry_port }} \
      --quayRoot {{ mirror_registry_quay_root }} \
      --quayStorage {{ mirror_registry_quay_root }} \
      --initPassword {{ mirror_registry_password }}
  become: true
  when: registry_check.rc != 0

- name: Copy Quay Root CA into system trust
  copy:
    src: "{{ mirror_registry_quay_root }}/quay-rootCA/rootCA.pem"
    dest: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
    remote_src: true
    mode: '0644'
  become: true

- name: Update CA trust bundle
  shell: update-ca-trust extract
  become: true

- name: Copy base pull secret
  copy:
    dest: /root/mirror/pull-secret.txt
    content: "{{ pull_secret }}"

- name: Log in to the mirror registry (merges its credentials into the pull secret)
  shell: |
    podman login --authfile /root/mirror/pull-secret.txt \
      -u init -p {{ mirror_registry_password }} \
      {{ mirror_registry_domain }}:{{ mirror_registry_port }}

- name: Create .docker directory
  file:
    path: ~/.docker
    state: directory
    mode: '0700'
  become: true

- name: Copy pull secret to ~/.docker/config.json
  copy:
    src: /root/mirror/pull-secret.txt
    dest: ~/.docker/config.json
    remote_src: true
  become: true

- name: Render ImageSetConfiguration
  template:
    src: imageset-config.yaml.j2
    dest: /root/mirror/imageset-config.yaml
  when: registry_check.rc != 0

- name: Create oc-mirror workspace directory
  file:
    path: /root/mirror/oc-mirror-output
    state: directory
  when: registry_check.rc != 0

# oc-mirror pulls thousands of images and regularly trips over a
# transient failure (a single package/blob that fails to pull, a registry
# 5xx, a timeout). That is NOT a reason to tear down the VM and start
# over: everything up to this point is already done, and oc-mirror v2
# keeps its cache/workspace under /root/mirror/oc-mirror-output, so a
# re-run only fetches what is still missing. The rescue below prints the
# exact command to re-run by hand.
- name: Mirror images to the local registry (oc-mirror v2)
  when: registry_check.rc != 0
  block:
    - name: Run oc-mirror
      shell: |
        cd /root/mirror
        oc mirror -c imageset-config.yaml --workspace file://oc-mirror-output/ \
          docker://{{ mirror_registry_domain }}:{{ mirror_registry_port }} --v2
      register: oc_mirror_result

  rescue:
    - name: How to re-run oc-mirror manually (no redeploy needed)
      debug:
        msg:
          - "oc-mirror FAILED - this is often transient (one package/blob failed to pull)."
          - "Do NOT redeploy the mirror-registry VM: the registry, tools, pull secret and"
          - "ImageSetConfiguration are all in place already, and oc-mirror v2 resumes from its"
          - "workspace, so a re-run only pulls what is still missing."
          - ""
          - "Re-run it by hand on the mirror-registry VM:"
          - ""
          - "  ssh root@{{ lab_network_prefix }}.{{ ip_list.registry }}"
          - "  cd /root/mirror"
          - "  oc mirror -c imageset-config.yaml --workspace file://oc-mirror-output/ docker://{{ mirror_registry_domain }}:{{ mirror_registry_port }} --v2"
          - ""
          - "Repeat that command until it completes - each attempt picks up where the last left off."
          - "Logs: /root/mirror/oc-mirror-output/working-dir/logs/ (and /root/mirror/.oc-mirror.log)."
          - ""
          - "Note: re-running 'ansible-playbook setup_mirror_registry.yaml --ask-vault-pass --tags mirror'"
          - "will SKIP this task now that the registry answers 'podman login', which is why the manual"
          - "command above is the way to finish the mirror. Once it succeeds, carry on with the rest of"
          - "the disconnected flow (setup_mirror_registry.yaml --tags mirror-trust, then the hub install)."

    - name: Fail after printing the manual re-run instructions
      ansible.builtin.fail:
        msg: >-
          oc-mirror failed on {{ mirror_registry_domain }} - see the message above for
          the exact command to re-run it manually on the VM (no redeploy required).

- name: Report mirror result
  debug:
    msg: "oc-mirror finished - check /root/mirror/oc-mirror-output on {{ mirror_registry_domain }} for logs/manifests"
