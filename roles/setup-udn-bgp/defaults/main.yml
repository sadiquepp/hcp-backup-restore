---
# defaults file for roles/setup-udn-bgp
#
# Deployer-facing values live in vars.yaml under "UDN + BGP lab".

## Namespace FRR-K8s is deployed into when the Cluster Network Operator
## brings it up via additionalRoutingCapabilities. This is NOT metallb-system
## - the upstream OKEP examples use that namespace because upstream installs
## FRR-K8s through MetalLB, but on OpenShift the CNO owns the deployment and
## puts it here. Applying an FRRConfiguration to the wrong namespace is
## silently inert: the CR is accepted and nothing ever reads it.
udn_bgp_frrk8s_namespace: openshift-frr-k8s

## Label that marks the FRRConfiguration objects RouteAdvertisements is
## allowed to build on. RouteAdvertisements refuses to act if its
## frrConfigurationSelector matches more than one FRRConfiguration, so this
## has to select exactly the base peering CR for the phase in play.
udn_bgp_frr_label_key: routeAdvertisements

## Label put on the ClusterUserDefinedNetworks so a RouteAdvertisements CR
## can select them as a set.
udn_bgp_cudn_label_key: bgp

## How long to wait for the cluster network operator to finish rolling out a
## change to the Network CR. Enabling FRR or flipping gateway mode restarts
## every ovnkube-node pod, which on this lab's three workers takes a few
## minutes.
udn_bgp_rollout_timeout: 900

## Kubernetes NMState Operator - the source of the
## NodeNetworkConfigurationPolicy API. Every NNCP this role applies (fabric
## NIC addresses, VRF-Lite VLANs, EVPN VTEP addresses) needs it, so the role
## installs it if it is absent.
udn_bgp_nmstate_namespace: openshift-nmstate
udn_bgp_nmstate_channel: stable

## Catalog the NMState subscription resolves against. Follows
## acm_catalog_source when vars.yaml sets one - which is how a disconnected
## hub points every operator at its mirrored catalog - and otherwise uses the
## Red Hat operator catalog. A subscription pointed at a catalog that is not
## there does not fail; it sits in ResolutionFailed indefinitely.
udn_bgp_catalog_source: "{{ acm_catalog_source | default('redhat-operators', true) }}"
udn_bgp_catalog_source_namespace: "{{ acm_catalog_source_namespace | default('openshift-marketplace', true) }}"
