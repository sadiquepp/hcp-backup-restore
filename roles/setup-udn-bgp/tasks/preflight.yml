---
# Cluster-side pre-flight.
#
# Every check here answers "can this cluster do the thing", which is a
# question about its VERSION and network plugin - NOT about whether the
# feature's CRDs are already present.
#
# That distinction is the whole point of this file. routeadvertisements
# .k8s.ovn.org and vteps.k8s.ovn.org are installed by the Cluster Network
# Operator when the feature is switched on, which is what enable.yml does
# immediately after this runs. Their absence is the normal state of a
# perfectly capable cluster that has not been through the enable step yet.
# Treating it as "too old" made this play refuse to start on a 4.22.10
# cluster - demanding, as a precondition, the very thing the next task
# creates.
#
# So: gate on version, report CRD presence as information, and verify the
# CRDs after enable.yml, where their absence really is a failure.

- name: Read the cluster version
  ansible.builtin.command:
    cmd: oc get clusterversion version -o jsonpath={.status.desired.version}
  register: udn_bgp_cluster_version
  changed_when: false

- name: Read the configured network plugin
  ansible.builtin.command:
    cmd: >-
      oc get network.operator.openshift.io cluster
      -o jsonpath={.spec.defaultNetwork.type}
  register: udn_bgp_network_type
  changed_when: false

- name: Report the cluster under test
  ansible.builtin.debug:
    msg: >-
      Targeting {{ udn_bgp_target_hub }} at {{ hub_kubeconfig }} -
      OpenShift {{ udn_bgp_cluster_version.stdout }},
      network plugin {{ udn_bgp_network_type.stdout }}

- name: Fail if the cluster is too old for route advertisements
  ansible.builtin.assert:
    that: udn_bgp_cluster_version.stdout is version(udn_bgp_bgp_min_version, '>=')
    fail_msg: >-
      BGP route advertisements need OpenShift {{ udn_bgp_bgp_min_version }} or
      later. This cluster is {{ udn_bgp_cluster_version.stdout }}.

- name: Fail if this is not an OVN-Kubernetes cluster
  ansible.builtin.assert:
    that: udn_bgp_network_type.stdout == 'OVNKubernetes'
    fail_msg: >-
      Route advertisements, user-defined networks and VRF-Lite are all
      OVN-Kubernetes features. This cluster's defaultNetwork.type is
      '{{ udn_bgp_network_type.stdout }}'.

# Version, not CRD presence - see the note at the top of this file.
- name: Record whether this cluster's version supports EVPN
  ansible.builtin.set_fact:
    udn_bgp_has_evpn: >-
      {{ udn_bgp_cluster_version.stdout is version(udn_bgp_evpn_min_version, '>=') }}

- name: Report EVPN availability
  ansible.builtin.debug:
    msg: >-
      {% if udn_bgp_has_evpn | bool %}
      EVPN is available on this cluster ({{ udn_bgp_cluster_version.stdout }}
      >= {{ udn_bgp_evpn_min_version }}) - phase 4 can run against it.
      {% else %}
      EVPN is NOT available: it is GA in OpenShift
      {{ udn_bgp_evpn_min_version }} and this cluster is
      {{ udn_bgp_cluster_version.stdout }}. Phases 1-3 are unaffected. You can
      still build the EVPN fabric (clab_topology: evpn) and hand the cluster
      off to it with VRF-Lite at the border leaf - see the README.
      {% endif %}

# Informational only. Absent is the expected answer on a cluster that has not
# been enabled yet; present means a previous run already did it.
- name: Check whether the feature has already been enabled
  ansible.builtin.shell:
    cmd: >-
      oc get crd routeadvertisements.k8s.ovn.org vteps.k8s.ovn.org
      -o name --ignore-not-found 2>/dev/null || true
  register: udn_bgp_feature_crds
  changed_when: false

- name: Report how far this cluster has already been taken
  ansible.builtin.debug:
    msg: >-
      Feature CRDs present:
      {{ udn_bgp_feature_crds.stdout_lines | default(['(none yet)'], true) }}

      These are installed by the Cluster Network Operator when the feature is
      switched on, so "(none yet)" is normal on a first run - the enable step
      creates them and this play checks afterwards that they appeared.

- name: Check whether the NMState operator is present
  ansible.builtin.command:
    cmd: oc get crd nodenetworkconfigurationpolicies.nmstate.io
  register: udn_bgp_pf_nncp
  failed_when: false
  changed_when: false

- name: Report NMState availability
  ansible.builtin.debug:
    msg: >-
      {{ 'NMState is installed - NodeNetworkConfigurationPolicy is available.'
         if udn_bgp_pf_nncp.rc == 0 else
         'NMState is NOT installed. Every phase from "default" on applies
          NodeNetworkConfigurationPolicies, so the run will install the
          Kubernetes NMState Operator from catalog ' ~ udn_bgp_catalog_source ~
          ' and create its NMState instance before using them.' }}

# MetalLB is already running on this lab for the hosted clusters' API VIPs,
# and MetalLB ships its own FRR-K8s. The CNO deploying a second one into
# openshift-frr-k8s is supported and is the intended arrangement, but two
# FRR-K8s instances both claiming the node's FRR is not - so it is worth
# knowing which is present before rather than after enabling the feature.
- name: Look for an existing FRR-K8s deployment
  ansible.builtin.shell:
    cmd: >-
      oc get daemonset -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name --no-headers
      | grep -i frr-k8s || true
  register: udn_bgp_existing_frr
  changed_when: false

- name: Report existing FRR-K8s daemonsets
  ansible.builtin.debug:
    msg: >-
      FRR-K8s daemonsets currently on the cluster:
      {{ udn_bgp_existing_frr.stdout_lines | default(['(none)'], true) }}

      This lab runs MetalLB in L2 mode for the hosted clusters' API VIPs, so
      MetalLB is not competing for BGP sessions. If you later switch a
      MetalLB pool to BGP mode, point it at the CNO's FRR-K8s in
      {{ udn_bgp_frrk8s_namespace }} rather than letting the MetalLB operator
      stand up a second instance.

- name: Check the OVN-Kubernetes gateway mode
  ansible.builtin.command:
    cmd: >-
      oc get network.operator.openshift.io cluster
      -o jsonpath={.spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig.routingViaHost}
  register: udn_bgp_gateway_mode
  changed_when: false

- name: Report the gateway mode
  ansible.builtin.debug:
    msg: >-
      routingViaHost is '{{ udn_bgp_gateway_mode.stdout | default('', true) or "false (shared gateway mode, the default)" }}'.
      Phases 1 and 2 work in either mode. Phase 3 (VRF-Lite) and phase 4
      (EVPN) both require LOCAL gateway mode (routingViaHost: true) - that is
      an OVN-Kubernetes restriction, not a lab one.
