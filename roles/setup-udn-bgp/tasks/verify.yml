---
# Verification.
#
# Every check here answers a question that "the CR applied cleanly" does not.
# A RouteAdvertisements CR is accepted long before it works, and a BGP
# session being Established proves only that two daemons agree - not that a
# pod can reach anything, and certainly not that a tenant cannot.

- name: Show RouteAdvertisements status
  ansible.builtin.command:
    cmd: oc get routeadvertisements -o wide
  register: udn_bgp_ra_status
  changed_when: false
  failed_when: false

- name: Report RouteAdvertisements status
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_ra_status.stdout_lines }}

      'Accepted' is what to look for. A RouteAdvertisements that is not
      accepted says why in .status.conditions - the two usual causes are
      overlapping subnets between UDNs being leaked into one VRF
      (targetVRF: default), and frrConfigurationSelector matching more than
      one FRRConfiguration.

- name: Show the FRRConfigurations, including the ones OVN-Kubernetes generated
  ansible.builtin.command:
    cmd: "oc get frrconfiguration -n {{ udn_bgp_frrk8s_namespace }}"
  register: udn_bgp_frrcfg
  changed_when: false
  failed_when: false

- name: Report FRRConfigurations
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_frrcfg.stdout_lines }}

      The route-advertisements-* objects are generated by OVN-Kubernetes from
      the RouteAdvertisements CR and carry the prefixes actually being
      advertised. If they are absent, the RouteAdvertisements never took
      effect regardless of what its status says.

- name: Show NodeNetworkConfigurationPolicy status
  ansible.builtin.command:
    cmd: oc get nncp
  register: udn_bgp_nncp
  changed_when: false
  failed_when: false

- name: Report NNCP status
  ansible.builtin.debug:
    msg: "{{ udn_bgp_nncp.stdout_lines }}"

- name: Show BGP sessions from the border leaf's point of view
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp summary'
      -c 'show bgp ipv4 unicast'
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_leaf_summary
  changed_when: false
  failed_when: false

- name: Report the border leaf's view
  ansible.builtin.debug:
    msg: "{{ udn_bgp_leaf_summary.stdout_lines }}"

- name: Show each tenant VRF's routing table on the border leaf
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp vrf {{ item.name }} ipv4 unicast'
      -c 'show ip route vrf {{ item.name }}'
  loop: "{{ udn_bgp_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_leaf_vrf
  changed_when: false
  failed_when: false
  when: udn_phase in ['vrflite', 'evpn']

- name: Report each tenant VRF's routes
  ansible.builtin.debug:
    msg: >-
      VRF {{ item.item.name }}:
      {{ item.stdout_lines | default([], true) }}
  loop: "{{ udn_bgp_leaf_vrf.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: udn_phase in ['vrflite', 'evpn']

# EVPN adds a layer that can be healthy at the control plane and dead at the
# data plane - sessions up, type-5 routes on both sides, and no tunnel,
# because neither VTEP can reach the other. Underlay first, overlay second.
- name: Show the EVPN and VTEP state
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp l2vpn evpn summary'
      -c 'show bgp l2vpn evpn'
      -c 'show ip route {{ udn_bgp_vtep_prefix }}.0/24 longer-prefixes'
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_evpn_verify
  changed_when: false
  failed_when: false
  when: udn_phase == 'evpn'

- name: Report the EVPN and VTEP state
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_evpn_verify.stdout_lines | default([], true) }}

      Check in this order: the VTEP routes are present (no route to a node's
      VTEP means no tunnel to it, whatever the EVPN table says), then the
      evpn summary shows a session per node, then type-5 routes appear
      carrying each tenant's VNI.
  when: udn_phase == 'evpn'

- name: Show which VTEP address each node was assigned
  ansible.builtin.command:
    cmd: >-
      oc get nodes -o custom-columns=NODE:.metadata.name,VTEP:.metadata.annotations.k8s\.ovn\.org/node-vtep-ips
  register: udn_bgp_node_vteps
  changed_when: false
  failed_when: false
  when: udn_phase == 'evpn'

- name: Report the node VTEP annotations
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_node_vteps.stdout_lines | default([], true) }}

      Empty for a node means OVN-Kubernetes did not discover an address on it
      inside {{ udn_bgp_vtep_prefix }}.0/24 - check that node's
      {{ udn_bgp_vtep_iface }} interface and its nncp. The exact annotation
      key varies by release; if this column is empty for every node, read
      `oc get node <node> -o yaml | grep -i vtep` instead of trusting it.
  when: udn_phase == 'evpn'

- name: Print the reachability tests to run by hand
  ansible.builtin.debug:
    msg: |
      The checks above are control plane only. These are the ones that
      actually prove the data plane, and they are left as explicit commands
      because each needs a pod name from your cluster:

        # pick a pod per tenant
      {% for t in udn_bgp_tenants %}
        oc -n udn-{{ t.name }} get pods -o wide
      {% endfor %}

      1. The pod's address comes from the UDN, not the cluster network:
      {% for t in udn_bgp_tenants %}
           oc -n udn-{{ t.name }} exec <pod> -- ip -br addr show eth0
           # expect an address in {{ t.udn_subnet_shared if udn_phase == 'shared' else t.udn_subnet }}
      {% endfor %}

      2. Egress is NOT SNATed once the network is advertised. Run a ping and
         watch the leaf see the real pod IP as the source - this is the
         single clearest proof the advertisement took effect:
           docker exec clab-{{ clab_lab_name }}-leaf1 tcpdump -ni any icmp
      {% if udn_phase in ['vrflite', 'evpn'] %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 {{ udn_bgp_tenants[0].external_host }}
      {% else %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
      {% endif %}

      {% if udn_phase in ['vrflite', 'evpn'] %}
      3. Tenant isolation - the test that matters, and the one that must FAIL:
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 -W2 {{ udn_bgp_tenants[1].external_host }}
         This MUST time out. {{ udn_bgp_tenants[0].name }} and {{ udn_bgp_tenants[1].name }} carry the same pod
         subnet and their external networks are one hop away on the same
         physical link; if this succeeds, the VRFs are leaking and VRF-Lite
         is not doing its job. Check that targetVRF is 'auto' and that the
         cluster is in local gateway mode.

      4. And the positive half of the same test:
           oc -n udn-{{ udn_bgp_tenants[1].name }} exec <pod> -- ping -c3 {{ udn_bgp_tenants[1].external_host }}
      {% endif %}

      5. Confirm the node learned fabric routes over BGP rather than being
         statically pointed at anything:
           oc debug node/{{ udn_bgp_node_names[clab_fabric_nodes[0].ip_key] }} -- chroot /host ip route show proto bgp
      {% if udn_phase in ['vrflite', 'evpn'] %}
           oc debug node/{{ udn_bgp_node_names[clab_fabric_nodes[0].ip_key] }} -- chroot /host ip route show vrf {{ udn_bgp_tenants[0].name }}
      {% endif %}

      6. And confirm the thing this lab is careful NOT to have changed - the
         node's default route still points at virbr0:
           oc debug node/{{ udn_bgp_node_names[clab_fabric_nodes[0].ip_key] }} -- chroot /host ip route show default
           # expect: default via {{ lab_network_prefix }}.1
