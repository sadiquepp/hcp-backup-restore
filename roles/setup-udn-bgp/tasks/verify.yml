---
# Verification.
#
# Every check here answers a question that "the CR applied cleanly" does not.
# A RouteAdvertisements CR is accepted long before it works, and a BGP
# session being Established proves only that two daemons agree - not that a
# pod can reach anything, and certainly not that a tenant cannot.
#
# Every report below hands debug a LIST, never a multi-line string.
# ansible.builtin.debug prints a list one element per line; a string is
# printed as one JSON blob with literal \n in it, which is unreadable for
# output that is meant to be read and for commands that are meant to be
# copied. Hence stdout_lines rather than stdout, and .splitlines() on any
# prose that goes with it.

- name: Show RouteAdvertisements status
  ansible.builtin.command:
    cmd: oc get routeadvertisements -o wide
  register: udn_bgp_ra_status
  changed_when: false
  failed_when: false

- name: Report RouteAdvertisements status
  ansible.builtin.debug:
    msg: "{{ udn_bgp_ra_status.stdout_lines + udn_bgp_ra_note.splitlines() }}"
  vars:
    udn_bgp_ra_note: |

      'Accepted' is what to look for. One that is not accepted says why in
      .status.conditions, and the usual causes are: targetVRF set to the
      string 'default' (it must be unset - see the CR comments), overlapping
      subnets between UDNs leaked into the default VRF, two CRs selecting the
      same network, and frrConfigurationSelector matching more than one
      FRRConfiguration.

- name: Show the FRRConfigurations, including the ones OVN-Kubernetes generated
  ansible.builtin.command:
    cmd: "oc get frrconfiguration -n {{ udn_bgp_frrk8s_namespace }}"
  register: udn_bgp_frrcfg
  changed_when: false
  failed_when: false

- name: Report FRRConfigurations
  ansible.builtin.debug:
    msg: "{{ udn_bgp_frrcfg.stdout_lines + udn_bgp_frrcfg_note.splitlines() }}"
  vars:
    udn_bgp_frrcfg_note: |

      The route-advertisements-* objects are generated by OVN-Kubernetes from
      the RouteAdvertisements CR and carry the prefixes actually being
      advertised. If they are absent, the RouteAdvertisements never took
      effect regardless of what its status says.

- name: Show NodeNetworkConfigurationPolicy status
  ansible.builtin.command:
    cmd: oc get nncp
  register: udn_bgp_nncp
  changed_when: false
  failed_when: false

- name: Report NNCP status
  ansible.builtin.debug:
    msg: "{{ udn_bgp_nncp.stdout_lines }}"

# The check that only exists because its absence cost a long debugging
# session. A fabric NIC that does not forward breaks the return path and
# leaves no trace: the reply is on the NIC in tcpdump and never reaches
# ovn-k8s-mpN. Everything above this - NNCP Available, session Established,
# RouteAdvertisements Accepted, prefixes exchanged - is green while it is
# broken, because every one of them is about the control plane.
- name: Check the fabric NIC forwards on each node
  ansible.builtin.command:
    argv:
      - oc
      - debug
      - "node/{{ udn_bgp_node_names[item.ip_key] }}"
      - --quiet
      - --
      - chroot
      - /host
      - bash
      - -c
      - >-
        nic=$(ip -o link show | awk '/{{ clab_fabric_mac_prefix }}:{{ ip_list[item.ip_key] }}/ {gsub(":","",$2); print $2; exit}');
        echo "${nic:-NONE} $(cat /proc/sys/net/ipv4/conf/${nic:-lo}/forwarding 2>/dev/null || echo unknown)"
  loop: "{{ clab_fabric_nodes }}"
  loop_control:
    label: "{{ item.ip_key }}"
  register: udn_bgp_fwd
  changed_when: false
  failed_when: false

- name: Fail if a fabric NIC has forwarding disabled
  ansible.builtin.assert:
    that: item.stdout is search(' 1\s*$')
    fail_msg: >-
      On {{ udn_bgp_node_names[item.item.ip_key] }} the fabric NIC reports
      '{{ item.stdout | trim }}' (interface, net.ipv4.conf.<nic>.forwarding).
      It must be 1. Traffic from the fabric to a pod arrives on this NIC and
      has to be forwarded to ovn-k8s-mpN; with forwarding off the kernel
      drops it in the routing decision and the only direct evidence is
      `ip route get <pod ip> from {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
      iif <nic>` answering "No route to host". It is set by the Tuned
      profile '{{ udn_bgp_tuned_name }}' - check that it applied:
      `oc get tuned {{ udn_bgp_tuned_name }} -n {{ udn_bgp_tuned_namespace }}`
      and `oc get profile -n {{ udn_bgp_tuned_namespace }}
      {{ udn_bgp_node_names[item.item.ip_key] }} -o yaml`.
    success_msg: >-
      {{ udn_bgp_node_names[item.item.ip_key] }}: {{ item.stdout | trim }} (forwarding on)
  loop: "{{ udn_bgp_fwd.results }}"
  loop_control:
    label: "{{ item.item.ip_key }}"

- name: Show BGP sessions from the border leaf's point of view
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp summary'
      -c 'show bgp ipv4 unicast'
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_leaf_summary
  changed_when: false
  failed_when: false

- name: Report the border leaf's view
  ansible.builtin.debug:
    msg: "{{ udn_bgp_leaf_summary.stdout_lines }}"

- name: Show each tenant VRF's routing table on the border leaf
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp vrf {{ item.name }} ipv4 unicast'
      -c 'show ip route vrf {{ item.name }}'
  loop: "{{ udn_bgp_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_leaf_vrf
  changed_when: false
  failed_when: false
  when: udn_phase in ['vrflite', 'evpn']

- name: Report each tenant VRF's routes
  ansible.builtin.debug:
    msg: "{{ ['VRF ' ~ item.item.name ~ ':'] + (item.stdout_lines | default([], true)) }}"
  loop: "{{ udn_bgp_leaf_vrf.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: udn_phase in ['vrflite', 'evpn']

# EVPN adds a layer that can be healthy at the control plane and dead at the
# data plane - sessions up, type-5 routes on both sides, and no tunnel,
# because neither VTEP can reach the other. Underlay first, overlay second.
- name: Show the EVPN and VTEP state
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp l2vpn evpn summary'
      -c 'show bgp l2vpn evpn'
      -c 'show ip route {{ udn_bgp_vtep_prefix }}.0/24 longer-prefixes'
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_evpn_verify
  changed_when: false
  failed_when: false
  when: udn_phase == 'evpn'

- name: Report the EVPN and VTEP state
  ansible.builtin.debug:
    msg: >-
      {{ (udn_bgp_evpn_verify.stdout_lines | default([], true))
         + udn_bgp_evpn_note.splitlines() }}
  vars:
    udn_bgp_evpn_note: |

      Check in this order: the VTEP routes are present (no route to a node's
      VTEP means no tunnel to it, whatever the EVPN table says), then the
      evpn summary shows a session per node, then type-5 routes appear
      carrying each tenant's VNI.
  when: udn_phase == 'evpn'

- name: Show which VTEP address each node was assigned
  ansible.builtin.command:
    cmd: >-
      oc get nodes -o custom-columns=NODE:.metadata.name,VTEP:.metadata.annotations.k8s\.ovn\.org/node-vtep-ips
  register: udn_bgp_node_vteps
  changed_when: false
  failed_when: false
  when: udn_phase == 'evpn'

- name: Report the node VTEP annotations
  ansible.builtin.debug:
    msg: >-
      {{ (udn_bgp_node_vteps.stdout_lines | default([], true))
         + udn_bgp_vtep_note.splitlines() }}
  vars:
    udn_bgp_vtep_note: |

      Empty for a node means OVN-Kubernetes did not discover an address on it
      inside {{ udn_bgp_vtep_prefix }}.0/24 - check that node's
      {{ udn_bgp_vtep_iface }} interface and its nncp. The exact annotation
      key varies by release; if this column is empty for every node, read
      `oc get node <node> -o yaml | grep -i vtep` instead of trusting it.
  when: udn_phase == 'evpn'

- name: Print the reachability tests to run by hand
  ansible.builtin.debug:
    msg: "{{ udn_bgp_manual_checks.splitlines() }}"
  vars:
    # The step numbers are generated rather than written, because half these
    # checks only exist in some phases. Hard-coded numbers left the 'default'
    # phase printing 1, 2, 5, 6.
    udn_bgp_manual_checks: |
      The checks above are control plane only. These are the ones that
      actually prove the data plane, and they are left as explicit commands
      because each needs a pod name from your cluster.
      {% set ns = namespace(step=0) %}
      {% set probe_node = udn_bgp_node_names[clab_fabric_nodes[0].ip_key] %}
      {% if udn_phase == 'default' %}

      This phase advertises the cluster DEFAULT pod network - no UDN exists
      yet, so these use an ordinary pod. If you have nothing to exec into:

        oc -n default run bgp-probe --restart=Never \
          --image=registry.redhat.io/rhel9/support-tools:latest \
          --overrides='{"spec":{"nodeName":"{{ probe_node }}"}}' \
          --command -- sleep 3600
      {% else %}

        # pick a pod per tenant
      {% for t in udn_bgp_tenants %}
        oc -n udn-{{ t.name }} get pods -o wide
      {% endfor %}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. The node can reach the leaf at all. This is the underlay, and it is
         the first thing to check because the BGP session rides on the same
         path - if this fails, the session is down too and nothing about
         OVN-Kubernetes is the reason:
           oc debug node/{{ probe_node }} -- chroot /host ping -c3 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
           # 'Destination Host Unreachable' from the node subnet's .2 address
           # is the host saying it could not ARP the leaf. Check the fabric
           # NIC's address, then {{ clab_fabric_bridge }} on this host, then the
           # bridge inside the clab VM - not OVN.
      {% if udn_phase != 'default' %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. The pod's address comes from the UDN, not the cluster network:
      {% for t in udn_bgp_tenants %}
           oc -n udn-{{ t.name }} exec <pod> -- ip -br addr show eth0
           # expect an address in {{ t.udn_subnet_shared if udn_phase == 'shared' else t.udn_subnet }}
      {% endfor %}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. The fabric learned one route per node, not one blanket route:
           docker exec clab-{{ clab_lab_name }}-leaf1 vtysh -c 'show bgp ipv4 unicast'
           # expect a prefix per node, each with that node's {{ clab_fabric_prefix }}.x
           # address as next hop
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. Egress is NOT SNATed once the network is advertised. Run a ping and
         watch the fabric see the real pod IP as the source - this is the
         single clearest proof the advertisement took effect. Capture on the
         bridge rather than inside leaf1: the FRR image ships no tcpdump, and
         every packet between a node and the leaf crosses the bridge anyway.
           # on this lab host, not inside a container
           sudo tcpdump -ni {{ clab_fabric_bridge }} icmp
      {% if udn_phase == 'default' %}
           oc -n default exec bgp-probe -- ping -c3 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
      {% elif udn_phase == 'shared' %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
      {% else %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 {{ udn_bgp_tenants[0].external_host }}
      {% endif %}
      {% if udn_phase in ['vrflite', 'evpn'] %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. Tenant isolation - the tests that matter, and the ones that must FAIL:
      {% for t in udn_bgp_tenants[1:] %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 -W2 {{ t.external_host }}
      {% endfor %}
         Every one of these MUST time out. Their external networks are one
         hop away on the same physical link, so nothing but the VRF is
         keeping them apart. If any succeeds, the VRFs are leaking and
         VRF-Lite is not doing its job - check that targetVRF is 'auto' and
         the cluster is in local gateway mode.

         These failures do not say the same thing, which is why there is
         more than one. {{ udn_bgp_tenants[0].name }} and {{ udn_bgp_tenants[1].name }} carry the same pod
         subnet, so a failure between them could in principle be addressing
         rather than isolation. {{ udn_bgp_tenants[2].name if udn_bgp_tenants | length > 2 else 'A non-overlapping third tenant' }} overlaps with nothing
         anywhere, so a failure to reach it can only be the VRF. That is
         the one to take as the result.
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. And the positive half - every tenant reaching its own:
      {% for t in udn_bgp_tenants %}
           oc -n udn-{{ t.name }} exec <pod> -- ping -c3 {{ t.external_host }}
      {% endfor %}
         All of these MUST succeed. A run where everything times out is not
         isolation, it is a broken phase.
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. Confirm the node learned fabric routes over BGP rather than being
         statically pointed at anything:
           oc debug node/{{ probe_node }} -- chroot /host ip route show proto bgp
      {% if udn_phase in ['vrflite', 'evpn'] %}
           oc debug node/{{ probe_node }} -- chroot /host ip route show vrf {{ udn_bgp_tenants[0].name }}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. And confirm the thing this lab is careful NOT to have changed - the
         node's default route still points at virbr0:
           oc debug node/{{ probe_node }} -- chroot /host ip route show default
           # expect: default via {{ lab_network_prefix }}.1
      {% if udn_phase == 'default' %}

      Clean up the probe pod when you are done:
        oc -n default delete pod bgp-probe
      {% endif %}
