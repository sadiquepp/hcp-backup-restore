---
# Wait for every tenant CUDN to be realised, and fail with the cluster's own
# conditions if one is not.
#
# Two separate things go wrong without this, and neither announces itself:
#
# 1. RouteAdvertisements reports "configuration pending: no networks
#    selected". The RA selects CUDNs by label, but OVN-Kubernetes resolves
#    that to the set of networks it has actually instantiated - a CUDN whose
#    NetworkAttachmentDefinition has not been created yet is a labelled
#    object, not a network, and selects as nothing. The RA is then stuck
#    Pending with a message that sounds like a label typo and usually is not.
#
# 2. Worse, and silently: OVN-Kubernetes binds a namespace's primary network
#    at NAMESPACE CREATION time. A namespace created before its CUDN is
#    realised gets no primary network at all, and labelling it afterwards
#    does nothing. The pods come up healthy on the default cluster network,
#    the DaemonSet rolls out, every task passes, and the tenant is simply not
#    on its UDN. That is why this gate is before the namespaces, not just
#    before the RouteAdvertisements.
#
# The condition type differs across releases (NetworkCreated in current
# OVN-Kubernetes, NetworkAllocationSucceeded in some), so this matches on any
# condition going True rather than naming one, and prints whatever conditions
# are actually there when it gives up.

- name: Confirm every tenant CUDN has been realised
  block:
    - name: Wait for the tenant CUDNs to report a successful network
      ansible.builtin.command:
        argv:
          - oc
          - get
          - clusteruserdefinednetwork
          - "{{ item.name }}"
          - -o
          - jsonpath={.status.conditions[?(@.status=="True")].type}
      loop: "{{ udn_bgp_tenants }}"
      loop_control:
        label: "{{ item.name }}"
      register: udn_bgp_cudn_ready
      until: udn_bgp_cudn_ready.stdout | default('') | length > 0
      retries: "{{ udn_bgp_cudn_ready_retries }}"
      delay: "{{ udn_bgp_cudn_ready_delay }}"
      changed_when: false
  rescue:
    - name: Collect the CUDN conditions
      ansible.builtin.shell:
        cmd: |
          set -u
          for t in {{ udn_bgp_tenants | map(attribute='name') | join(' ') }}; do
              echo "=== $t ==="
              oc get clusteruserdefinednetwork "$t" \
                  -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1
              echo "labels: $(oc get clusteruserdefinednetwork "$t" \
                  -o jsonpath='{.metadata.labels}' 2>&1)"
          done
      register: udn_bgp_cudn_debug
      changed_when: false
      failed_when: false

    - name: Report which CUDN never came up, then fail
      ansible.builtin.fail:
        msg: >-
          {{ ['One or more tenant CUDNs never reported a successful condition.',
              'Nothing downstream can work while this is true: the'
              ' RouteAdvertisements will select no networks ("configuration'
              ' pending: no networks selected"), and any namespace created'
              ' meanwhile gets no primary network at all.',
              ''] + udn_bgp_cudn_debug.stdout_lines | default([]) }}
