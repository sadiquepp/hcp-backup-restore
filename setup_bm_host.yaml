- name: Prepare BareMetal Host
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tasks:
    - name: Render inventory/hosts from lab_network_prefix and ip_list
      ansible.builtin.template:
        src: "{{ playbook_dir }}/inventory/hosts.j2"
        dest: "{{ playbook_dir }}/inventory/hosts"
        mode: '0644'

    # Ansible parsed the inventory before this play started, so the file just
    # rendered is not the one in memory - the delegate_to tasks below would use
    # the previous contents, and on a first run against a changed ip_list that
    # means the helper without its ansible_ssh_private_key_file. Re-read it.
    # Unconditional on purpose: refresh_inventory does not honour `when`
    # (Ansible warns and runs it anyway), and re-reading a file is cheap.
    - name: Re-read the inventory that was just rendered
      ansible.builtin.meta: refresh_inventory

    # Before setup-bm-host, because that role builds the helper disk and has
    # to know which image to expand into it.
    - name: Detect the prebuilt customized lab image
      ansible.builtin.import_role:
        name: lab-image
        tasks_from: detect

    # Only when the helper still has to register. With the customized image
    # opted in (customized_lab_image_for_helper) the helper installs nothing
    # and needs no entitlement, and demanding credentials it will not use is
    # how a lab that could run without them ends up needing them anyway.
    - name: Fail fast if org_id/activation_key are missing from vault.yaml
      ansible.builtin.assert:
        that:
          - org_id is defined
          - activation_key is defined
        fail_msg: >-
          Add org_id / activation_key to vault.yaml (ansible-vault edit
          vault.yaml) - needed to register helper with subscription-manager.
          Alternatively build the customized lab image and set
          customized_lab_image_for_helper true, and the helper needs neither.
      when: not (customized_lab_helper_ready | default(false) | bool)

    - ansible.builtin.import_role:
        name: setup-bm-host

    - ansible.builtin.import_role:
        name: setup-rhsm
      tags:
        - rhsm
      delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"
      when: not (customized_lab_helper_ready | default(false) | bool)

    - ansible.builtin.import_role:
        name: setup-dns
      tags:
        - dns
      delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"

    - ansible.builtin.import_role:
        name: setup-lb
      tags:
        - lb
      delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"

    - ansible.builtin.import_role:
        name: setup-tftp
      tags:
        - tftp
      delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"
