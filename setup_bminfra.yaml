## Creates the shared bare-metal infra namespace, pull-secret, InfraEnv
## and capi-provider RBAC that agent-based hosted-cluster nodes need to
## discover and register. Idempotent - run against hub1 normally, or
## against hub2 if you need to re-create the InfraEnv there.
##
## Usage:
##   ansible-playbook setup_bminfra.yaml --ask-vault-pass                    # targets hub1 (default)
##   ansible-playbook setup_bminfra.yaml --ask-vault-pass -e target_hub=hub2 # targets hub2
##   ansible-playbook setup_bminfra.yaml --ask-vault-pass -e disconnected_install=true # targets the disconnected hub
##
## disconnected_install (vars.yaml, default false) wins over target_hub: with
## it set the playbook uses hub_disconnected_install_folder/auth/kubeconfig
## (the hub installed by setup_hub_cluster_disconnected.yaml), so target_hub
## is ignored in that case.

- name: Setup bare-metal infra (namespace, pull-secret, InfraEnv, RBAC)
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  vars:
    hub_install_folder_selected: >-
      {{ hub_disconnected_install_folder
         if (disconnected_install | default(false) | bool)
         else ((target_hub == 'hub2') | ternary(hub2_install_folder, hub_install_folder)) }}
    hub_kubeconfig: "{{ hub_install_folder_selected }}/auth/kubeconfig"
  tasks:
  - name: Fail fast if pull_secret/ssh_key are missing from vault.yaml
    ansible.builtin.assert:
      that:
        - pull_secret is defined
        - ssh_key is defined
      fail_msg: >-
        pull_secret / ssh_key must be defined in vault.yaml - they're the
        same ones used by setup_hub_cluster.yaml.

  - ansible.builtin.import_role:
      name: setup-bminfra
    environment:
      KUBECONFIG: "{{ hub_kubeconfig }}"
