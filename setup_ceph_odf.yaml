## Exports the Ceph 9 cluster (setup_ceph.yaml) for OpenShift Data
## Foundation (ODF) "external mode" to consume as PVs, then installs
## ODF and wires up the external StorageCluster on the target OCP
## cluster.
##
## IMPORTANT - read before running: by default the second play here
## targets the same hub cluster every other *.yaml in this repo does
## (hub_kubeconfig, same target_hub switch as setup_oadp.yaml). But
## the hub already runs the LVM Storage operator in the
## openshift-storage namespace (roles/setup-hub-acm, part of hub
## bring-up) - and ODF external mode wants that exact same namespace.
## Running both on the same cluster is not something this repo has
## tested and may conflict. Pick one:
##   - remove LVM Storage from the hub first, or
##   - point this at a different cluster's kubeconfig instead:
##       -e ceph_odf_target_kubeconfig=/path/to/some/other/kubeconfig
##     (e.g. a hosted cluster's, once you've extracted one - this repo
##     doesn't do that extraction for you, hcp CLI or `oc get secret
##     <name>-admin-kubeconfig` on the hub gets you one)
##
## Usage:
##   ansible-playbook setup_ceph_odf.yaml --ask-vault-pass
##   ansible-playbook setup_ceph_odf.yaml --ask-vault-pass -e target_hub=hub2
##   ansible-playbook setup_ceph_odf.yaml --ask-vault-pass -e ceph_odf_target_kubeconfig=/path/to/kubeconfig

- name: Export Ceph pool/CephFS + CSI credentials for ODF
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tasks:
  - ansible.builtin.import_role:
      name: setup-ceph-odf-export
    tags:
      - ceph-odf-export
    delegate_to: "{{ lab_network_prefix }}.{{ ip_list.cephadmin }}"

- name: Install ODF and create the external StorageCluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  vars:
    ceph_odf_target_kubeconfig: >-
      {{ (target_hub == 'hub2') | ternary(hub2_install_folder, hub_install_folder) }}/auth/kubeconfig
  tasks:
  - ansible.builtin.import_role:
      name: setup-ceph-odf-consumer
    environment:
      KUBECONFIG: "{{ ceph_odf_target_kubeconfig }}"
    tags:
      - ceph-odf-consumer
