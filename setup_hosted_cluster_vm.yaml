## Creates the worker VMs a hosted cluster's NodePool draws its Agents from,
## and boots them off the hub InfraEnv's discovery ISO so they register as
## Agents in the bminfra namespace.
##
## Connected (default):
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass
## builds hosted_cluster_workers (c1_worker1..3, ip_list.c1worker*) against the
## hub selected by target_hub, exactly as before.
##
## Disconnected:
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass \
##     -e disconnected_install=true
## builds hosted_cluster_disconnected_workers (c1-d-worker1..3,
## ip_list.c1dworker*) instead, against the hub installed by
## setup_hub_cluster.yaml with the same flag, and cuts those three IPs off from
## the real internet first so the cluster can only ever pull from the local
## mirror registry. disconnected_install wins over target_hub, same as in
## setup_bminfra.yaml.
##
## The compact cluster's hosted cluster (hcp-compact1):
##   ansible-playbook -i inventory/hosts setup_hosted_cluster_vm.yaml --ask-vault-pass \
##     -e target_hub=compact
## builds compact_hosted_cluster_workers (two VMs, ip_list.hcpc1worker*)
## against the compact cluster's InfraEnv (setup_bminfra.yaml -e
## target_hub=compact), and adds their DHCP reservations to the running
## libvirt network first - redefining the network would cut the compact
## cluster off it.
##
## Both paths run the same tasks - only the worker set, the VM folder and the
## sizing differ (see the "Select the worker set" task below and the
## disconnected block in vars.yaml) - plus one step the disconnected path needs
## on its own: the hub InfraEnv's ignitionConfigOverride, which is what lets the
## workers pull the assisted-installer agent from the mirror registry without a
## Red Hat signature. Without it they boot and never register as Agents.

- name: Setting Up Hosted Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
  vars:
    ## Anything not named here is hub1, as before.
    hub_install_folders:
      hub: "{{ hub_install_folder }}"
      hub2: "{{ hub2_install_folder }}"
      compact: "{{ compact_install_folder }}"
    hub_install_folder_selected: >-
      {{ hub_disconnected_install_folder
         if (disconnected_install | default(false) | bool)
         else (hub_install_folders[target_hub | default('hub')] | default(hub_install_folder)) }}
    hcp_on_compact: >-
      {{ not (disconnected_install | default(false) | bool)
         and (target_hub | default('hub')) == 'compact' }}
    hub_kubeconfig: "{{ hub_install_folder_selected }}/auth/kubeconfig"
  environment:
    KUBECONFIG: "{{ hub_kubeconfig }}"
  tasks:
    # One set of facts drives every task below, so the connected and
    # disconnected runs differ in their inputs rather than in their steps.
    #
    # Tagged always because every `when: hcp_disconnected` below reads these -
    # a --tags disconnected-nat or --tags discovery-ignition run would
    # otherwise skip this task and fail on the undefined fact.
    - name: Select the worker set, VM folder and sizing for this run
      tags: [always]
      ansible.builtin.set_fact:
        hcp_disconnected: "{{ disconnected_install | default(false) | bool }}"
        hcp_workers: >-
          {{ hosted_cluster_disconnected_workers
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_workers if hcp_on_compact | bool
                   else hosted_cluster_workers) }}
        hcp_vm_folder: >-
          {{ hosted_cluster_disconnected_vm_folder
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_vm_folder if hcp_on_compact | bool
                   else hosted_cluster_vm_folder) }}
        hcp_vm_memory: >-
          {{ hosted_cluster_disconnected_memory
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_memory if hcp_on_compact | bool
                   else hosted_cluster_memory) }}
        hcp_vm_cpu: >-
          {{ hosted_cluster_disconnected_cpu
             if (disconnected_install | default(false) | bool)
             else (compact_hosted_cluster_cpu if hcp_on_compact | bool
                   else hosted_cluster_cpu) }}

    - name: Report which hosted cluster's VMs are being built
      ansible.builtin.debug:
        msg: >-
          {{ hcp_disconnected | ternary('Disconnected', 'Connected') }} hosted
          cluster VMs: {{ hcp_workers | map(attribute='name') | join(', ') }}
          in {{ hcp_vm_folder }}, discovery ISO from {{ hub_kubeconfig }}

    # Only the disconnected workers get their egress cut - the connected
    # hosted clusters, the mirror registry, MinIO, the helper and the load
    # balancer all stay reachable. Done before the VMs exist so nothing ever
    # boots with a working route to quay.io.
    - name: Cut the disconnected hosted cluster's workers off from the real internet
      ansible.builtin.include_tasks: roles/setup-hub-cluster-disconnected/tasks/block-node-nat.yml
      vars:
        disconnected_nat_enabled: "{{ hosted_cluster_disconnected_block_node_nat }}"
        disconnected_nat_ip_keys: "{{ hcp_workers | map(attribute='ip_key') | list }}"
        disconnected_nat_label: "{{ (hosted_clusters_disconnected | default(['hcp-disconnected'])) | first }}"
      when: hcp_disconnected
      tags: [disconnected-nat]

    # The discovery ISO this playbook boots the workers from is built by the
    # hub's InfraEnv, not here - so the one thing that has to be right before
    # it is downloaded is that InfraEnv's ignition. Without the override below
    # the workers boot, fail to pull the assisted-installer agent ("A signature
    # was required, but no signature exists") and never register, so no Agent
    # ever shows up in the InfraEnv. See
    # roles/setup-bminfra/tasks/disconnected-ignition-override.yml.
    #
    # This patches the live InfraEnv and waits for the ISO to be rebuilt, so a
    # hub whose InfraEnv predates the override is fixed in place rather than
    # needing setup_bminfra.yaml re-run.
    - name: Make sure the hub InfraEnv's discovery ISO skips image signature checks
      ansible.builtin.include_tasks: roles/setup-bminfra/tasks/ensure-ignition-override.yml
      when: hcp_disconnected
      tags: [discovery-ignition]

    - name: Download discovery ISO from hub InfraEnv
      ansible.builtin.include_tasks: roles/setup-bminfra/tasks/download-discovery-iso.yml

    # The hub's hosted cluster workers get their DHCP reservations from the
    # libvirt network definition setup_bm_host.yaml renders, which it applies
    # by destroying and redefining the network - fine before anything runs on
    # it, not with the compact cluster up. So a compact run adds its workers'
    # reservations to the RUNNING network instead (--live --config), the way
    # roles/setup-compact-cluster adds its nodes'. Same FQDN the template
    # renders, so a later rebuild changes nothing.
    - name: Read the default network's current definition
      ansible.builtin.command: virsh net-dumpxml default
      register: hcp_net_xml
      changed_when: false
      when: hcp_on_compact | bool

    - name: Reserve each worker's address on the running network
      ansible.builtin.command:
        cmd: >-
          virsh net-update default add ip-dhcp-host
          "<host mac='{{ hcp_worker_mac }}' name='{{ item.ip_key }}.{{ hcp_worker_zone }}'
                 ip='{{ lab_network_prefix }}.{{ ip_list[item.ip_key] }}'/>"
          --live --config
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }} {{ hcp_worker_mac }}"
      vars:
        hcp_worker_mac: "52:54:00:e2:54:{{ '%02d' | format(ip_list[item.ip_key] | int) }}"
        hcp_worker_cluster: >-
          {{ (hosted_cluster_node_keys | dict2items
              | selectattr('value.workers', 'defined')
              | selectattr('value.workers', 'contains', item.ip_key)
              | map(attribute='key') | first) | default('') }}
        hcp_worker_zone: >-
          {{ hcp_worker_cluster }}.{{ (hosted_cluster_domains | default({}))[hcp_worker_cluster] | default(base_domain) }}
      when:
        - hcp_on_compact | bool
        - hcp_worker_mac not in (hcp_net_xml.stdout | lower)
      changed_when: true

    - name: Create Directory for Hosted Cluster VMs
      file:
        path: "{{ hcp_vm_folder }}"
        state: directory

    - name: Define Disks for Hosted Cluster
      shell: |
        qemu-img create \
        -f qcow2 \
        -o preallocation=metadata \
        {{ hcp_vm_folder }}/{{ item.name }}.qcow2 \
        120G
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy Workers for Hosted Cluster
      shell: |
        virt-install \
        --ram {{ hcp_vm_memory }} \
        --vcpus {{ hcp_vm_cpu }} \
        --os-variant rhel9.5 \
        --cdrom {{ discovery_image_url }} \
        --disk path={{ hcp_vm_folder }}/{{ item.name }}.qcow2,device=disk,bus=virtio,format=qcow2,cache=none \
        --memballoon model=virtio,freePageReporting=on \
        --noautoconsole \
        --vnc \
        --network network:default,mac=52:54:00:e2:54:{{ '%02d' | format(ip_list[item.ip_key] | int) }} \
        --name {{ item.name }} \
        --cpu host-passthrough
      loop: "{{ hcp_workers }}"
      loop_control:
        label: "{{ item.name }} ({{ lab_network_prefix }}.{{ ip_list[item.ip_key] }})"
