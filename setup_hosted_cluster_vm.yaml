- name: Setting Up Hosted Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
  vars:
    hub_kubeconfig: >-
      {{ (target_hub == 'hub2') | ternary(hub2_install_folder, hub_install_folder) }}/auth/kubeconfig
  environment:
    KUBECONFIG: "{{ hub_kubeconfig }}"
  tasks:
    - name: Download discovery ISO from hub InfraEnv
      ansible.builtin.include_tasks: roles/setup-bminfra/tasks/download-discovery-iso.yml

    - name: Create Directory for Hosted Cluster VMs
      file:
        path: "{{ hosted_cluster_vm_folder }}"
        state: directory

    - name: Define Disks for Hosted Cluster
      shell: |
        qemu-img create -f qcow2 -o preallocation=metadata {{ hosted_cluster_vm_folder }}/c1_worker1.qcow2 120G
        qemu-img create -f qcow2 -o preallocation=metadata {{ hosted_cluster_vm_folder }}/c1_worker2.qcow2 120G
        qemu-img create -f qcow2 -o preallocation=metadata {{ hosted_cluster_vm_folder }}/c1_worker3.qcow2 120G

    - name: Deploy Workers for Hosted Cluster
      shell: |
        virt-install \
        --ram {{ hosted_cluster_memory }} \
        --vcpus {{ hosted_cluster_cpu }} \
        --os-variant rhel9.5 \
        --cdrom {{ discovery_image_url }} \
        --disk path={{ hosted_cluster_vm_folder }}/c1_worker1.qcow2,device=disk,bus=virtio,format=qcow2,cache=none \
        --memballoon model=virtio,freePageReporting=on \
        --noautoconsole \
        --vnc \
        --network network:default,mac=52:54:00:e2:54:{{ ip_list.c1worker1 }} --name c1_worker1 --cpu host-passthrough
        
        virt-install \
        --ram {{ hosted_cluster_memory }} \
        --vcpus {{ hosted_cluster_cpu }} \
        --os-variant rhel9.5 \
        --cdrom {{ discovery_image_url }} \
        --disk path={{ hosted_cluster_vm_folder }}/c1_worker2.qcow2,device=disk,bus=virtio,format=qcow2,cache=none \
        --memballoon model=virtio,freePageReporting=on \
        --noautoconsole \
        --vnc \
        --network network:default,mac=52:54:00:e2:54:{{ ip_list.c1worker2 }} --name c1_worker2 --cpu host-passthrough
