## Runs setup-hub-acm against the hub installed by
## setup_hub_cluster_disconnected.yaml, which deliberately stops at the cluster
## install. This is the disconnected counterpart of the ACM step
## setup_hub_cluster.yaml chains for hub1 - it exists as its own playbook
## because it needs the disconnected hub's kubeconfig and MetalLB pool, and
## setup_hub_cluster.yaml pins hub1's.
##
## The role renders differently here: AgentServiceConfig gets a
## spec.mirrorRegistryRef and osImage urls served off the helper, the mirror
## registry CA is published to openshift-config and injected into the cluster
## image config, and a ClusterImageSet is created per osImage version against
## the mirror registry. See roles/setup-hub-acm/defaults/main.yml for the
## variables that drive it.
##
## Requires the mirror registry (setup_mirror_registry.yaml) and the
## disconnected hub (setup_hub_cluster_disconnected.yaml) to be up, and the
## helper to have room for the RHCOS live ISOs - see helper_disk_size in
## vars.yaml.
##
## Usage:
##   ansible-playbook setup_hub_acm_disconnected.yaml --ask-vault-pass
##
## As with the connected flow, the AgentServiceConfig itself is only rendered,
## not applied - review
## roles/setup-hub-acm/files/.rendered-05-agentserviceconfig.yaml and apply it
## once you are happy with it.

- name: Setting Up ACM on the Hub Cluster (disconnected)
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  vars:
    ## What makes the role render its disconnected variant. Play vars lose to
    ## -e, so `-e disconnected=false` still gets you a connected rendering if
    ## you ever want to compare the two.
    disconnected: true
  tasks:
    - name: Fail fast if the mirror registry CA has not been trusted locally yet
      ansible.builtin.stat:
        path: /etc/pki/ca-trust/source/anchors/mirror-registry-rootCA.pem
      register: mirror_ca_status

    - ansible.builtin.assert:
        that:
          - mirror_ca_status.stat.exists
        fail_msg: >-
          Mirror registry CA not found locally - run setup_mirror_registry.yaml
          first (it stands up the mirror registry and runs
          setup-mirror-registry-trust to trust its CA here).

    - name: Fail fast if the disconnected hub's kubeconfig is missing
      ansible.builtin.stat:
        path: "{{ hub_disconnected_install_folder }}/auth/kubeconfig"
      register: hubd_kubeconfig_status

    - ansible.builtin.assert:
        that:
          - hubd_kubeconfig_status.stat.exists
        fail_msg: >-
          {{ hub_disconnected_install_folder }}/auth/kubeconfig not found - run
          setup_hub_cluster_disconnected.yaml first.

    - ansible.builtin.import_role:
        name: setup-hub-acm
      vars:
        metallb_pool_start: "{{ hub_disconnected_metallb_pool_start }}"
        metallb_pool_end: "{{ hub_disconnected_metallb_pool_end }}"
      environment:
        KUBECONFIG: "{{ hub_disconnected_install_folder }}/auth/kubeconfig"
      tags:
        - acm
