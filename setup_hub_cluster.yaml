- name: Setting Up Hub Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml 
  tasks: 
  - ansible.builtin.import_role:
      name: setup-hub-cluster

  - name: Wait for ClusterOperators to be healthy before day-2 install
    ansible.builtin.include_tasks: roles/setup-hub-cluster/tasks/wait-for-cluster-operators.yml
    vars:
      kubeconfig_path: "{{ hub_install_folder }}/auth/kubeconfig"

  - ansible.builtin.import_role:
      name: setup-hub-acm
    vars:
      metallb_pool_start: "{{ hub_metallb_pool_start }}"
      metallb_pool_end: "{{ hub_metallb_pool_end }}"
    environment:
      KUBECONFIG: "{{ hub_install_folder }}/auth/kubeconfig"
    tags:
      - acm
