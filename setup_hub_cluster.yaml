- name: Setting Up Hub Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml 
  tasks: 
  - ansible.builtin.import_role:
      name: setup-hub-cluster

  - ansible.builtin.import_role:
      name: setup-hub-acm
    vars:
      metallb_pool_start: "{{ hub_metallb_pool_start }}"
      metallb_pool_end: "{{ hub_metallb_pool_end }}"
    environment:
      KUBECONFIG: "{{ hub_install_folder }}/auth/kubeconfig"
    tags:
      - acm

  - name: Fail fast if pull_secret/ssh_key are missing from vault.yaml
    ansible.builtin.assert:
      that:
        - pull_secret is defined
        - ssh_key is defined
      fail_msg: >-
        pull_secret / ssh_key must be defined in vault.yaml - they're the
        same ones used by setup-hub-cluster's install-config.

  - ansible.builtin.import_role:
      name: setup-bminfra
    vars:
      hub_kubeconfig: "{{ hub_install_folder }}/auth/kubeconfig"
    environment:
      KUBECONFIG: "{{ hub_install_folder }}/auth/kubeconfig"
    tags:
      - bminfra
