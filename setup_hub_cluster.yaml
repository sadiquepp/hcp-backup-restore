- name: Setting Up Hub Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml 
  tasks: 
  - ansible.builtin.import_role:
      name: setup-hub-cluster

  - name: Wait for ClusterOperators to be healthy before day-2 install
    ansible.builtin.include_tasks: roles/setup-hub-cluster/tasks/wait-for-cluster-operators.yml
    vars:
      kubeconfig_path: "{{ hub_install_folder }}/auth/kubeconfig"

  # MetalLB pools come straight from hosted_cluster_metallb_pools in
  # vars.yaml - one single-address pool per hosted cluster, the same on every
  # hub, so a hosted cluster keeps its DNS-published address wherever its
  # control plane runs. Nothing per-hub to map in here any more.
  - ansible.builtin.import_role:
      name: setup-hub-acm
    environment:
      KUBECONFIG: "{{ hub_install_folder }}/auth/kubeconfig"
    tags:
      - acm
