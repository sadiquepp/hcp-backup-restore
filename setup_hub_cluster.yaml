- name: Setting Up Hub Cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml 
  tasks: 
  - ansible.builtin.import_role:
      name: setup-hub-cluster

  - name: Wait for ClusterOperators to be healthy before day-2 install
    ansible.builtin.include_tasks: roles/setup-hub-cluster/tasks/wait-for-cluster-operators.yml
    vars:
      kubeconfig_path: "{{ hub_install_folder }}/auth/kubeconfig"

  # One single-address MetalLB pool per hosted cluster, from
  # hosted_cluster_metallb_pools in vars.yaml. Pool names are the same on
  # every hub; metallb_hub picks this hub's address for each cluster.
  - ansible.builtin.import_role:
      name: setup-hub-acm
    vars:
      metallb_hub: hub
    environment:
      KUBECONFIG: "{{ hub_install_folder }}/auth/kubeconfig"
    tags:
      - acm
