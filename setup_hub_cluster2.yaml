- name: Setting Up Hub2 Cluster (replacement management cluster)
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tasks:
  - ansible.builtin.import_role:
      name: setup-hub-cluster2

  - ansible.builtin.import_role:
      name: setup-hub-acm
    vars:
      # Disjoint from hub1's 60-69 pool - see roles/setup-hub-acm/defaults
      # for why these must not overlap while both hubs share the same L2
      # network (192.168.122.0/24).
      metallb_pool_start: 90
      metallb_pool_end: 99
    environment:
      KUBECONFIG: "{{ hub2_install_folder }}/auth/kubeconfig"
    tags:
      - acm
