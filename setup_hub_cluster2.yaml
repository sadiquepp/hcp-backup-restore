- name: Setting Up Hub2 Cluster (replacement management cluster)
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tasks:
  - ansible.builtin.import_role:
      name: setup-hub-cluster2

  - name: Wait for ClusterOperators to be healthy before day-2 install
    ansible.builtin.include_tasks: roles/setup-hub-cluster/tasks/wait-for-cluster-operators.yml
    vars:
      kubeconfig_path: "{{ hub2_install_folder }}/auth/kubeconfig"

  # Same hosted_cluster_metallb_pools as hub1 - deliberately. After a DR
  # cutover a restored hosted cluster has to come back on the address its
  # api/api-int records already point at, and only one hub serves a given
  # hosted cluster at a time (see shutdown_hub_cluster.yaml).
  - ansible.builtin.import_role:
      name: setup-hub-acm
    environment:
      KUBECONFIG: "{{ hub2_install_folder }}/auth/kubeconfig"
    tags:
      - acm
