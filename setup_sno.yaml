---
# Build a connected single-node OpenShift from an agent ISO.
#
#   ansible-playbook -i inventory/hosts setup_sno.yaml --ask-vault-pass
#
# Runs on the hypervisor. --ask-vault-pass is not optional: this is a connected
# install and the node pulls its release payload from quay.io with the pull
# secret out of vault.yaml.
#
# DNS IS NOT DONE HERE. The zone sno.<base_domain> is rendered by setup-dns,
# which runs on the HELPER, not on the hypervisor this play targets - so it is
# reached through the playbook that already owns it:
#
#   ansible-playbook -i inventory/hosts setup_bm_host.yaml --tags dns \
#     --ask-vault-pass
#
# Run that first. Importing setup-dns from here as well would mean two
# playbooks carrying the same delegate_to, and the failure mode when one of
# them lacks it is not subtle: setup-dns's first task is
# `hostnamectl set-hostname helper.mylab.com`, so a mis-delegated run renames
# the hypervisor. Pre-flight fails with the command above if the zone is not
# being served yet.
#
# Useful subsets:
#   --tags snoimage     rebuild the agent ISO without touching the VM
#   --tags snovm        rebuild the VM from the ISO already built
#   --tags snowait      just block until an install already running finishes
#
# Rebuilding over an existing cluster needs -e sno_force_reinstall=true; the
# guard is there because the rebuild deletes the only copy of its kubeconfig.
- name: Set up a single-node OpenShift cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tasks:
    - name: Install the SNO
      ansible.builtin.import_role:
        name: setup-sno
