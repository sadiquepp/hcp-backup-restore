---
# Build a connected single-node OpenShift from an agent ISO.
#
#   ansible-playbook -i inventory/hosts setup_sno.yaml --ask-vault-pass
#
# Runs on the hypervisor. --ask-vault-pass is not optional: this is a connected
# install and the node pulls its release payload from quay.io with the pull
# secret out of vault.yaml.
#
# Useful subsets:
#   --tags dns          just (re)render the cluster's DNS zone
#   --tags snoimage     rebuild the agent ISO without touching the VM
#   --tags snovm        rebuild the VM from the ISO already built
#   --tags snowait      just block until an install already running finishes
#
# Rebuilding over an existing cluster needs -e sno_force_reinstall=true; the
# guard is there because the rebuild deletes the only copy of its kubeconfig.
- name: Set up a single-node OpenShift cluster
  hosts: localhost
  become: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tasks:
    # The API name has to resolve before `agent wait-for` can watch the
    # install, so the zone is served first rather than as a day-2 fix.
    #
    # delegate_to the helper, exactly as setup_bm_host.yaml does, and it is not
    # optional: named runs THERE, not on the hypervisor this play targets. Run
    # without it and setup-dns's first task - `hostnamectl set-hostname
    # helper.mylab.com` - renames the hypervisor, then installs bind on it and
    # writes /var/named on the wrong machine entirely.
    - name: Serve the cluster's DNS zone
      ansible.builtin.import_role:
        name: setup-dns
      tags: [sno, dns]
      delegate_to: "{{ lab_network_prefix }}.{{ ip_list.helper_server }}"

    - name: Install the SNO
      ansible.builtin.import_role:
        name: setup-sno
