## Builds a BGP/EVPN provider fabric out of containerlab and wires this lab's
## OpenShift cluster into it, so User Defined Networks can be tested over BGP
## with and without VRF-Lite, and then over EVPN.
##
## WHAT THIS DOES TO THE EXISTING LAB: almost nothing. The OCP node VMs each
## gain one extra NIC on a new, isolated bridge (virbr1). Nothing on virbr0
## changes - not the addresses, not DNS, not the DHCP reservations, not
## MetalLB, and in particular not any node's default route. The cluster's
## Network CR is patched to enable FRR and route advertisements, which
## restarts ovnkube-node; see the README section for what that costs.
##
## THE CORRECTION WORTH READING FIRST: you do not point a UDN's default
## gateway at the fabric router, and there is no setting that would let you.
## A primary UDN pod's gateway is always the OVN gateway router on its own
## node. What BGP changes is the NODE's routing table: the fabric advertises
## its prefixes in, the cluster advertises pod/UDN subnets out, and pod
## traffic to those prefixes stops being SNATed. The gateway never moves,
## which is precisely why this is safe to run against a working cluster.
##
## Phases, in the order they are meant to be run. Each one eliminates a class
## of explanation for a failure in the next:
##
##   --tags fabric      containerlab fabric, virbr1, node NICs. No cluster
##                      changes at all.
##   --tags preflight   report what the cluster can do. Changes nothing.
##   --tags default     advertise the cluster DEFAULT pod network over BGP.
##                      No UDN involved - if this fails, UDN is not the cause.
##   --tags shared      primary UDNs advertised into the default VRF
##                      (targetVRF: default). Adds UDN, no VLANs or VRFs.
##   --tags vrflite     per-tenant VRFs and VLANs (targetVRF: auto), with the
##                      tenant isolation that comes with them.
##   --tags evpn        VXLAN/EVPN transport. Needs OpenShift 4.22+ on the
##                      cluster side; the fabric half builds on any version.
##
## And one optional extra, outside the phase sequence:
##
##   --tags clabclient  an external client VM for phase 2 reachability tests.
##   --tags clabtenantclients  one client VM per phase 3 isolation domain.
##   --tags clabnsclient       one client VM holding one network namespace per
##                             tenant - the same test with a fifth of the RAM.
##                             Built alongside clabtenantclients, not instead
##                             of it; they coexist because the namespaces take
##                             .21 on each client segment and the VMs take .20.
##   --tags clabnsproxy        a tenant ingress on that same VM: one hostname
##                             per tenant, all resolving to one address, with
##                             haproxy choosing the namespace from the Host
##                             header. Answers how an end user reaches a
##                             tenant whose pod address another tenant also
##                             holds. Needs clabnsclient and --tags web, and
##                             re-run after any --tags web, because it proxies
##                             to pod addresses and those change.
##                      Builds a VM and edits the lab host's sysctls, so it is
##                      deliberately not part of --tags fabric. Meaningful in
##                      phase 2 only - in phase 3 each tenant has its own VRF
##                      on the leaf and this client reaches none of them.
##
## WHERE TO RUN IT. Both plays are `hosts: localhost`, so there is no
## delegation to fall back on and the tag decides which machine you must be on:
##
##   fabric, clabinstall, clabdeploy, clabverify, clabclient,
##   clabtenantclients, clabnsclient, clabnsproxy
##       ON THE LAB HOST. These drive libvirt - virsh, qemu-img, virt-install,
##       the bridges - and the clab VM over ssh from there.
##
##   preflight, default, shared, vrflite, evpn
##       Anywhere with a kubeconfig. These are `oc` calls and nothing else.
##
## Running a libvirt tag from a workstation fails at whatever tries to become
## first, typically "sudo: a password is required", which says nothing about
## the real problem. clabclient checks for virsh up front and says so instead.
##
## Usage:
##   ansible-playbook -i inventory/hosts setup_udn_bgp_lab.yaml --ask-vault-pass --tags fabric
##   ansible-playbook -i inventory/hosts setup_udn_bgp_lab.yaml --ask-vault-pass --tags preflight
##   ansible-playbook -i inventory/hosts setup_udn_bgp_lab.yaml --ask-vault-pass --tags default
##   ansible-playbook -i inventory/hosts setup_udn_bgp_lab.yaml --ask-vault-pass --tags shared
##   ansible-playbook -i inventory/hosts setup_udn_bgp_lab.yaml --ask-vault-pass --tags vrflite
##
## Run containerlab on the bare-metal host instead of in a VM:
##   ... -e clab_deploy_mode=host
##
## Build the three-node EVPN fabric instead of the single border leaf:
##   ... --tags fabric -e clab_topology=evpn
##
## MORE THAN ONE CLUSTER ON THE FABRIC. vars.yaml declares clab_clusters (who
## is in each cluster, and its ASN) and clab_fabric_clusters (which of them
## are wired in). The fabric half builds for all of them at once; the cluster
## half runs once per cluster and is told which one with -e udn_bgp_cluster:
##
##   # once, on the lab host - NICs for every cluster's nodes, and a leaf1
##   # that knows all of them
##   ... --tags nodenics,clabdeploy -e clab_topology=evpn
##
##   # then once per cluster, anywhere with the right kubeconfig
##   ... --tags evpn -e clab_topology=evpn -e udn_bgp_cluster=hub
##   ... --tags evpn -e clab_topology=evpn -e udn_bgp_cluster=sno
##
## Each cluster MUST have its own ASN; see the note at clab_cluster_asn in
## vars.yaml for what sharing one silently does to the EVPN tables.

- name: Build the containerlab provider fabric
  hosts: localhost
  become: true
  gather_facts: true
  vars_files:
    - vars.yaml
    - vault.yaml
  tags: [fabric]
  tasks:
    # Same pattern as setup_bm_host.yaml: the inventory Ansible parsed at
    # startup predates the [clab] group this lab needs, so render it and
    # re-read it before anything tries to delegate to the containerlab VM.
    - name: Render inventory/hosts so the [clab] group exists
      ansible.builtin.template:
        src: "{{ playbook_dir }}/inventory/hosts.j2"
        dest: "{{ playbook_dir }}/inventory/hosts"
        mode: '0644'

    - name: Re-read the inventory that was just rendered
      ansible.builtin.meta: refresh_inventory

    - ansible.builtin.import_role:
        name: setup-clab-fabric

# The containerlab VM is a bare RHEL9 image with no entitlement, so dnf
# cannot install anything until it is registered - same as the helper. Only
# needed in vm mode; in host mode the bare-metal host is already registered.
- name: Wire the cluster into the fabric
  hosts: localhost
  become: true
  gather_facts: false
  vars_files:
    - vars.yaml
    - vault.yaml
  vars:
    # Which cluster's kubeconfig this half runs against. Read from
    # clab_clusters in vars.yaml rather than from a ternary over two hub
    # names, so attaching a third cluster to the fabric is a vars.yaml edit
    # and nothing else. Select it with -e udn_bgp_cluster=<key>.
    hub_install_folder_selected: >-
      {{ clab_clusters[udn_bgp_cluster].install_folder }}
    hub_kubeconfig: "{{ hub_install_folder_selected }}/auth/kubeconfig"
  environment:
    KUBECONFIG: "{{ hub_kubeconfig }}"
  pre_tasks:
    - name: Fail early if the selected cluster's kubeconfig is not there
      ansible.builtin.stat:
        path: "{{ hub_kubeconfig }}"
      register: udn_bgp_kubeconfig_stat
      tags: [preflight, default, shared, vrflite, evpn, web]

    - name: Say which kubeconfig is missing rather than letting oc say nothing
      ansible.builtin.assert:
        that: udn_bgp_kubeconfig_stat.stat.exists
        fail_msg: >-
          udn_bgp_cluster is '{{ udn_bgp_cluster }}', whose kubeconfig should
          be at {{ hub_kubeconfig }} - and there is no file there. Either the
          cluster has not been built yet, or clab_clusters.{{ udn_bgp_cluster
          }}.install_folder in vars.yaml points somewhere else. Without this,
          every `oc` below talks to whatever the ambient KUBECONFIG is, which
          on this host is usually the hub - so a SNO run would reconfigure the
          hub instead and look like it worked.
        success_msg: >-
          Cluster '{{ udn_bgp_cluster }}' -> {{ hub_kubeconfig }}
      tags: [preflight, default, shared, vrflite, evpn, web]
  tasks:
    - name: Pre-flight only
      ansible.builtin.import_role:
        name: setup-udn-bgp
      vars:
        udn_phase: preflight
      tags: [preflight, never]

    - name: Advertise the cluster default pod network
      ansible.builtin.import_role:
        name: setup-udn-bgp
      vars:
        udn_phase: default
      tags: [default, never]

    - name: UDNs advertised into the default VRF
      ansible.builtin.import_role:
        name: setup-udn-bgp
      vars:
        udn_phase: shared
      tags: [shared, never]

    - name: UDNs with VRF-Lite
      ansible.builtin.import_role:
        name: setup-udn-bgp
      vars:
        udn_phase: vrflite
      tags: [vrflite, never]

    - name: UDNs over EVPN
      ansible.builtin.import_role:
        name: setup-udn-bgp
      vars:
        udn_phase: evpn
      tags: [evpn, never]

    # Additive, and independent of which transport phase is in place: it
    # attaches to whatever primary UDN the tenant already has. Its point is
    # that an HTTP response says which pod answered, where a ping cannot.
    - name: A web server per tenant, so the answer identifies the responder
      ansible.builtin.import_role:
        name: setup-udn-bgp
      vars:
        udn_phase: web
      tags: [web, never]
