## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running this lab from inside spiffe-spire/ therefore
## does not pick up the repository root's ansible.cfg, so it is mirrored here -
## the same arrangement as udn-bgp-evpn/ansible.cfg.
##
## Keep the [defaults] below in step with ../ansible.cfg.
[defaults]
host_key_auto_add = True

## This lab's own role (setup-spiffe-spire) is found in ./roles/ next to the
## playbook with no configuration. The repository's shared roles are one level
## up, which Ansible does not search by itself; nothing here imports one today,
## but naming ../roles keeps a future import of a base role (setup-rhsm, say)
## from failing with "role not found" only when run from this directory.
##
## Relative to the WORKING DIRECTORY, which is why the documented way to run
## this lab is `cd spiffe-spire` first. The three system defaults are kept
## because naming roles_path replaces them.
roles_path = ../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
