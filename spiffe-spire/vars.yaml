## ===========================================================================
## spiffe-spire/vars.yaml - SPIFFE/SPIRE workload identity on the hub and SNO
## ===========================================================================
##
## Every variable this use case owns lives here, and every one is prefixed
## spire_. Nothing SPIFFE-specific goes into the root vars.yaml.
##
## Loaded AFTER ../vars.yaml by every playbook in this directory:
##
##   vars_files:
##     - ../vars.yaml          # base (and, for now, everyone else's)
##     - vars.yaml             # this file
##     - ../vault.yaml
##
## so anything below may refer to base variables (hub_domain, sno_name,
## base_domain, hub_install_folder, ...) - Ansible templates lazily, at the
## moment a variable is used, by which time all three files are loaded.
##
## No addresses here, and none needed: everything this lab reaches, it reaches
## by name through the helper's existing zones - the cluster APIs, and routes
## under the *.apps wildcard. If it ever needs a VM address, that goes into
## ip_list in the root vars.yaml under a "## spiffe-spire" comment, not here.

## ---------------------------------------------------------------------------
## The two clusters, one trust domain each
## ---------------------------------------------------------------------------
## Select one with -e spire_cluster=hub|sno. The federation plays use both.
##
## trust_domain  the SPIFFE trust domain - the authority part of every SPIFFE
##               ID this cluster issues: spiffe://<trust_domain>/... It is
##               IMMUTABLE on the ZeroTrustWorkloadIdentityManager CR: changing
##               it means deleting the operands and starting again.
## cluster_name  names this cluster within its trust domain; also immutable.
##               It appears in every agent's SPIFFE ID
##               (spiffe://<td>/spire/agent/k8s_psat/<cluster_name>/<node uid>).
## apps_domain   the cluster's *.apps wildcard. Routes are named under it so
##               they resolve through the helper with no DNS change.
## peer          the other cluster, for federation.
spire_clusters:
  hub:
    name: hub
    kubeconfig: "{{ hub_install_folder }}/auth/kubeconfig"
    trust_domain: "{{ hub_domain }}"
    cluster_name: hub
    apps_domain: "apps.{{ hub_domain }}"
    peer: sno
  ## The key is literal: Ansible does not template dict keys. sno_name only
  ## has to agree with it for the trust domain to read naturally.
  sno:
    name: sno
    kubeconfig: "{{ sno_install_folder }}/auth/kubeconfig"
    trust_domain: "{{ sno_name }}.{{ base_domain }}"
    cluster_name: "{{ sno_name }}"
    apps_domain: "apps.{{ sno_name }}.{{ base_domain }}"
    peer: hub

## ---------------------------------------------------------------------------
## The operator - Red Hat's packaging of SPIFFE/SPIRE
## ---------------------------------------------------------------------------
## "Zero Trust Workload Identity Manager" in redhat-operators. It deploys and
## manages the SPIRE server (with spire-controller-manager as a sidecar), the
## SPIRE agent DaemonSet, the SPIFFE CSI driver and, optionally, the OIDC
## discovery provider - all from five CRs, each a singleton named 'cluster'.
##
## The package NAME is not hardcoded: the preflight phase looks it up in the
## catalog by this fragment and fails if there is no match, which is the check
## for "is Red Hat's packaging available on this cluster". Set
## spire_operator_package to skip the lookup.
spire_operator_package_match: zero-trust-workload-identity-manager
spire_operator_package: ""
## "" = the package's defaultChannel, read from the catalog at run time.
spire_operator_channel: ""
spire_catalog_source: redhat-operators
spire_catalog_namespace: openshift-marketplace
## Not a free choice: the operator's Route and some RBAC name this namespace
## as a constant rather than reading where it was installed.
spire_operator_namespace: zero-trust-workload-identity-manager

## spire-controller-manager in this operator only acts on ClusterSPIFFEID,
## ClusterFederatedTrustDomain and ClusterStaticEntry objects whose
## spec.className is this value (watchClassless: false). An object without it
## is accepted by the API and then silently ignored - no entry, no SVID.
spire_class_name: zero-trust-workload-identity-manager-spire
spire_bundle_configmap: spire-bundle

## ---------------------------------------------------------------------------
## SPIRE server
## ---------------------------------------------------------------------------
## CA lifetime and the default SVID lifetimes. A short X.509 SVID TTL is the
## point of the exercise - rotation is continuous and nobody touches it - so
## the operator defaults are kept.
spire_server_ca_validity: 24h
spire_server_x509_svid_ttl: 1h
spire_server_jwt_svid_ttl: 5m
spire_server_ca_key_type: rsa-2048
spire_server_ca_subject:
  country: US
  organization: mylab
  commonName: SPIRE Server CA
spire_server_log_level: info
## Required by the SpireServer API even when the OIDC discovery provider is
## not deployed (it is not, here). Only used for JWT-SVIDs.
spire_server_jwt_issuer: "https://oidc-discovery.{{ spire_c.apps_domain }}"

## Applied by the operator to BOTH containers of the spire-server pod (the
## server and spire-controller-manager). See the memory budget in README.md.
spire_server_resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

## ---------------------------------------------------------------------------
## Storage for the SPIRE server
## ---------------------------------------------------------------------------
## The SPIRE server keeps its datastore (sqlite) and its CA signing keys on a
## PersistentVolume, and the SpireServer API makes persistence mandatory.
##
## The base clusters have NO StorageClass: LVM Storage comes from setup-hub-acm,
## which the base build skips (--skip-tags acm), and the SNO has none at all.
##
##   auto   use the cluster's default StorageClass if it has one (a hub built
##          with --tags acm has lvms-vg1), otherwise 'local'
##   local  a static local PersistentVolume on one node, under this lab's own
##          StorageClass - nothing cluster-wide, nothing another use case sees
##   <name> that StorageClass, as it stands
spire_storage_class: auto
spire_local_storage_class: spire-local
## On the node's own disk. Holds the CA keys: wiping it wipes the trust domain.
spire_local_pv_path: /var/lib/spire-server-data
## "" = the first node labelled node-role.kubernetes.io/worker (worker1 on the
## hub, the one node on the SNO). The SPIRE server is then pinned to that node.
spire_local_pv_node: ""
spire_server_pv_size: 1Gi

## ---------------------------------------------------------------------------
## SPIRE agent and the CSI driver
## ---------------------------------------------------------------------------
spire_agent_log_level: info
spire_agent_resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 256Mi}
## Applied to both containers of each CSI driver pod (the driver and the
## node-driver-registrar).
spire_csi_resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
## Where the CSI driver finds the agent's Workload API socket on the node, and
## the name workloads use in their inline CSI volume.
spire_agent_socket_path: /run/spire/agent-sockets
spire_csi_driver_name: csi.spiffe.io

## ---------------------------------------------------------------------------
## Federation - hub.mylab.com <-> sno.mylab.com
## ---------------------------------------------------------------------------
## When true the spire phase enables each server's federation bundle endpoint
## (https_spiffe profile) and publishes it through a passthrough Route, and the
## federation plays exchange the bootstrap bundles and create a
## ClusterFederatedTrustDomain on each side.
##
## WHY NOT THE OPERATOR'S OWN ROUTE (managedRoute: "true"). The operator names
## it federation.<trust_domain> - federation.hub.mylab.com - which is outside
## the *.apps wildcard and has no record on the helper. It would need a base
## DNS change. A Route under *.apps resolves today, and for https_spiffe the
## hostname is only used for routing (SNI): the endpoint is authenticated by
## its SPIFFE ID, spiffe://<trust_domain>/spire/server, not by its name.
spire_federation_enabled: true
spire_federation_route_name: spire-federation
spire_federation_route_host: "{{ spire_federation_route_name }}.{{ spire_c.apps_domain }}"
## Seconds; how often the peer re-fetches this bundle (60-3600).
spire_federation_refresh_hint: 300

## ---------------------------------------------------------------------------
## The demo workload
## ---------------------------------------------------------------------------
## One namespace per cluster with three deployments, each a spiffe-helper
## sidecar (fetches the SVID over the Workload API socket the CSI driver
## mounts, writes it to a shared emptyDir, keeps it renewed) and a Python
## container:
##
##   echo-server  mTLS server on 8443: requires a client SVID, checks the
##                client's SPIFFE ID against an allowlist
##   client       a registered workload: has an SVID, is on the allowlist
##   intruder     the same pod spec WITHOUT the registration label, so there is
##                no registration entry, no SVID, and the server refuses it
spire_demo_namespace: spiffe-demo
## The label the ClusterSPIFFEID selects on. 'intruder' does not carry it.
spire_demo_identity_label: spiffe.mylab.com/identity
spire_demo_python_image: registry.access.redhat.com/ubi9/python-311:latest
spire_demo_helper_image: ghcr.io/spiffe/spiffe-helper:0.11.0
## The echo-server's passthrough Route, for the cross-cluster call.
spire_demo_route_host: "echo-{{ spire_demo_namespace }}.{{ spire_c.apps_domain }}"

## ---------------------------------------------------------------------------
## Where things are written on the lab host
## ---------------------------------------------------------------------------
## Every manifest the playbook applies is rendered here first, one directory per
## cluster, then applied with `oc apply -f`. Readable afterwards.
spire_manifest_root: /root/spiffe-spire-manifests
spire_manifest_dir: "{{ spire_manifest_root }}/{{ spire_c.name }}"
## The workshop's shell environment (prep phase).
spire_workshop_env_file: /root/spiffe-workshop.env
## One file per cluster, loaded by the env file's `lab <cluster>`.
spire_workshop_cluster_dir: /root/spiffe-workshop.d
spire_workshop_manifest_root: /root/spiffe-workshop-manifests

## How long to wait for the operator, the operands and the demo pods. Image
## pulls from registry.redhat.io and ghcr.io dominate on a fresh cluster.
spire_wait_retries: 60
spire_wait_delay: 10
