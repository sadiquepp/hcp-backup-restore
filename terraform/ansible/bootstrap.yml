---
# Prepare a freshly provisioned metal host to run the lab.
#
#   ansible-playbook -i inventory.ini ansible/bootstrap.yml
#
# Terraform runs this after the instances answer ssh, but it is an ordinary
# playbook and can be re-run on its own - which is the point of keeping it
# out of terraform's provisioners.
#
# It stops short of building anything. The lab needs two things only a human
# can supply - the RHEL KVM qcow2 (a Red Hat login) and vault.yaml (your pull
# secret) - so this gets the host to the point where `./build-lab.sh` is the
# next command, and says what is still missing.
- name: Prepare the metal host for the lab
  hosts: metal
  become: true
  gather_facts: true

  vars:
    lab_repo_dir: /root/hcp-backup-restore
    lab_image_name: rhel-9.8-x86_64-kvm.qcow2

    # ~/.tmux.conf. The build runs for hours inside tmux, so these are about
    # watching it rather than taste - set lab_tmux_conf: [] to skip entirely.
    #
    # mouse on: scroll the pane with the wheel instead of ctrl-b [ first.
    #   The trade is that a plain drag now selects into tmux's buffer, not the
    #   terminal's - hold SHIFT while dragging for the native selection your
    #   system clipboard sees.
    # history-limit: the default 2000 lines does not survive one cluster
    #   install, so the error you want to scroll back to is already gone.
    lab_tmux_conf:
      - "set -g mouse on"
      - "set -g history-limit 50000"

  tasks:
    - name: Install the tools the lab is driven with
      ansible.builtin.dnf:
        name:
          - ansible-core
          - tmux
          - git
          # python3-libvirt and python3-lxml back community.libvirt's modules.
          # Installing the collection is not enough - its modules import these,
          # and the failure otherwise arrives much later as a missing Python
          # module inside a task that looks unrelated.
          - python3-libvirt
          - python3-lxml
        state: present

    # RHEL on AWS uses RHUI, so dnf works with no subscription-manager
    # registration on the HOST. The guests inside it are ordinary qcow2s with
    # no RHUI entitlement of their own - that is what vault.yaml's
    # org_id/activation_key are for, or the customized lab image.
    - name: Note how the host is getting its packages
      ansible.builtin.command:
        cmd: rpm -q rhui-azure-rhel9 redhat-cloud-client-configuration
      register: lab_rhui
      changed_when: false
      failed_when: false

    - name: Install the Ansible collections the lab uses
      ansible.builtin.command:
        cmd: "ansible-galaxy collection install {{ item }}"
      loop:
        - community.libvirt
        - community.crypto
      register: lab_galaxy
      changed_when: "'Nothing to do' not in lab_galaxy.stdout"
      environment:
        ANSIBLE_COLLECTIONS_PATH: /root/.ansible/collections

    - name: Clone the lab repository
      ansible.builtin.git:
        repo: "{{ lab_repo_url }}"
        dest: "{{ lab_repo_dir }}"
        version: "{{ lab_repo_branch }}"
        update: false        # never clobber local edits on a re-run

    # Not /var/lib/libvirt/images: that is created by the libvirt RPM, which
    # has not been installed yet at this point, and pre-creating a path an RPM
    # owns is exactly what base_image_dir exists to avoid.
    - name: Create the base image directory
      ansible.builtin.file:
        path: "{{ lab_base_image_dir }}"
        state: directory
        mode: '0755'

    # A separate file rather than edits to vars.yaml, so `git pull` in the
    # repo never conflicts and the host's own settings stay visible in one
    # place. Passed to every playbook with -e @.
    - name: Write this host's overrides
      ansible.builtin.copy:
        dest: "{{ lab_repo_dir }}/vars-metal.yaml"
        mode: '0644'
        content: |
          ## Generated by terraform/ansible/bootstrap.yml. Overrides for a
          ## c5.metal host. Pass it with -e @vars-metal.yaml, or merge what
          ## you want into vars.yaml.
          ##
          ##   ansible-playbook -i inventory/hosts setup_bm_host.yaml \
          ##       -e @vars-metal.yaml --vault-password-file ~/.vault_pass

          ## /var/lib/libvirt/images does not exist until libvirt is
          ## installed, so the image is staged somewhere this host owns.
          base_image_dir: {{ lab_base_image_dir }}

          ## Sized for 192 GiB of host RAM. The configured total is what
          ## matters, not what is in use today: guest page cache is touched
          ## host memory that never comes back, so guests ratchet toward
          ## their ceiling. Measured on this lab: 43% of configured right
          ## after install, 79% once the cluster was busy.
          worker_memory: {{ lab_worker_memory }}
          worker_cpu: {{ lab_worker_cpu }}

          ## VNC for virt-manager and guest consoles. Loopback only - the
          ## security group opens ssh and nothing else, and VNC truncates its
          ## password to 8 characters, so it is reached over a tunnel:
          ##   ssh -L 5999:localhost:5999 ec2-user@<this host>
          vnc_enabled: {{ lab_vnc_enabled | bool | lower }}
          vnc_localhost_only: true
          vnc_tunnel_user: ec2-user
      register: lab_overrides

    # Both accounts: the playbook connects as ansible_user and becomes root,
    # and the docs tell you to build from a root shell, so a config written to
    # only one of them is missing exactly when you want it.
    #
    # Home directories come from passwd rather than being assumed - /home/ec2-user
    # is right on this AMI and is not a fact worth hardcoding on a host that
    # someone may rebuild from a different one.
    - name: Read the passwd database
      ansible.builtin.getent:
        database: passwd
      when: lab_tmux_conf | length > 0

    # blockinfile, not copy: a marked block leaves anything else in the file
    # alone, so re-running the bootstrap never discards settings you added.
    - name: Configure tmux for watching a long build
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.getent_passwd[item][4] }}/.tmux.conf"
        marker: "# {mark} hcp-lab"
        block: "{{ lab_tmux_conf | join('\n') }}"
        create: true
        owner: "{{ item }}"
        # The gid from passwd, not the user's name: they match on RHEL but
        # that is a convention, not a guarantee, and a file group-owned by
        # root in someone's home is a small surprise waiting to happen.
        group: "{{ ansible_facts.getent_passwd[item][2] }}"
        mode: '0644'
      loop:
        - root
        - "{{ ansible_user }}"
      when: lab_tmux_conf | length > 0

    - name: Look for the staged base image
      ansible.builtin.stat:
        path: "{{ lab_base_image_dir }}/{{ lab_image_name }}"
      register: lab_base_image

    - name: Look for vault.yaml
      ansible.builtin.stat:
        path: "{{ lab_repo_dir }}/vault.yaml"
      register: lab_vault

    # Deliberately a report, not a failure. Neither of these can be automated
    # - one needs a Red Hat download, the other your pull secret - so the
    # bootstrap's job is to say precisely what is outstanding rather than to
    # exit non-zero on something it was never going to provide.
    - name: What is still needed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is ready to build.
          {{ 'STILL NEEDED: the RHEL KVM image at '
             ~ lab_base_image_dir ~ '/' ~ lab_image_name
             ~ ' - scp it from a machine with your Red Hat login.'
             if not lab_base_image.stat.exists else
             'Base image present.' }}
          {{ 'STILL NEEDED: ' ~ lab_repo_dir ~ '/vault.yaml - ansible-vault
             create it with pull_secret, org_id, activation_key, ssh_key and
             dns_forwarders, and put its password in ~/.vault_pass.'
             if not lab_vault.stat.exists else
             'vault.yaml present.' }}
          Then: tmux new -s lab; cd {{ lab_repo_dir }}/udn-bgp-evpn;
          ./build-lab.sh --evpn
