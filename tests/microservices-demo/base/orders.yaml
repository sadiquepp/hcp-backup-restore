# orders — stateful, append-only. The service to assert on when testing that
# state survives something.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-data
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # See catalog.yaml for the storageClassName rationale.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          image: quay.io/sclorg/python-312-c9s
          command: ["python3", "-u", "/opt/app/server.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATA_DIR
              value: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /opt/app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: orders-code
        - name: data
          persistentVolumeClaim:
            claimName: orders-data
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: orders
  ports:
    - port: 8080
      targetPort: http
      name: http
