# storefront — stateless edge service, the only one with a Route.
#
# The Route has no `host:`, so OpenShift generates one from the cluster's apps
# domain. That is what keeps this portable between clusters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas so a single node loss cannot take the edge down.
      # ScheduleAnyway, not DoNotSchedule: on a one-node cluster (CRC, SNO) a
      # hard constraint would leave the second replica Pending forever.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: storefront
      containers:
        - name: storefront
          image: quay.io/sclorg/python-312-c9s
          command: ["python3", "-u", "/opt/app/server.py"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            # Downstream URLs live in a ConfigMap so they are the single obvious
            # override point — see overlays/README notes on renaming.
            - configMapRef:
                name: storefront-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            # /healthz, never /api/summary: readiness must not flap because a
            # downstream is briefly unavailable.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /opt/app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: storefront-code
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: frontend
spec:
  to:
    kind: Service
    name: storefront
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
