apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The normal deploy: own namespace, PVC-backed, pinned image.
# Copy this directory as the starting point for a new project.

namespace: microservices-demo

resources:
  - ../../base
  - namespace.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: microservices-demo

# Pinned by digest rather than :latest so a redeploy months from now is the same
# bits. This is the linux/amd64 member of tag 20260820 - a child manifest, not
# the multi-arch index, because oc-mirror v2 cannot mirror that index at all
# (see roles/setup-mirror-registry/templates/imageset-config.yaml.j2 for why).
#
# So: amd64 only. On an ARM cluster or CRC on Apple silicon, override with
# `newTag: "20260820"` in your own overlay to get the multi-arch index back.
#
# Nothing to repoint for a disconnected cluster: oc-mirror mirrors this exact
# digest, so the ImageDigestMirrorSet it generates redirects the pull to the
# mirror registry on its own - no `newName:` needed.
images:
  - name: quay.io/sclorg/python-312-c9s
    digest: sha256:526d1584d52d0a400868c7616ca29b47e91ac73bcd28dd7d5d46cec538e1e230
