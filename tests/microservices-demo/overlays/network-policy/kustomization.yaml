apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Optional hardening overlay: default-deny plus the three flows the app needs.
#
# Kept OUT of base on purpose. NetworkPolicy enforcement depends on the cluster
# CNI, and the "traffic from the router" rule relies on an OpenShift-specific
# namespace label. Putting it in base would mean the generic app silently
# breaks on some clusters; as an overlay you opt in when you know it applies.

namespace: microservices-demo

resources:
  - ../default
  - networkpolicy.yaml
