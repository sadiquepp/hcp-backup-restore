apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROJECT-SPECIFIC overlay for this repo (hcp-backup-restore).
#
# Everything OADP-related lives here rather than in base/, so the app itself
# stays generic. Another project would ignore this directory entirely, or swap
# it for its own (a mesh overlay, a tracing overlay, a chaos overlay...).
#
# Note the Backup/Restore CRs land in openshift-adp, NOT the app namespace, so
# they carry an explicit `namespace:` and are excluded from the namespace
# transformer below by virtue of already having one set.

resources:
  - ../default
  - backup.yaml
  - restore.yaml
