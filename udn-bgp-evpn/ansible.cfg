## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running this lab from inside udn-bgp-evpn/ therefore
## does not pick up the repository root's ansible.cfg, so it is mirrored here.
##
## Keep this in step with ../ansible.cfg.
##
## Nothing else is needed. The roles this playbook uses live in ./roles/,
## which Ansible searches automatically because it sits next to the playbook,
## and the root playbooks keep using ../roles/ for the same reason.
[defaults]
host_key_auto_add = True
