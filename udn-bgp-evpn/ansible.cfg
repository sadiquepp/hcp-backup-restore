## Ansible reads ansible.cfg from the CURRENT WORKING DIRECTORY, not from the
## playbook's directory. Running this lab from inside udn-bgp-evpn/ therefore
## does not pick up the repository root's ansible.cfg, so it is mirrored here.
##
## Keep the [defaults] below in step with ../ansible.cfg.
[defaults]
host_key_auto_add = True

## Shared roles that deliberately did NOT move into this directory.
##
## setup-clab-fabric registers the containerlab VM by including setup-rhsm,
## which belongs to the whole repository - the helper, the mirror registry,
## MinIO and the Ceph VMs all need it, so it stays at the root rather than
## being duplicated here.
##
## Ansible already searches ./roles/ next to the playbook (that is how
## setup-clab-fabric and setup-udn-bgp resolve with no configuration), but it
## does not look one level up. This adds the repository's role directory, and
## keeps the three system defaults that naming roles_path would otherwise
## replace.
##
## The ../roles entry is relative to the WORKING DIRECTORY, which is the
## reason the documented way to run this lab is `cd udn-bgp-evpn` first.
## Invoking it as `ansible-playbook udn-bgp-evpn/setup_udn_bgp_lab.yaml` from
## the repository root picks up ../ansible.cfg instead of this file, and
## setup-rhsm is then not found.
roles_path = ../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
