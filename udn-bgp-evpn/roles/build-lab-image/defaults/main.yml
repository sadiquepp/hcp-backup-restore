---
# Defaults for build-lab-image.
#
# Everything meaningful lives in vars.yaml, next to the per-guest package
# lists it is derived from - these are only here so the role is runnable on
# its own and so `ansible-playbook --list-tasks` does not fail on an
# undefined variable.

customized_lab_image_force: false
lab_ssh_pubkey_path: /root/.ssh/lab_rsa.pub
lab_root_password: redhat
customized_lab_image_with_docker: true
customized_lab_image_docker_packages: [docker-ce, docker-ce-cli, containerd.io]
customized_lab_image_docker_repo: https://download.docker.com/linux/rhel/docker-ce.repo
