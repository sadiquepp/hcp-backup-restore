---
# defaults file for roles/setup-clab-fabric
#
# Everything a deployer normally touches lives in vars.yaml under the
# "UDN + BGP lab" heading. These are the knobs that rarely change.

## Where the containerlab VM's disk lives, derived from the lab-wide
## download_dir rather than hardcoded, so moving the image store moves this
## disk with everything else. The sibling VM roles (setup-ceph-vm,
## setup-minio-vm, setup-mirror-registry-vm) still spell the path out in
## full - they are left alone deliberately, since converting them touches
## files other feature branches are editing.
##
## The trailing slash is stripped because download_dir carries one in some
## revisions of vars.yaml and not others. A doubled separator works fine on
## Linux, but a libvirt disk path reading "images//clab_disk.qcow2" is the
## kind of thing that makes someone stop and wonder, so it is normalised in
## the one place the path is built.
clab_vm_disk_path: "{{ download_dir | regex_replace('/+$', '') }}/{{ clab_vm_disk }}"

## containerlab release to install when none is present. Pinned rather than
## floating so a re-run months later builds the same fabric - the bridge-kind
## and VLAN behaviour this lab leans on has been stable for a long time, but
## an unpinned installer is still an unpinned installer.
clab_version_pin: "0.68.0"

## Name of the Linux bridge INSIDE the containerlab VM that the fabric NIC is
## enslaved to and that containerlab attaches FRR nodes to (vm mode only). In
## host mode containerlab attaches to clab_fabric_bridge (virbr1) directly and
## this is unused.
clab_guest_bridge: br-fabric

## Which containerlab topology to build:
##   bgp  - one border leaf (leaf1) plus a per-tenant external endpoint.
##          Everything phases 1 to 3 need.
##   evpn - leaf1 + spine + leaf2, iBGP EVPN with VXLAN between the leaves,
##          and the tenant external endpoints moved behind leaf2 so traffic
##          genuinely crosses the fabric. Phase 4.
clab_topology: bgp

## The clab VM's own address on the fabric bridge, used only when the optional
## client VM is built (--tags clabclient). The bridge has no IP otherwise - it
## is a pure layer 2 extension of virbr1 - so this makes the VM a host on the
## fabric and therefore able to forward the client's packets to leaf1.
## Must not collide with clab_fabric_router_octet (leaf1) or any node's octet.
clab_fabric_client_gw_octet: 50

udn_client_vm_disk_path: "{{ download_dir | regex_replace('/+$', '') }}/{{ udn_client_vm_disk }}"
udn_client_base_image_path: "{{ base_image_dir }}/{{ udn_client_base_image }}"

## The client VM's management MAC. Same 52:54:00:e2:54:<octet> scheme the lab's
## other guests use, which is what the default network's DHCP reservations are
## keyed on - so this is the contract between virt-install and the reservation,
## and both read it from here.
udn_client_mac: "52:54:00:e2:54:{{ ip_list[udn_client_vm_name] }}"

## How to reach the client VM. The base image is built by setup-bm-host with
## `virt-customize --ssh-inject "root:file:/root/.ssh/lab_rsa.pub"`, so lab_rsa
## is the only key a freshly created guest accepts, and root is the only user
## it is injected for. Same pair every VM in inventory/hosts names explicitly.
udn_client_ssh_user: root
udn_client_ssh_key: "~/.ssh/lab_rsa"

## Phase 3 per-tenant client VMs (--tags clabtenantclients).
udn_tenant_client_base_image_path: "{{ base_image_dir }}/{{ udn_tenant_client_base_image }}"
## Same management-NIC OUI as the phase-2 client, so the two schemes do not
## collide: mgmt is ...:e2:54:<octet>, fabric is clab_fabric_mac_prefix:<octet>.
udn_tenant_client_mgmt_mac_prefix: "52:54:00:e2:54"

## How long fabric-verify.yml waits for leaf1's bgpd to hold every node as a
## neighbour after a deploy. `vtysh -b` pushes frr.conf into a bgpd that is
## still starting, so the summary can be read while the config is half
## applied - and a partly applied config looks identical to a rejected one.
##
## 12 x 5s. Raised from a single sample when enabling udn_bgp_password made
## the window wider: every `neighbor ... password` resets that peer and sets
## TCP_MD5SIG on its socket.
clab_leaf1_bgp_retries: 12
clab_leaf1_bgp_delay: 5
