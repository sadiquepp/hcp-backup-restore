---
# An external client VM for phase 2 reachability testing.
#
# ONE NIC, on the management network, and no fabric presence at all. That is
# deliberate: a client on the fabric segment shares a broadcast domain with
# leaf1 and every worker, so leaf1 answers with `Redirect Host` and the packets
# go direct - testing layer 2, not BGP. Off-segment the client must be routed,
# by the clab VM and then by leaf1 on what BGP told it, and `ttl=61` on the
# reply is the evidence.
#
# The disk is a plain copy of the base image rather than the virt-resize
# expansion the other VMs use. This VM runs ping and tcpdump; it has no use for
# a grown root filesystem, and the copy is seconds rather than minutes.

# This file builds a VM. It has to run ON the libvirt host, which for this lab
# means running the playbook there rather than from a workstation - the play is
# `hosts: localhost`, so there is no delegation to fall back on. The cluster-
# side tags are only `oc` against a kubeconfig and run anywhere; anything that
# touches libvirt does not.
#
# Checked explicitly because the failure otherwise surfaces as whatever the
# workstation's sudo says - on a Mac, "sudo: a password is required" from the
# first task that tries to become, which says nothing about the real problem.
- name: Check for libvirt tooling
  ansible.builtin.command:
    cmd: "which virsh qemu-img virt-install"
  register: udn_client_virsh
  changed_when: false
  failed_when: false

- name: Fail if this is not the libvirt host
  ansible.builtin.assert:
    that: udn_client_virsh.rc == 0
    fail_msg: >-
      virsh, qemu-img or virt-install is missing, so this is not the lab's
      libvirt host. --tags clabclient builds a VM and must run ON the
      hypervisor ({{ ansible_hostname | default('the lab host') }} is what
      Ansible sees), not from a workstation - the play is `hosts: localhost`
      and has nothing to delegate to. The cluster-side tags (preflight,
      default, shared, vrflite, evpn) are only `oc` calls and do run anywhere.
    success_msg: >-
      libvirt tooling is present.

- name: Refuse to build on an address MetalLB owns
  ansible.builtin.include_tasks: client-ip-check.yml
  vars:
    udn_client_names: ["{{ udn_client_vm_name }}"]

- name: Look for the base image for the client VM
  ansible.builtin.stat:
    path: "{{ udn_client_base_image_path }}"
  register: udn_client_base

- name: Fail if the base image is missing
  ansible.builtin.assert:
    that: udn_client_base.stat.exists
    fail_msg: >-
      No base image at {{ udn_client_base_image_path }}. The client VM is a
      plain copy of it - there is no download step, deliberately, because every
      other VM in this lab expects the image to be staged already. Put a qcow2
      there and set udn_client_base_image to its filename (and
      udn_client_os_variant to match: rhel9.5, rhel8.10, ...).
    success_msg: >-
      Base image {{ udn_client_base_image }} found.

# The client's traffic is asymmetric by construction - request over the fabric,
# reply out the node's default gateway - so every node it talks to must accept
# packets whose reverse path points elsewhere. Warned about here rather than
# left to be discovered, because the failure is per-node and looks like nothing:
# the pods on nodes that have it answer, the pods on nodes that do not are
# silent, and every control-plane signal is identical either way.
- name: Warn if the nodes still have strict reverse-path filtering
  ansible.builtin.debug:
    msg: >-
      {{ ['udn_bgp_loose_rp_filter is false, so the nodes are running strict'
          ' reverse-path filtering and will silently drop this client'
          ' traffic.',
          'Set udn_bgp_loose_rp_filter: true in vars.yaml and re-run'
          ' --tags shared. That applies it to every worker through the Tuned'
          ' profile and survives a reboot, which `sysctl -w` on one node does'
          ' not.',
          'Symptom if you skip it: pods on some nodes answer and pods on'
          ' others do not, with nothing to distinguish them.'] }}
  when: not (udn_bgp_loose_rp_filter | default(false) | bool)

- name: Check whether the client VM disk already exists
  ansible.builtin.stat:
    path: "{{ udn_client_vm_disk_path }}"
  register: udn_client_disk

# --sparse=always matters: the base image is mostly holes and a plain cp would
# write every zero out.
- name: Copy the base image to the client VM disk
  ansible.builtin.command:
    cmd: "cp --sparse=always {{ udn_client_base_image_path }} {{ udn_client_vm_disk_path }}"
  when: not udn_client_disk.stat.exists

# The default network's DHCP reservations are generated from ip_list, but that
# template is only rendered when the network is (re)defined - and redefining it
# on a running lab drops every guest's lease. net-update adds the one host
# entry live instead.
#
# `net-update ... add` is not idempotent: a second run fails with "there is an
# existing dhcp host entry in network 'default' that matches ...". Read the
# network and skip, rather than running it and forgiving the error - matching
# on libvirt's wording is the kind of guard that silently stops working when
# the wording changes, and an earlier version of this task got that string
# wrong and failed every re-run.
- name: Read the default network's current definition
  ansible.builtin.command:
    cmd: "virsh net-dumpxml default"
  register: udn_client_net_xml
  changed_when: false

- name: Reserve the client VM's management address
  ansible.builtin.command:
    cmd: >-
      virsh net-update default add ip-dhcp-host
      "<host mac='{{ udn_client_mac }}'
             name='{{ udn_client_vm_name }}'
             ip='{{ lab_network_prefix }}.{{ ip_list[udn_client_vm_name] }}'/>"
      --live --config
  when: udn_client_mac | lower not in udn_client_net_xml.stdout | lower

- name: Check whether the client VM is already defined
  ansible.builtin.shell:
    cmd: "virsh dominfo {{ udn_client_vm_name }} 2>/dev/null | awk '/State/ {print $2}'"
  register: udn_client_vm_state
  changed_when: false

- name: Define the client VM (management NIC only, no fabric NIC)
  ansible.builtin.shell:
    cmd: |
      virt-install \
      --import \
      --name "{{ udn_client_vm_name }}" \
      --memory "{{ udn_client_vm_memory }}" \
      --vcpus "{{ udn_client_vm_vcpus }}" \
      --disk "{{ udn_client_vm_disk_path }}",format=qcow2,cache=none,bus=virtio \
      --os-variant={{ udn_client_os_variant }} \
      --memballoon model=virtio,freePageReporting=on \
      --noautoconsole \
      --cpu host-passthrough \
      --network network:default,mac={{ udn_client_mac }}
  when: udn_client_vm_state.stdout == ''

- name: Wait for the client VM to accept ssh
  ansible.builtin.wait_for:
    host: "{{ lab_network_prefix }}.{{ ip_list[udn_client_vm_name] }}"
    port: 22
    timeout: 300
    delay: 10

# Registered as a named host rather than delegated to by bare IP, so it can
# carry its own connection settings.
#
# StrictHostKeyChecking is the one that matters. This VM is brand new, so its
# host key is not in root's known_hosts, and the ssh prompt does not fail the
# task - it hangs the play waiting for a "yes" that Ansible will never type.
# Every host in inventory/hosts carries the same -o argument for this reason;
# a delegated host that is not in inventory inherits nothing and needs its own.
#
# The key has to be named too. setup-bm-host builds the base image with
# `virt-customize --ssh-inject "root:file:/root/.ssh/lab_rsa.pub"`, so lab_rsa
# is the ONLY key in a fresh guest's authorized_keys - which is why every VM in
# inventory/hosts carries ansible_ssh_private_key_file. Relying on ssh to find
# it by itself works only where root has it in an agent or an ~/.ssh/config
# entry, and silently does not on a host that has neither.
- name: Register the client VM as an Ansible host
  ansible.builtin.add_host:
    name: "{{ udn_client_vm_name }}"
    ansible_host: "{{ lab_network_prefix }}.{{ ip_list[udn_client_vm_name] }}"
    ansible_user: "{{ udn_client_ssh_user }}"
    ansible_ssh_private_key_file: "{{ udn_client_ssh_key }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    groups: udn_client
  changed_when: false

# The reply from a UDN pod arrives here from the node's default gateway with a
# source the host has no route to, and is forwarded back out the same bridge to
# the client. Strict reverse-path filtering rejects exactly that. The effective
# value is max(all, <iface>), so both have to be set - a host with
# conf.all.rp_filter = 0 and conf.virbr0.rp_filter = 1 is strict.
- name: Relax reverse-path filtering on the lab host's management bridge
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-udn-client.conf
    mode: "0644"
    content: |
      # Phase 2 reply traffic from UDN pods is asymmetric by construction - see
      # bgp-evpn.md, "Reaching a UDN pod from outside the cluster".
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.virbr0.rp_filter = 2
  register: udn_client_host_sysctl

- name: Apply the host sysctls
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-udn-client.conf
  when: udn_client_host_sysctl is changed
