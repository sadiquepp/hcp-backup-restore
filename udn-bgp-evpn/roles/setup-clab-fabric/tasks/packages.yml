---
# Install a guest's packages, or - when it was built from the prebuilt image -
# verify they are already there.
#
# Included with two variables:
#   udn_pkg_list  the packages
#   udn_pkg_what  what to call this guest in messages
#
# WHY VERIFY RATHER THAN SKIP. A bare `when: not udn_lab_image_ready` on the
# dnf task would be shorter and would be the wrong shape: it asserts nothing,
# so an image built before a package was added to vars.yaml produces a guest
# that is silently missing it, and the failure surfaces later inside whatever
# needed the package - haproxy failing to start, a tcpdump that is not there.
# rpm -q costs one command and names the missing package at the point the
# assumption is made.
#
# The same guests' package lists feed build-lab-image.yaml, so the two halves
# cannot drift by editing one list; they can only drift by not rebuilding the
# image, which is precisely what this reports.

- name: Install {{ udn_pkg_what }} packages ({{ udn_pkg_list | join(', ') }})
  ansible.builtin.dnf:
    name: "{{ udn_pkg_list }}"
    state: present
  when: not (udn_lab_image_ready | default(false) | bool)

# --whatprovides, not a bare rpm -q. On RHEL 9 the base image carries
# curl-minimal, which PROVIDES curl without being named curl: `dnf install
# curl` is therefore a satisfied no-op while `rpm -q curl` says "package
# curl is not installed". A bare rpm -q would fail this assert on a
# perfectly good image - the check reporting on the wrong thing again.
- name: Check the prebuilt image carries the {{ udn_pkg_what }} packages
  ansible.builtin.command:
    cmd: "rpm -q --whatprovides {{ udn_pkg_list | join(' ') }}"
  register: udn_pkg_check
  changed_when: false
  failed_when: false
  when: udn_lab_image_ready | default(false) | bool

- name: Fail if the prebuilt image is missing a {{ udn_pkg_what }} package
  ansible.builtin.assert:
    that: udn_pkg_check.rc == 0
    fail_msg: >-
      This guest was built from {{ udn_lab_image }}, which is missing a
      package it needs:

      {{ udn_pkg_check.stdout | default('') }}

      The image has no entitlement, so dnf cannot fix it here. Rebuild it:

        cd udn-bgp-evpn && ansible-playbook -i ../inventory/hosts
        build-lab-image.yaml --vault-password-file ~/.vault_pass
        -e udn_lab_image_force=true

      then rebuild this guest. Or delete
      {{ base_image_dir }}/{{ udn_lab_image }} to go back to registering
      each guest with subscription-manager.
    success_msg: >-
      {{ udn_pkg_what }} packages present in {{ udn_lab_image }}.
  when: udn_lab_image_ready | default(false) | bool
