---
# One further fabric segment - a "rack" - and its leaf. Looped from main.yml
# with clab_rack = {key: <segment name>, value: <its nodes>}.
#
#   hub workers, sno -- virbr1 -- leaf1 --+
#                                          spine -- leaf2
#   <rack nodes>     -- <bridge> -- <leaf> -+
#
# Everything here is ADDED beside the running fabric. Nothing in it redeploys
# leaf1, leaf2 or the spine:
#
#   1. a libvirt network for the segment             (lab host)
#   2. a NIC on it for each of the rack's node VMs   (lab host)
#   3. a NIC on it for the containerlab VM, hot-plugged, and an in-guest
#      bridge enslaving it                           (lab host, clab VM)
#   4. the leaf, as its OWN containerlab lab - <clab_lab_name>-<segment> - so
#      `deploy --reconfigure` on it can only ever touch the leaf
#   5. a veth from the spine to the leaf, made with `containerlab tools veth`
#      because the spine belongs to the other lab
#   6. the spine's neighbours for the leaf, applied live with vtysh -f. The
#      spine's frr.conf carries them too, for the next full redeploy.
#
# Steps 1-3 reuse fabric-network.yml, node-nics.yml and the bridge script with
# the segment's values in place of the first segment's, so a rack is built by
# exactly the code that built virbr1.

- name: Resolve this rack's segment
  ansible.builtin.set_fact:
    clab_rack_name: "{{ clab_rack.key }}"
    clab_rack_seg: "{{ clab_fabric_segments[clab_rack.key] }}"
    clab_rack_lab: "{{ clab_lab_name }}-{{ clab_rack.key }}"
    clab_rack_dir: "{{ clab_lab_dir }}-{{ clab_rack.key }}"

- name: Name the rack's leaf container and the spine container
  ansible.builtin.set_fact:
    clab_rack_leaf_ctr: "clab-{{ clab_rack_lab }}-{{ clab_rack_seg.leaf }}"
    clab_spine_ctr: "clab-{{ clab_lab_name }}-spine"
    clab_rack_bridge: >-
      {{ clab_rack_seg.guest_bridge if clab_deploy_mode == 'vm' else clab_rack_seg.bridge }}

- name: Build the rack's libvirt network
  ansible.builtin.include_tasks:
    file: fabric-network.yml
    apply:
      tags: [fabric, clabdeploy, rack]
  vars:
    clab_fabric_network: "{{ clab_rack_seg.network }}"
    clab_fabric_bridge: "{{ clab_rack_seg.bridge }}"

- name: Attach a NIC on the rack's network to each of its node VMs
  ansible.builtin.include_tasks:
    file: node-nics.yml
    apply:
      tags: [fabric, clabdeploy, rack]
  vars:
    clab_fabric_nodes: "{{ clab_rack.value }}"
    clab_fabric_network: "{{ clab_rack_seg.network }}"
    clab_fabric_mac_prefix: "{{ clab_rack_seg.mac_prefix }}"
    clab_fabric_prefix: "{{ clab_rack_seg.prefix }}"
    clab_fabric_netmask_bits: "{{ clab_rack_seg.netmask_bits }}"

# The containerlab VM already has a NIC on virbr1 at <clab_fabric_mac_prefix>:
# <octet>. This one is on the rack's network at <mac_prefix>:<octet>, so the
# bridge script can find it by MAC. Hot-plugged: the VM keeps running, and
# with it leaf1, the spine and leaf2.
- name: Read the containerlab VM's interfaces
  ansible.builtin.command:
    cmd: "virsh domiflist {{ clab_vm_name }}"
  register: clab_rack_vm_ifs
  changed_when: false
  when: clab_deploy_mode == 'vm'

- name: Hot-plug a NIC on the rack's network into the containerlab VM
  ansible.builtin.command:
    cmd: >-
      virsh attach-interface {{ clab_vm_name }}
      --type network --source {{ clab_rack_seg.network }}
      --model virtio
      --mac {{ clab_rack_seg.mac_prefix }}:{{ ip_list.clab }}
      --live --config
  when:
    - clab_deploy_mode == 'vm'
    - (clab_rack_seg.mac_prefix ~ ':' ~ ip_list.clab) | lower not in (clab_rack_vm_ifs.stdout | lower)

- name: Build the rack's bridge and leaf on the containerlab host
  ansible.builtin.include_tasks:
    file: rack-clab.yml
    apply:
      delegate_to: "{{ clab_exec_host }}"
      tags: [fabric, clabdeploy, rack]
