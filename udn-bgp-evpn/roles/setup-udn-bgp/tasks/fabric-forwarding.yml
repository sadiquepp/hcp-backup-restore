---
# Make the fabric NIC forward, and say what its neighbours look like.
#
# Included TWICE on purpose - once from main.yml right after the NNCP that
# addresses the NIC, and again from verify.yml immediately before the check
# that asserts on it. The second pass is not belt-and-braces; it is the whole
# point, and it exists because of a failure the first pass could not survive.
#
# WHY ONE REPAIR IS NOT ENOUGH
#
# Between the two include points the entire EVPN phase runs: a VTEP NNCP, the
# tenant CUDNs, and the ovnkube-node reconfiguration those provoke. A run that
# repaired forwarding early was still read back as 0 on worker2 here - 120s of
# retries later, because the check only READS. Nothing between the repair and
# the check writes the value, so a loop waiting for it to become 1 waits for
# something that is not coming. The clue was that re-running the role fixed
# it: the rerun's repair pass wrote it again.
#
# WHAT ZEROES IT
#
# Almost certainly a write to a GLOBAL knob rather than anything touching this
# NIC. net.ipv4.ip_forward and net.ipv4.conf.all.forwarding are the same knob,
# and the kernel propagates a write to it onto EVERY interface
# (inet_forward_change), so one `sysctl -w net.ipv4.ip_forward=0` resets a
# per-device value that was deliberately set to 1 - with no event on the
# device, no NetworkManager reactivation, and nothing in the journal about the
# interface. OVN-Kubernetes enables forwarding per interface (br-ex,
# ovn-k8s-mpN) and keeps the global one off, so it re-enables the interfaces it
# knows about and leaves the fabric NIC at the 0 it just wrote. That is
# consistent with every symptom seen: only the fabric NIC, only on nodes the
# EVPN phase reconfigured, and repaired by any pass that writes it again.
#
# rp_filter is the same inheritance problem with a different sysctl, and it
# cost a full day of the shared phase looking broken. The fabric NIC is
# hot-plugged, so it is created AFTER boot and takes conf.default.rp_filter,
# which is 1 on RHCOS. The effective value is max(all, <iface>), so with
# all=0 the interface's own 1 wins and the filter is strict.
#
# Phase 2's client is deliberately OFF-SEGMENT: the request reaches the pod
# over the fabric and the pod's reply leaves by the node's default gateway on
# the management network. The paths differ by design - udn-client-routes.sh
# sets rp_filter=2 on the CLIENT for exactly this reason and says so - but
# nothing set it on the NODE, which is the other end of the same asymmetry.
# Strict rp_filter then drops the request at INPUT, before it is assigned an
# output device, so:
#
#   - the echo request appears on enp8s0 In and on no other interface
#   - `ip route get <pod> from <client> iif enp8s0` returns
#     "RTNETLINK answers: Invalid argument"
#   - forwarding, the ip rules, the route in the VRF table and the BGP
#     advertisement are all correct and all irrelevant
#
# The DURABLE fix is vars.yaml:udn_bgp_loose_rp_filter, which puts
# net.ipv4.conf.all.rp_filter=2 in the Tuned profile - every worker, surviving
# a reboot. It has been there all along and defaults to false; this lab now
# sets it true. The write here is the immediate repair for the same value, so
# a run does not depend on when NTO next applies the profile, and it writes
# 'all' for the same reason the documented fix does: effective is
# max(all, <iface>), so all=2 wins whatever the interface inherited.
#
# 2 (loose) rather than 0: loose still rejects a source with no route at all,
# which keeps a genuine fabric misconfiguration visible, and it is what the
# client and tenant-client scripts already use.
#
# Which is why the echo below reports all= and default= alongside the
# interface's own value. If the interface reads 0 while all reads 0 too, that
# is the global-knob path. If the interface reads 0 while all reads 1, the
# device itself was re-created and inherited default=. Those are different
# faults with different fixes, and the previous version of this check could
# not tell them apart - it reported the symptom and left the cause to another
# round trip.
- name: Turn on forwarding for any fabric NIC that is not forwarding
  ansible.builtin.command:
    argv:
      - oc
      - debug
      - "node/{{ udn_bgp_node_names[item.ip_key] }}"
      - --quiet
      - --
      - chroot
      - /host
      - bash
      - -c
      - >-
        nic=$(ip -o link show | awk '/{{ clab_fabric_mac_prefix }}:{{ ip_list[item.ip_key] }}/ && !f {gsub(":","",$2); print $2; f=1}');
        [ -n "$nic" ] || { echo "NONE"; exit 0; };
        err=$(sysctl -w net.ipv4.conf.$nic.forwarding=1 net.ipv4.conf.default.forwarding=1
        net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.$nic.rp_filter=2 net.ipv4.conf.default.rp_filter=2 2>&1 >/dev/null); rc=$?;
        echo "$nic $(cat /proc/sys/net/ipv4/conf/$nic/forwarding)
        all=$(cat /proc/sys/net/ipv4/conf/all/forwarding)
        default=$(cat /proc/sys/net/ipv4/conf/default/forwarding)
        rp=$(cat /proc/sys/net/ipv4/conf/$nic/rp_filter)
        rp_all=$(cat /proc/sys/net/ipv4/conf/all/rp_filter)
        write_rc=$rc${err:+ write_err=$err}"
  loop: "{{ udn_bgp_cluster_nodes }}"
  loop_control:
    label: "{{ item.ip_key }}"
  register: udn_bgp_fwd_fix
  changed_when: false

# The write is no longer silenced with -qw. It was, and that made a failed
# write indistinguishable from a reverted one: sysctl's error went nowhere,
# the `;` chain let the echo succeed anyway, and the task reported the same
# "0" either way. write_rc says which happened. A non-zero rc here - read back
# in the same shell that just wrote it - means the write did not take at all:
# look at whether the debug pod is privileged and whether /proc/sys is mounted
# read-only, not at what else is running on the node.
- name: Report the fabric NIC forwarding state
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_node_names[item.item.ip_key] }}:
      {{ item.stdout | default('(not checked)') | trim }}
      (interface, net.ipv4.conf.<nic>.forwarding - the first value must be 1)
  loop: "{{ udn_bgp_fwd_fix.results | default([]) }}"
  loop_control:
    label: "{{ item.item.ip_key | default('?') }}"
  when: item.skipped is not defined

# all=0 means net.ipv4.ip_forward is off on this node, and that is a finding,
# not noise: it is the same value as conf.all.forwarding, a write to it
# propagates to every interface, and this role's per-interface write cannot
# survive the next one. It was 0 on two of three identically configured
# workers for the life of this lab, silently, because nothing looked at it -
# the per-interface value happened to be right often enough.
#
# Not fatal. The per-interface write above is what the assert in verify.yml
# tests, and the data path works while it holds. This says the node is one
# ovnkube-node restart away from losing it.
- name: Warn when the node is not forwarding globally
  ansible.builtin.debug:
    msg: >-
      {{ udn_bgp_node_names[item.item.ip_key] }}: net.ipv4.ip_forward is 0.
      The fabric NIC is set to forward, but a write to the global knob
      propagates to every interface, so the next ovnkube-node restart will
      undo it and nothing will put it back - the Node Tuning Operator runs
      tuned in no_daemon mode, so its profile is applied once and never
      re-asserted, however green its Profile CR reads. The fix is
      udn_bgp_set_ip_forwarding (gatewayConfig.ipForwarding: Global), which
      makes OVN-Kubernetes set it instead of reverting it. Check with
      `oc get network.operator cluster
      -o jsonpath='{.spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig}'`.
  loop: "{{ udn_bgp_fwd_fix.results | default([]) }}"
  loop_control:
    label: "{{ item.item.ip_key | default('?') }}"
  when:
    - item.skipped is not defined
    - item.stdout | default('') is search('all=0')
