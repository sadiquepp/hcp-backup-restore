---
# Verification.
#
# Every check here answers a question that "the CR applied cleanly" does not.
# A RouteAdvertisements CR is accepted long before it works, and a BGP
# session being Established proves only that two daemons agree - not that a
# pod can reach anything, and certainly not that a tenant cannot.
#
# Every report below hands debug a LIST, never a multi-line string.
# ansible.builtin.debug prints a list one element per line; a string is
# printed as one JSON blob with literal \n in it, which is unreadable for
# output that is meant to be read and for commands that are meant to be
# copied. Hence stdout_lines rather than stdout, and .splitlines() on any
# prose that goes with it.

- name: Show RouteAdvertisements status
  ansible.builtin.command:
    cmd: oc get routeadvertisements -o wide
  register: udn_bgp_ra_status
  changed_when: false
  failed_when: false

- name: Report RouteAdvertisements status
  ansible.builtin.debug:
    msg: "{{ udn_bgp_ra_status.stdout_lines + udn_bgp_ra_note.splitlines() }}"
  vars:
    udn_bgp_ra_note: |

      'Accepted' is what to look for. One that is not accepted says why in
      .status.conditions, and the usual causes are: targetVRF set to the
      string 'default' (it must be unset - see the CR comments), overlapping
      subnets between UDNs leaked into the default VRF, two CRs selecting the
      same network, and frrConfigurationSelector matching more than one
      FRRConfiguration.

- name: Show the FRRConfigurations, including the ones OVN-Kubernetes generated
  ansible.builtin.command:
    cmd: "oc get frrconfiguration -n {{ udn_bgp_frrk8s_namespace }}"
  register: udn_bgp_frrcfg
  changed_when: false
  failed_when: false

- name: Report FRRConfigurations
  ansible.builtin.debug:
    msg: "{{ udn_bgp_frrcfg.stdout_lines + udn_bgp_frrcfg_note.splitlines() }}"
  vars:
    udn_bgp_frrcfg_note: |

      The route-advertisements-* objects are generated by OVN-Kubernetes from
      the RouteAdvertisements CR and carry the prefixes actually being
      advertised. If they are absent, the RouteAdvertisements never took
      effect regardless of what its status says.

- name: Show NodeNetworkConfigurationPolicy status
  ansible.builtin.command:
    cmd: oc get nncp
  register: udn_bgp_nncp
  changed_when: false
  failed_when: false

- name: Report NNCP status
  ansible.builtin.debug:
    msg: "{{ udn_bgp_nncp.stdout_lines }}"

# The check that only exists because its absence cost a long debugging
# session. A fabric NIC that does not forward breaks the return path and
# leaves no trace: the reply is on the NIC in tcpdump and never reaches
# ovn-k8s-mpN. Everything above this - NNCP Available, session Established,
# RouteAdvertisements Accepted, prefixes exchanged - is green while it is
# broken, because every one of them is about the control plane.
#
# The repair runs again first. main.yml already did it, but the whole EVPN
# phase has happened since, and a run in which it was 0 here stayed 0 through
# 120s of retries - because this check only reads. See
# tasks/fabric-forwarding.yml. Repairing immediately before the check does not
# weaken it: what it now asserts is that the value STAYS set, which is the
# property the data path actually needs, and a node that fails it is one where
# something is zeroing the knob repeatedly rather than once.
- name: Repair forwarding on the fabric NICs before checking it
  ansible.builtin.include_tasks: fabric-forwarding.yml

- name: Check the fabric NIC forwards on each node
  ansible.builtin.command:
    argv:
      - oc
      - debug
      - "node/{{ udn_bgp_node_names[item.ip_key] }}"
      - --quiet
      - --
      - chroot
      - /host
      - bash
      - -c
      - >-
        nic=$(ip -o link show | awk '/{{ clab_fabric_mac_prefix }}:{{ ip_list[item.ip_key] }}/ && !f {gsub(":","",$2); print $2; f=1}');
        echo "${nic:-NONE} $(cat /proc/sys/net/ipv4/conf/${nic:-lo}/forwarding 2>/dev/null || echo unknown)
        all=$(cat /proc/sys/net/ipv4/conf/all/forwarding)
        default=$(cat /proc/sys/net/ipv4/conf/default/forwarding)"
  loop: "{{ udn_bgp_cluster_nodes }}"
  loop_control:
    label: "{{ item.ip_key }}"
  register: udn_bgp_fwd
  changed_when: false
  failed_when: false
  # WAIT, do not sample once. The repair above writes the value; this covers
  # the case where a concurrent write to the global knob lands between the two
  # and the node settles a moment later.
  #
  # `until` inside a loop retries EACH node independently, and udn_bgp_fwd in
  # the condition is that node's current attempt, not the whole results list.
  #
  # failed_when: false is deliberate and load-bearing here. When the retries
  # run out this task stays "ok" instead of dying with Ansible's bare
  # "Timeout when waiting", and the assert below gets to report the real
  # diagnostic - which node, which NIC, what to look at. A genuine fault is
  # therefore reported exactly as before; only the transient one is absorbed.
  #
  # The match is anchored to the FIRST field pair, not to the end of the line:
  # stdout now carries all= and default= after it.
  until: udn_bgp_fwd.stdout | default('') is search('^\S+ 1(\s|$)')
  retries: "{{ udn_bgp_fwd_check_retries }}"
  delay: "{{ udn_bgp_fwd_check_delay }}"

- name: Fail if a fabric NIC has forwarding disabled
  ansible.builtin.assert:
    that: item.stdout is search('^\S+ 1(\s|$)')
    fail_msg: >-
      On {{ udn_bgp_node_names[item.item.ip_key] }} the fabric NIC still
      reports '{{ item.stdout | trim }}' (interface,
      net.ipv4.conf.<nic>.forwarding, then the two global values) after being
      set to 1 and re-read for
      {{ udn_bgp_fwd_check_retries | int * udn_bgp_fwd_check_delay | int }}s.
      The first value must be 1. Traffic from the fabric to a pod arrives on
      this NIC and has to be forwarded to ovn-k8s-mpN; with forwarding off the
      kernel drops it in the routing decision and the only direct evidence is
      `ip route get <pod ip> from {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
      iif <nic>` answering "No route to host".
      READ all= FIRST, it splits the cause in two. all=0 means something
      wrote the global knob: net.ipv4.ip_forward and conf.all.forwarding are
      the same value and the kernel pushes a write to it onto every
      interface, so one write elsewhere on the node zeroed this NIC with no
      event on the device at all - find the writer
      (`sysctl -a | grep -E "ip_forward|all.forwarding"`, then the
      ovnkube-node container's logs), because this role sets it on every pass
      and something is undoing it on every pass. all=1 with the interface at
      0 is the opposite: the netdev was re-created and inherited
      conf.default.forwarding, so look at what re-created it - nmstate,
      NetworkManager, or a re-attach of the libvirt device. Either way the
      Tuned profile '{{ udn_bgp_tuned_name }}' is worth confirming as applied
      (`oc get profile -n {{ udn_bgp_tuned_namespace }}
      {{ udn_bgp_node_names[item.item.ip_key] }} -o yaml`), but it is no
      longer the first suspect: this role writes the sysctl directly twice per
      run, so reaching this message means the write is being reverted, not
      never made. The one-line repair on the node is
      `sysctl -w net.ipv4.conf.<nic>.forwarding=1`.
    success_msg: >-
      {{ udn_bgp_node_names[item.item.ip_key] }}: {{ item.stdout | trim }} (forwarding on)
  loop: "{{ udn_bgp_fwd.results }}"
  loop_control:
    label: "{{ item.item.ip_key }}"

- name: Show BGP sessions from the border leaf's point of view
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp summary'
      -c 'show bgp ipv4 unicast'
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_leaf_summary
  changed_when: false
  failed_when: false

- name: Report the border leaf's view
  ansible.builtin.debug:
    msg: "{{ udn_bgp_leaf_summary.stdout_lines }}"

# The summary above is PRINTED, and for a long time that was all. A build
# once ran to completion with two of five sessions in Connect - one hub
# worker and the whole SNO - because nothing looked at the output. The first
# sign was two unreachable tenants found by hand, ten hours later.
#
# `show bgp neighbor <addr>` rather than parsing the summary table: the
# summary's State/PfxRcd column holds a NUMBER when the session is up and a
# STATE WORD when it is not, in a field whose width moves with the peer's
# hostname, which is exactly the kind of parsing that reports the wrong thing
# under a format change. 'BGP state = Established' is one stable string.
#
# Scoped to THIS cluster's nodes, not every node on the fabric. leaf1 peers
# with both clusters, and running the hub's phase on a lab where the SNO half
# has not been built yet must not fail on the SNO's session legitimately
# being down. Between the hub run and the sno run every session is covered.
- name: Wait for each of this cluster's BGP sessions to the border leaf
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp neighbor {{ clab_fabric_prefix }}.{{ ip_list[item.ip_key] }}'
  delegate_to: "{{ clab_exec_host }}"
  loop: "{{ udn_bgp_cluster_nodes }}"
  loop_control:
    label: "{{ item.ip_key }}"
  register: udn_bgp_session
  changed_when: false
  # As elsewhere in this file: absorb the timeout so the assert below reports
  # which node and what to run, instead of Ansible's bare "Timeout when
  # waiting for ...".
  failed_when: false
  until: udn_bgp_session.stdout | default('') is search('BGP state = Established')
  retries: "{{ udn_bgp_session_check_retries }}"
  delay: "{{ udn_bgp_session_check_delay }}"

- name: Fail with the node whose session to the border leaf never came up
  ansible.builtin.assert:
    that: item.stdout | default('') is search('BGP state = Established')
    fail_msg: >-
      {{ udn_bgp_node_names[item.item.ip_key] | default(item.item.ip_key) }}
      ({{ clab_fabric_prefix }}.{{ ip_list[item.item.ip_key] }}) is
      '{{ item.stdout | default('') | regex_search('BGP state = \S+')
          | default('not reported by the leaf at all', true) }}'
      after {{ udn_bgp_session_check_retries | int * udn_bgp_session_check_delay | int }}s.
      Nothing this node advertises reaches the fabric and nothing from the
      fabric reaches its pods, while every cluster-side object stays green -
      the CUDN is realised, the VTEP annotation is present, the
      FRRConfiguration is applied. Work it in this order.
      (1) `docker exec clab-{{ clab_lab_name }}-leaf1 ping -c2
      {{ clab_fabric_prefix }}.{{ ip_list[item.item.ip_key] }}` - no reply
      means the fabric NIC has no address or is not on the bridge, which is
      an NNCP or a libvirt problem, not a BGP one.
      (2) Ping works but the session does not: it is TCP/179 specifically.
      `oc debug node/{{ udn_bgp_node_names[item.item.ip_key] | default('<node>') }}
      --quiet -- chroot /host timeout 20 tcpdump -ni <fabric nic> 'tcp port 179'`.
      SYNs arriving with no reply means the node's kernel is dropping them;
      SYN answered by RST means nothing is listening; nothing at all means
      the leaf is not trying and the fault is on the leaf.
      (3) A kernel that drops the SYN while ICMP works is the TCP-MD5
      signature - the signature rides in the TCP header, so ping is
      unaffected, and a key on one end only is discarded before BGP ever sees
      it, silently, at both ends. Compare
      `docker exec clab-{{ clab_lab_name }}-leaf1 vtysh -c 'show running-config'
      | grep {{ clab_fabric_prefix }}.{{ ip_list[item.item.ip_key] }}
      against `oc get frrnodestate <node> -o jsonpath='{.status.runningConfig}'`
      - both ends must have a password line or neither.
      Known to have happened once with identical config at both ends and no
      cause found; a rebuild cleared it.
    success_msg: >-
      {{ udn_bgp_node_names[item.item.ip_key] | default(item.item.ip_key) }}
      ({{ clab_fabric_prefix }}.{{ ip_list[item.item.ip_key] }}): Established.
  loop: "{{ udn_bgp_session.results }}"
  loop_control:
    label: "{{ item.item.ip_key }}"

- name: Show each tenant VRF's routing table on the border leaf
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp vrf {{ item.name }} ipv4 unicast'
      -c 'show ip route vrf {{ item.name }}'
  loop: "{{ udn_bgp_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_leaf_vrf
  changed_when: false
  failed_when: false
  when: udn_phase in ['vrflite', 'evpn']

- name: Report each tenant VRF's routes
  ansible.builtin.debug:
    msg: "{{ ['VRF ' ~ item.item.name ~ ':'] + (item.stdout_lines | default([], true)) }}"
  loop: "{{ udn_bgp_leaf_vrf.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: udn_phase in ['vrflite', 'evpn']

# EVPN adds a layer that can be healthy at the control plane and dead at the
# data plane - sessions up, type-5 routes on both sides, and no tunnel,
# because neither VTEP can reach the other. Underlay first, overlay second.
- name: Show the EVPN and VTEP state
  ansible.builtin.command:
    cmd: >-
      docker exec clab-{{ clab_lab_name }}-leaf1 vtysh
      -c 'show bgp l2vpn evpn summary'
      -c 'show bgp l2vpn evpn'
      -c 'show ip route {{ udn_bgp_vtep_prefix }}.0/24 longer-prefixes'
  delegate_to: "{{ clab_exec_host }}"
  register: udn_bgp_evpn_verify
  changed_when: false
  failed_when: false
  when: udn_phase == 'evpn'

- name: Report the EVPN and VTEP state
  ansible.builtin.debug:
    msg: >-
      {{ (udn_bgp_evpn_verify.stdout_lines | default([], true))
         + udn_bgp_evpn_note.splitlines() }}
  vars:
    udn_bgp_evpn_note: |

      Check in this order: the VTEP routes are present (no route to a node's
      VTEP means no tunnel to it, whatever the EVPN table says), then the
      evpn summary shows a session per node, then type-5 routes appear
      carrying each tenant's VNI.
  when: udn_phase == 'evpn'

- name: Show which VTEP address each node was assigned
  ansible.builtin.command:
    cmd: >-
      oc get nodes -o custom-columns=NODE:.metadata.name,VTEP:.metadata.annotations.k8s\.ovn\.org/vteps
  register: udn_bgp_node_vteps
  changed_when: false
  failed_when: false
  when: udn_phase == 'evpn'

- name: Report the node VTEP annotations
  ansible.builtin.debug:
    msg: >-
      {{ (udn_bgp_node_vteps.stdout_lines | default([], true))
         + udn_bgp_vtep_note.splitlines() }}
  vars:
    udn_bgp_vtep_note: |

      Empty for a node means OVN-Kubernetes did not discover an address on it
      inside {{ udn_bgp_vtep_prefix }}.0/24 - check that node's
      {{ udn_bgp_vtep_iface }} interface and its nncp. The exact annotation
      key varies by release; if this column is empty for every node, read
      `oc get node <node> -o yaml | grep -i vtep` instead of trusting it.
  when: udn_phase == 'evpn'

- name: Print the reachability tests to run by hand
  ansible.builtin.debug:
    msg: "{{ udn_bgp_manual_checks.splitlines() }}"
  vars:
    # The step numbers are generated rather than written, because half these
    # checks only exist in some phases. Hard-coded numbers left the 'default'
    # phase printing 1, 2, 5, 6.
    udn_bgp_manual_checks: |
      The checks above are control plane only. These are the ones that
      actually prove the data plane, and they are left as explicit commands
      because each needs a pod name from your cluster.
      {% set ns = namespace(step=0) %}
      {% set probe_node = udn_bgp_node_names[udn_bgp_cluster_nodes[0].ip_key] %}
      {% if udn_phase == 'default' %}

      This phase advertises the cluster DEFAULT pod network - no UDN exists
      yet, so these use an ordinary pod. If you have nothing to exec into:

        oc -n default run bgp-probe --restart=Never \
          --image=registry.redhat.io/rhel9/support-tools:latest \
          --overrides='{"spec":{"nodeName":"{{ probe_node }}"}}' \
          --command -- sleep 3600
      {% else %}

        # pick a pod per tenant
      {% for t in udn_bgp_tenants %}
        oc -n udn-{{ t.name }} get pods -o wide
      {% endfor %}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. The node can reach the leaf at all. This is the underlay, and it is
         the first thing to check because the BGP session rides on the same
         path - if this fails, the session is down too and nothing about
         OVN-Kubernetes is the reason:
           oc debug node/{{ probe_node }} -- chroot /host ping -c3 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
           # 'Destination Host Unreachable' from the node subnet's .2 address
           # is the host saying it could not ARP the leaf. Check the fabric
           # NIC's address, then {{ clab_fabric_bridge }} on this host, then the
           # bridge inside the clab VM - not OVN.
      {% if udn_phase != 'default' %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. The pod's address comes from the UDN, not the cluster network:
      {% for t in udn_bgp_tenants %}
           oc -n udn-{{ t.name }} exec <pod> -- ip -br addr show eth0
           # expect an address in {{ t.udn_subnet_shared if udn_phase == 'shared' else t.udn_subnet }}
      {% endfor %}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. The fabric learned one route per node, not one blanket route:
           docker exec clab-{{ clab_lab_name }}-leaf1 vtysh -c 'show bgp ipv4 unicast'
           # expect a prefix per node, each with that node's {{ clab_fabric_prefix }}.x
           # address as next hop
      {% set ns.step = ns.step + 1 %}

      {% if udn_phase == 'shared' %}
      {{ ns.step }}. Egress is NOT SNATed once the network is advertised. Capture on the
         tenant's management port, NOT on {{ clab_fabric_bridge }} - see the note below for
         why nothing reaches the fabric in this phase. Find the port first:
           oc debug node/<node> --quiet -- chroot /host ip -br addr show \
               | grep {{ udn_bgp_tenants[0].udn_subnet_shared | regex_replace('\\.0\\.0/16$', '') }}.
           # e.g. ovn-k8s-mp5   UNKNOWN   {{ udn_bgp_tenants[0].udn_subnet_shared | regex_replace('\\.0\\.0/16$', '') }}.0.2/24
           # RHCOS has no tcpdump - go through the support-tools image:
           oc debug node/<node> --quiet -- chroot /host podman run --rm --privileged \
               --network=host registry.redhat.io/rhel9/support-tools \
               tcpdump -nni <that port> icmp -c 10
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c5 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
         The source address must be the POD's, not the node's. That is the
         advertisement taking effect on the data plane.

         The ping itself will NOT succeed, and that is expected here rather
         than a fault. Egress leaves the tenant's VRF by its default route,
         which is the node's ordinary default gateway - the tenant VRF has no
         route to {{ clab_fabric_prefix }}.0/{{ clab_fabric_netmask_bits }}, because the fabric NIC is in the
         default VRF. Watch it go the wrong way:
           # on this lab host - the MANAGEMENT bridge, not the fabric one
           sudo tcpdump -ni virbr0 icmp
           # {{ udn_bgp_tenants[0].udn_subnet_shared | regex_replace('\\.0\\.0/16$', '') }}.0.3 > {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }} - right source, wrong NIC
         Giving the tenant VRF a path to the fabric is what phase 3 does.
      {% else %}
      {{ ns.step }}. Egress is NOT SNATed once the network is advertised. Run a ping and
         watch the fabric see the real pod IP as the source - this is the
         single clearest proof the advertisement took effect. Capture on the
         bridge rather than inside leaf1: the FRR image ships no tcpdump, and
         every packet between a node and the leaf crosses the bridge anyway.
           # on this lab host, not inside a container
           sudo tcpdump -ni {{ clab_fabric_bridge }} icmp
      {% if udn_phase == 'default' %}
           oc -n default exec bgp-probe -- ping -c3 {{ clab_fabric_prefix }}.{{ clab_fabric_router_octet }}
      {% else %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 {{ udn_bgp_tenants[0].external_host }}
      {% endif %}
      {% endif %}
      {% if udn_phase == 'shared' %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. What phase 2 DOES prove end to end - every node installed every
         other node's tenant slices, learned over BGP from the fabric:
           oc debug node/<node> --quiet -- chroot /host ip route show table main | grep bgp
           # one route per (other node, tenant), via that node's {{ clab_fabric_prefix }}.x
           # on enp8s0 - a Layer2 tenant contributes one prefix with several
           # paths instead of a slice per node
      {% endif %}
      {% if udn_phase in ['vrflite', 'evpn'] %}
      {% set ns.step = ns.step + 1 %}

      {% if udn_bgp_tenants | length > 1 %}
      {{ ns.step }}. Tenant isolation - the tests that matter, and the ones that must FAIL:
      {% for t in udn_bgp_tenants[1:] %}
           oc -n udn-{{ udn_bgp_tenants[0].name }} exec <pod> -- ping -c3 -W2 {{ t.external_host }}
      {% endfor %}
         Every one of these MUST time out. Their external networks are one
         hop away on the same physical link, so nothing but the VRF is
         keeping them apart. If any succeeds, the VRFs are leaking and
         VRF-Lite is not doing its job - check that targetVRF is 'auto' and
         the cluster is in local gateway mode.
      {% if udn_bgp_tenants[0].udn_subnet == udn_bgp_tenants[1].udn_subnet %}

         These failures do not say the same thing, which is why there is
         more than one. {{ udn_bgp_tenants[0].name }} and {{ udn_bgp_tenants[1].name }} carry the same pod
         subnet, so a failure between them could in principle be addressing
         rather than isolation. {{ udn_bgp_tenants[2].name if udn_bgp_tenants | length > 2 else 'A non-overlapping third tenant' }} overlaps with nothing
         anywhere, so a failure to reach it can only be the VRF. That is
         the one to take as the result.
      {% endif %}
      {% else %}
      {{ ns.step }}. Tenant isolation is not testable on this cluster: it builds
         one tenant ({{ udn_bgp_tenants[0].name }}), so there is nothing here to be
         isolated from. Run the isolation tests on the cluster that carries
         several - they are what proves the VRFs are real.

         What IS worth checking here is the opposite: that the deliberate
         openings work. If {{ udn_bgp_tenants[0].name }} is leaked to tenants on another
         cluster (see udn_vrf_leaks in vars.yaml), those are reachable BY
         DESIGN and everything else still must not be.
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. And the positive half - every tenant reaching its own:
      {% for t in udn_bgp_tenants %}
           oc -n udn-{{ t.name }} exec <pod> -- ping -c3 {{ t.external_host }}
      {% endfor %}
         All of these MUST succeed. A run where everything times out is not
         isolation, it is a broken phase.
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. Or run all of the above at once, in both directions:
           scripts/udn-vrf-isolation.sh
         Two matrices - pod to endpoint and endpoint to pod - expecting ok on
         the diagonal and FAIL everywhere else, plus the one check ping alone
         cannot make.
      {% if udn_bgp_tenants | length > 1 and udn_bgp_tenants[0].udn_subnet == udn_bgp_tenants[1].udn_subnet %}
         {{ udn_bgp_tenants[0].name }} and {{ udn_bgp_tenants[1].name }} share a subnet, so a reply to a
         ping proves something answered, not which pod answered - and the
         wrong tenant answering is the leak VRF-Lite exists to prevent. Where
         two tenants hold the same pod address it reads ICMP InEchos from
         /proc/net/snmp on both pods either side of one ping and names the
         responder.
      {% else %}
         Where two tenants hold the same pod address - which happens on the
         cluster that carries the overlapping pair - a reply proves something
         answered, not which pod answered, so it reads ICMP InEchos from
         /proc/net/snmp on both pods either side of one ping and names the
         responder.
      {% endif %}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

      {{ ns.step }}. Confirm the node learned fabric routes over BGP rather than being
         statically pointed at anything:
           oc debug node/{{ probe_node }} -- chroot /host ip route show proto bgp
      {% if udn_phase in ['vrflite', 'evpn'] %}
           oc debug node/{{ probe_node }} -- chroot /host ip route show vrf {{ udn_bgp_tenants[0].name }}
      {% endif %}
      {% set ns.step = ns.step + 1 %}

