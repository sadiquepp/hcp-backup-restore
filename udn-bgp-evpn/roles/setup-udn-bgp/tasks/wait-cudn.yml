---
# Wait for every tenant CUDN to be realised into a real NetworkAttachment-
# Definition in its namespace, and fail with the cluster's own conditions if
# one is not.
#
# This runs AFTER the namespaces are created, and the ordering is the whole
# point. A CUDN creates its NAD *in each namespace its namespaceSelector
# matches*, so before the namespaces exist it has nothing to do and reports
# NetworkCreated=True over an empty set. Gating on the condition alone, before
# the namespaces, therefore passes vacuously and proves nothing. Hence the
# second check: a NAD named after the tenant must actually exist in the
# tenant's namespace.
#
# What this catches, and what nothing else does: the namespace missing the
# k8s.ovn.org/primary-user-defined-network label. OVN-Kubernetes then refuses
# to create the NAD -
#
#   NetworkCreated=False  NetworkAttachmentDefinitionSyncError
#   invalid primary network state for namespace "udn-blue": a valid primary
#   user defined network or network attachment definition custom resource,
#   and required namespace label "k8s.ovn.org/primary-user-defined-network"
#   must both be present
#
# - and everything downstream carries on looking healthy. The pods schedule,
# the DaemonSet rolls out, and the tenant is quietly on the default cluster
# network. The only later symptom is the RouteAdvertisements sitting at
# "configuration pending: no networks selected", a message that points at the
# label selector rather than at this.
#
# The condition type differs across releases (NetworkCreated in current
# OVN-Kubernetes, NetworkAllocationSucceeded in some), so this matches on any
# condition going True rather than naming one.

- name: Confirm every tenant CUDN has been realised
  block:
    - name: Wait for the tenant CUDNs to report a successful network
      ansible.builtin.command:
        argv:
          - oc
          - get
          - clusteruserdefinednetwork
          - "{{ item.name }}"
          - -o
          - jsonpath={.status.conditions[?(@.status=="True")].type}
      loop: "{{ udn_bgp_tenants }}"
      loop_control:
        label: "{{ item.name }}"
      register: udn_bgp_cudn_ready
      until: udn_bgp_cudn_ready.stdout | default('') | length > 0
      retries: "{{ udn_bgp_cudn_ready_retries }}"
      delay: "{{ udn_bgp_cudn_ready_delay }}"
      changed_when: false

    # The condition can be True over an empty namespace set. This cannot.
    - name: Wait for each tenant's NetworkAttachmentDefinition to exist
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "udn-{{ item.name }}"
          - get
          - net-attach-def
          - "{{ item.name }}"
          - -o
          - jsonpath={.metadata.name}
      loop: "{{ udn_bgp_tenants }}"
      loop_control:
        label: "{{ item.name }}"
      register: udn_bgp_cudn_nad
      until: udn_bgp_cudn_nad.stdout | default('') == item.name
      retries: "{{ udn_bgp_cudn_ready_retries }}"
      delay: "{{ udn_bgp_cudn_ready_delay }}"
      changed_when: false
  rescue:
    - name: Collect the CUDN conditions and namespace labels
      ansible.builtin.shell:
        cmd: |
          set -u
          for t in {{ udn_bgp_tenants | map(attribute='name') | join(' ') }}; do
              echo "=== $t ==="
              oc get clusteruserdefinednetwork "$t" \
                  -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1
              echo "namespace labels: $(oc get namespace "udn-$t" \
                  -o jsonpath='{.metadata.labels}' 2>&1)"
              echo "nad: $(oc -n "udn-$t" get net-attach-def -o name 2>&1 | tr '\n' ' ')"
          done
      register: udn_bgp_cudn_debug
      changed_when: false
      failed_when: false

    - name: Report which CUDN never came up, then fail
      ansible.builtin.fail:
        msg: >-
          {{ ['One or more tenant CUDNs were never realised into a'
              ' NetworkAttachmentDefinition.',
              'Check the namespace labels below for'
              ' k8s.ovn.org/primary-user-defined-network - without it'
              ' OVN-Kubernetes refuses to create the NAD, and the namespace'
              ' and its pods run on the default cluster network instead,'
              ' healthy and on the wrong network.',
              ''] + udn_bgp_cudn_debug.stdout_lines | default([]) }}
