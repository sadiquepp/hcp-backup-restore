hub2_disconnected_install_folder: "{{ download_dir }}/hub2d_install"

## MetalLB IPAddressPools for the hosted clusters' APIServer VIPs
## (setup-hub-acm). One pool per hosted cluster, each holding exactly ONE
## address, plus one L2Advertisement per pool.
##
## This replaces the old shared hcp-ip-pool range (hub 60-63, hubd 64-67,
## hub2 90-93). A shared range let any hosted cluster's kube-apiserver
## Service take any free address in it, so a cluster could easily come up on
## an address its api/api-int records don't point at. A single-address pool
## bound to that cluster's control-plane namespace makes that impossible:
## the address a hosted cluster gets is the address DNS publishes for it on
## the hub it is running on, or it gets none at all.
##
## Keyed by HostedCluster name (which roles/create-hosted-cluster also uses
## as the HostedCluster's namespace, hence control_plane_namespace defaulting
## to '<name>-<name>'). Consumed by:
##   - roles/setup-hub-acm  - renders the IPAddressPool + L2Advertisement pair
##                            for the hub named by metallb_hub
##   - roles/create-hosted-cluster - annotates the HostedCluster with 'pool'
##   - roles/setup-dns      - api/api-int A records point at the address for
##                            the hub named by target_hub
##
## 'pool' is the same on every hub. A hosted cluster's identity does not
## change when its control plane is restored somewhere else, so neither does
## the pool it belongs to - which is what lets the metallb.io/address-pool
## annotation on the HostedCluster survive an OADP restore onto the DR hub
## unchanged.
##
## 'ip' IS per hub, because the DR hub sits on a different network segment
## and hub1's addresses are not routable there. Each key is a hub name (the
## value passed as metallb_hub / target_hub):
##   hub   - primary hub   (setup_hub_cluster.yaml)
##   hub2  - DR hub        (setup_hub_cluster2.yaml)
##   hubd  - disconnected hub (setup_hub_cluster.yaml -e disconnected_install=true)
## At DR cutover the hosted cluster comes back on the hub2 address and DNS is
## re-rendered to match - see the MetalLB section of the README.
##
## There is deliberately no 'hub2d' key. The disconnected DR hub
## (setup_hub_cluster2.yaml with disconnected_install) is a separate cluster
## from hub2, but it plays the same part in the topology, so it configures
## MetalLB as metallb_hub=hub2 and a cluster restored onto it comes up on the
## hub2 address DNS already publishes at cutover. Adding hub2d addresses here
## would mean a second set of DR addresses that nothing resolves to.
##
## A cluster only carries an address for the hubs it can actually run on.
## The connected three have 'hub' and 'hub2' (primary and DR) but deliberately
## no 'hubd': hubd is the disconnected hub and the connected clusters never run
## there. That matters beyond documentation - roles/setup-hub-acm renders one
## IPAddressPool per entry in this map for the hub it is configuring, so a
## stray 'hubd' address here would put pools on the disconnected hub for
## clusters that will never ask for them.
##
## Carrying the hub's address is necessary but not sufficient: the cluster must
## also be part of the run's install mode. roles/setup-hub-acm renders
## hosted_clusters_disconnected when disconnected_install is true and
## hosted_clusters when it is false - the same choice roles/create-hosted-cluster
## makes - and only their intersection with this map gets a pool. That is what
## keeps hub2 to three pools: it is the only hub holding addresses for both
## sets (DR target for both), so a connected hub2 run renders 90/91/92 and a
## disconnected_install=true hub2 run renders 93/94/95, never all six. The
## addresses for the other mode stay reserved here; re-run the 'acm' tag with
## the other value of disconnected_install to render them, which is the step
## before restoring a cluster of that mode onto hub2.
##
## Each value is a last octet, combined with the network prefix for that hub
## (hosted_cluster_metallb_network_prefixes below, defaulting to
## lab_network_prefix). It must stay clear of every ip_list octet on that hub's
## segment and of the .201-.249 libvirt DHCP range, since MetalLB L2 mode ARPs
## for these addresses itself and nothing else may own them.
hosted_cluster_metallb_pools:
  hcp-cluster1:
    pool: hcp-cluster1-api-pool
    ip:
      hub: 60
      hub2: 90
  hcp-cluster2:
    pool: hcp-cluster2-api-pool
    ip:
      hub: 61
      hub2: 91
  hcp-cluster3:
    pool: hcp-cluster3-api-pool
    ip:
      hub: 62
      hub2: 92

  ## Disconnected hosted clusters. Separate clusters from hcp-cluster1/2/3 -
  ## their own names, namespaces, pools and DNS zones - so a connected and a
  ## disconnected hosted cluster can be up on this lab at the same time.
  ##
  ## Deliberately NO 'hub' address: hub1 is the connected hub and a '-d'
  ## cluster has no business running there. roles/create-hosted-cluster fails
  ## with an explicit message if one is ever rendered for a hub it has no
  ## address on, which is what keeps the reservation real rather than just
  ## documented. 'hub2' is kept because the DR hub is a legitimate restore
  ## target - the bundle pins the canonical quay.io release digest, so a
  ## disconnected hosted cluster restores onto a connected hub unchanged.
  ## Add a 'hub' entry here if you ever do want one on hub1.
  ##
  ## These hub2 addresses are a reservation, not something an ordinary hub2
  ## build renders: setup_hub_cluster2.yaml without disconnected_install
  ## renders only the connected three (see the install-mode note above), so
  ## `oc get IPAddressPool -n metallb-system` on a connected hub2 shows three
  ## pools. Re-run its 'acm' tag with -e disconnected_install=true to create
  ## these three before restoring a '-d' cluster there.
  hcp-cluster1-d:
    pool: hcp-cluster1-d-api-pool
    ip:
      hub2: 93
      hubd: 67
  hcp-cluster2-d:
    pool: hcp-cluster2-d-api-pool
    ip:
      hub2: 94
      hubd: 68
  hcp-cluster3-d:
    pool: hcp-cluster3-d-api-pool
    ip:
      hub2: 95
      hubd: 69

## Network the pool addresses sit on, per hub. Anything not listed here uses
## lab_network_prefix, which is why this is empty by default - in this lab all
## three hubs share virbr0. Set an entry when a hub really is on its own
## segment, e.g. a DR hub in another VLAN:
##   hosted_cluster_metallb_network_prefixes:
##     hub2: "192.168.150"
## The matching api/api-int records follow automatically, since roles/setup-dns
## reads the same prefix for target_hub.
hosted_cluster_metallb_network_prefixes: {}


## Variable for Hosted Cluster1
hosted_cluster_cpu: 4
hosted_cluster_memory: 8512
hosted_cluster_vm_folder: "{{ download_dir }}/hosted_cluster"

## The worker VMs setup_hosted_cluster_vm.yaml creates for hcp-cluster1.
## 'name' is the libvirt domain name (and the qcow2 basename); 'ip_key' is
## the ip_list key that gives the VM its address, via the MAC scheme
## 52:54:00:e2:54:<last octet> the libvirt network reserves it under.
hosted_cluster_workers:
  - name: c1_worker1
    ip_key: c1worker1
  - name: c1_worker2
    ip_key: c1worker2
  - name: c1_worker3
    ip_key: c1worker3


## Variables for Hosted Cluster1
hosted_cluster2_cpu: 4
hosted_cluster2_memory: 8512
hosted_cluster2_vm_folder: "{{ download_dir }}/hosted_cluster2"

## ---------------------------------------------------------------------------
## Disconnected hosted cluster - the hosted cluster whose worker VMs have no
## route to the real internet, so it can only ever pull from the local mirror
## registry. Everything here is used only when disconnected_install is true
## (see the bottom of this file, or -e disconnected_install=true); a connected
## run never touches any of it.
##
## It deliberately mirrors hcp-cluster1 rather than replacing it:
##   - its own worker VMs      (hosted_cluster_disconnected_workers, .44-.46)
##   - its own ingress VIP     (ip_list.c1dlb, .48) and haproxy frontends
##   - its own DNS zone        (<name>.<base_domain>) so api/api-int and
##                              *.apps are distinct from hcp-cluster1's
##   - its own MetalLB pool    (hosted_cluster_metallb_pools['hcp-cluster1-d'])
## so both can be up on the lab at the same time.
##
## With disconnected_install true these clusters REPLACE hosted_clusters in
## roles/create-hosted-cluster, the same way disconnected_install wins over
## target_hub in setup_bminfra.yaml - a disconnected run renders the
## disconnected bundle onto hubd and nothing else. Every name here needs an
## entry in hosted_cluster_metallb_pools above, exactly like hosted_clusters.
##
## The list itself lives with hosted_clusters further down (see
## 'DISCONNECTED hosted clusters') - it is defined once, there. Only the VM
## sizing and worker definitions for the disconnected run live here.
## ---------------------------------------------------------------------------
hosted_cluster_disconnected_cpu: 4
hosted_cluster_disconnected_memory: 8512
hosted_cluster_disconnected_vm_folder: "{{ download_dir }}/hosted_cluster_disconnected"

## Same shape as hosted_cluster_workers above. The names are what keeps these
## VMs distinct from hcp-cluster1's c1_worker* domains on the same hypervisor,
## and the ip_keys are the addresses whose NAT is cut (see
## hosted_cluster_disconnected_block_node_nat).
hosted_cluster_disconnected_workers:
  - name: c1-d-worker1
    ip_key: c1dworker1
  - name: c1-d-worker2
    ip_key: c1dworker2
  - name: c1-d-worker3
    ip_key: c1dworker3

## Whether to cut those worker IPs off from the real internet before the VMs
## are created - an ACCEPT in our own LAB_NO_NAT chain (nat) so their traffic is
## never MASQUERADEd, plus a REJECT in our own LAB_NO_EGRESS chain (filter) so it
## does not leave the hypervisor un-NATed either. Both chains are hooked into
## POSTROUTING/FORWARD ahead of libvirt's, so they survive a
## `virsh net-destroy`/`net-start` of the default network. Identical treatment to
## the disconnected hub's nodes; see
## roles/setup-hub-cluster-disconnected/tasks/block-node-nat.yml. Set false to
## build the cluster from the mirror while leaving the workers able to reach the
## internet - useful when checking whether a failure is really caused by the
## disconnection.
hosted_cluster_disconnected_block_node_nat: true

## Variables required by the OADP backup/restore flow
## (roles/setup-oadp, oadp/templates/*, setup_oadp.yaml,
##  backup_hosted_cluster.yaml, restore_hosted_cluster.yaml)
##
## AWS access key id/secret go in vault.yaml as
## oadp_aws_access_key_id / oadp_aws_secret_access_key - never here.
## (oadp_aws_region / oadp_bucket_name are set in the START HERE block.)
oadp_backup_prefix: hcp-backup
oadp_backup_ttl: 999h0m0s
oadp_bminfra_namespace: bminfra
oadp_storage_location: default

## How the control-plane PVs (the hosted cluster's etcd volumes) are
## backed up. Both methods use the same S3 bucket and the same
## DataProtectionApplication - only the Backup/Restore CRs differ, and
## each method has its own pair of templates in oadp/templates/ so
## either can be demonstrated without editing the other.
##
##   fs  - Kopia file-system backup (defaultVolumesToFsBackup: true).
##         Velero's node-agent reads the volume through a pod and
##         streams the files to S3. Works on ANY StorageClass, CSI or
##         not - this is what LVM Storage (lvms-vg1) needs, and it is
##         what this lab did before Ceph existed. Default. It completes
##         against a hosted control plane, but a file-by-file copy of a
##         live etcd volume is not a point-in-time image of it, so do not
##         rely on it for a control-plane restore - use csi for that.
##
##   csi - CSI VolumeSnapshot + Velero's built-in data mover
##         (snapshotVolumes: true, snapshotMoveData: true,
##         datamover: velero). The CSI driver takes a point-in-time
##         snapshot of the volume, the data mover copies that snapshot
##         to S3, and the snapshot is then released. Needs a CSI driver
##         with snapshot support and a VolumeSnapshotClass - i.e. the
##         Ceph/ODF external StorageClass from setup_ceph_odf.yaml.
##         LVM Storage cannot do this (no VolumeSnapshotClass), which is
##         the reason the Ceph cluster exists in this lab.
##
## Override per run: -e oadp_backup_method=csi
## (oadp_backup_method itself is set in the START HERE block at the top.)

## The VolumeSnapshotClass Velero uses when oadp_backup_method=csi.
## setup-oadp labels it velero.io/csi-volumesnapshot-class="true" -
## Velero picks the VolumeSnapshotClass for a PVC's CSI driver by that
## label and fails the volume if no class carries it. This is the name
## ODF creates for the external RBD pool (setup_ceph_odf.yaml); it is
## derived from ceph_odf_storagecluster_name.
oadp_csi_snapshot_class: "{{ ceph_odf_storagecluster_name }}-rbdplugin-snapclass"

## The CSI driver that snapshot class belongs to. Only used to warn
## when more than one VolumeSnapshotClass for the same driver carries
## Velero's label, which makes Velero refuse to choose.
oadp_csi_driver: openshift-storage.rbd.csi.ceph.com

## Which hub is currently authoritative. It selects the kubeconfig
## setup_oadp.yaml / backup_hosted_cluster.yaml / restore_hosted_cluster.yaml
## use, and the hub whose hosted_cluster_metallb_pools addresses roles/setup-dns
## publishes as api/api-int. Override per-run with -e target_hub=hub2 once
## you've cut over (see oadp/README.md), and re-run the dns tag of
## setup_bm_host.yaml with the same override so DNS follows the hosted
## clusters to the DR hub.
## (target_hub itself is set in the START HERE block at the top.)

## ---------------------------------------------------------------------------
## Role-default overrides (wired via vars_files in playbooks)
##
## These override roles/setup-hub-acm/defaults and roles/setup-bminfra/defaults.
## Per-playbook role vars still win over vars.yaml when both set the same name.
## ---------------------------------------------------------------------------

## setup-hub-acm: AgentServiceConfig storage. The RHCOS live-ISO catalogue that
## goes with it, agent_service_os_images, is set in the START HERE block at the
## top - one of its openshiftVersion entries must match bminfra_ocp_version
## (which follows ocp_major_version).
agent_service_database_storage: 10Gi
agent_service_filesystem_storage: 100Gi
agent_service_image_storage: 50Gi

## setup-hub-acm, disconnected. With disconnected_install true (below, or
## -e disconnected_install=true) the role renders a different
## AgentServiceConfig: spec.mirrorRegistryRef pointing at a ConfigMap holding
## the mirror registry's CA and registries.conf, and osImage urls pointing at
## the helper's web server instead of mirror.openshift.com. It also publishes
## the registry CA to image.config.openshift.io/cluster and creates a
## ClusterImageSet per osImage version against the mirror registry.
##
## The defaults derive everything from the mirror_registry_* values further
## down, so normally nothing here needs setting. Uncomment to override:
##
## The CatalogSource the operator Subscriptions resolve against. Derived from
## mirror_catalog_index below - set this only if oc-mirror named it something
## other than cs-<index-repo>-<tag>.
# acm_catalog_source: cs-redhat-operator-index-v4-21
#
## The registries.conf written into the mirror-config ConfigMap. Should match
## the hub's own ImageDigestMirrorSet/ImageTagMirrorSet - the role warns about
## any source it redirects that is missing here.
# acm_disconnected_registry_mirrors:
#   - source: quay.io/openshift-release-dev/ocp-release
#     mirrors:
#       - "{{ mirror_registry_domain }}:{{ mirror_registry_port }}/{{ mirror_release_repository }}"
#     digest_only: false
#
## Skip the ISO download/push entirely and use urls you staged yourself.
## Same shape as agent_service_os_images.
# agent_service_os_images_disconnected:
#   - openshiftVersion: "4.21"
#     version: "4.21.0"
#     url: "http://192.168.122.21:8080/bootp/rhcos-4.21.0-x86_64-live-iso.x86_64.iso"
#     cpuArchitecture: "x86_64"
#
## Which releases get a ClusterImageSet. Defaults to the agent_service_os_images
## versions; each one has to actually be in the mirror registry.
# acm_disconnected_cluster_image_set_versions:
#   - "4.21.15"
#
## Copy the ISOs even when the helper looks too small for them (warn instead of
## fail). See helper_disk_size above for the better fix.
# acm_disconnected_require_helper_space: false

## setup-bminfra: bare-metal infra namespace and InfraEnv OCP version.
## Follows ocp_major_version so the InfraEnv discovers hosts at the same
## release the rest of the lab is built from - there is one number to bump.
## It lands in InfraEnv.spec.osImageVersion, so agent_service_os_images above
## must carry an entry whose openshiftVersion matches it (assisted-service
## rejects a version it has no osImage for). Override here if you ever need
## the InfraEnv on a different version than the hub.
bminfra_ocp_version: "{{ ocp_major_version }}"
discovery_iso_filename: "bminfra-discovery-{{ bminfra_ocp_version }}.iso"
discovery_boot_kernel_filename: "bminfra-discovery-{{ bminfra_ocp_version }}-vmlinuz"
discovery_boot_initrd_filename: "bminfra-discovery-{{ bminfra_ocp_version }}-initrd.img"
discovery_boot_rootfs_filename: "bminfra-discovery-{{ bminfra_ocp_version }}-rootfs.img"

## ---------------------------------------------------------------------------
## Discovery host ignition (disconnected only)
##
## setup_hosted_cluster_vm.yaml and setup_bminfra.yaml include
## roles/setup-bminfra/tasks/*.yml by path rather than running the role, so the
## role's defaults are not loaded for them - these have to live here.
##
## What they fix: RHCOS ships /etc/containers/policy.json requiring a Red Hat
## GPG signature for registry.redhat.io and registry.access.redhat.com. The
## mirror mappings redirect the *pull* to the mirror registry, but podman still
## looks for the signature under the original registry.redhat.io name, in a
## sigstore a disconnected node cannot reach and mirror-registry does not serve.
## So the discovery host fails with
##
##   Error: copying system image from manifest list: Source image rejected:
##   A signature was required, but no signature exists
##
## agent.service never starts, the host never registers, and no Agent ever
## appears in the InfraEnv. The InfraEnv's ignitionConfigOverride replaces that
## policy.json on the discovery host, which is the same edit that works by hand
## after sshing into the node.
##
## See roles/setup-bminfra/tasks/disconnected-ignition-override.yml for the full
## reasoning, including why shipping the GPG key instead would not help.
## ---------------------------------------------------------------------------

## Set false to keep RHCOS's signature checking - only useful if you have
## mirrored Red Hat's sigstore, in which case put your own
## /etc/containers/registries.d/ drop-in in bminfra_ignition_extra_files.
bminfra_disconnected_relax_image_policy: true

## Ignition spec version of the override. assisted-service merges it into the
## discovery ignition, so any 3.x it can parse works.
bminfra_ignition_version: "3.2.0"

## The policy.json written to the discovery host. Same as RHCOS's own except
## that the two Red Hat registries fall back to insecureAcceptAnything. Narrow
## it if you only want one of them relaxed.
bminfra_discovery_image_policy:
  default:
    - type: insecureAcceptAnything
  transports:
    docker:
      registry.access.redhat.com:
        - type: insecureAcceptAnything
      registry.redhat.io:
        - type: insecureAcceptAnything
    docker-daemon:
      "":
        - type: insecureAcceptAnything

## Extra ignition storage.files entries appended to the override, in ignition's
## own schema ({path, mode, overwrite, contents: {source: "data:..."}}).
bminfra_ignition_extra_files: []

## create-hosted-cluster: HostedCluster/NodePool/ManagedCluster bundle.
## One entry per hosted cluster, all rendered from the same generic
## template - add a cluster here, not a new template. An entry is either a
## bare name, or a dict with 'name' plus any hosted_cluster_* key (minus
## the prefix) to override the defaults below for that cluster only.
## Concurrent clusters on the same hub can share cluster_cidr and
## service_cidr - each hosted cluster is its own OVN-Kubernetes cluster and
## those CIDRs never leave its data plane (the control plane on the hub
## reaches it over the Konnectivity tunnel). Override them per-cluster only
## if you have a reason to, e.g. direct pod-to-pod connectivity between two
## hosted clusters (Submariner without globalnet).
## Every name listed here needs a matching entry in
## hosted_cluster_metallb_pools above - that is what gives the cluster its
## own single-address MetalLB pool and the metallb.io/address-pool annotation
## on its HostedCluster.
## CONNECTED hosted clusters. These names are reserved for connected runs -
## a disconnected run never renders them. The list itself is in the START HERE
## block at the top, with hosted_clusters_disconnected beside it.

## DISCONNECTED hosted clusters, rendered instead of the list above when
## disconnected_install is true. Same shape (a bare name, or a dict with 'name'
## plus per-cluster overrides), and the same hosted_cluster_* defaults apply.
##
## These are their own clusters, not hcp-cluster1/2/3 rendered differently:
## their own namespace, MetalLB pool (hubd 67-69 above), DNS zone and worker
## VMs. The role refuses to run if a name appears in both lists, since it would
## collide on all three. The '-d' suffix is just the convention - what matters
## is that the sets are disjoint and each name here has a pool entry with a
## 'hubd' address and a matching DNS zone whose leading label is the name.
##
## NOTE: roles/setup-dns needs a forward zone per name here (the way
## hosted_domain/2/3 exist for the connected three), rendered with
## -e target_hub=hubd so api/api-int carry the hubd address. Without it the
## HostedCluster publishes a name nothing resolves.
## The list itself is in the START HERE block at the top.

## Defaults for every entry above that doesn't override them; they match
## hcp-cluster1. release image should correspond to an entry in
## agent_service_os_images.
hosted_cluster_clusterset: default
hosted_cluster_channel: "stable-{{ ocp_major_version }}"

## Release payload for the hosted clusters, addressed by VERSION rather than by
## a hard-coded digest - one number to bump instead of a sha256 nobody can read.
## Defaults to the same version the rest of the lab is built from
## (ocp_major_version.ocp_minor_version), which is also what oc-mirror mirrored
## (mirror_ocp_version), so the connected and disconnected payloads are the same
## release by construction.
##
## Override hosted_cluster_release_version alone to run the hosted clusters on a
## different release from the hubs - it must be a version that actually exists
## in the mirror registry for a disconnected run.
hosted_cluster_release_version: "{{ ocp_major_version }}.{{ ocp_minor_version }}"
hosted_cluster_release_arch: x86_64
hosted_cluster_release_image: "quay.io/openshift-release-dev/ocp-release:{{ hosted_cluster_release_version }}-{{ hosted_cluster_release_arch }}"
hosted_cluster_cluster_cidr: 10.132.0.0/14
hosted_cluster_service_cidr: 172.31.0.0/16
hosted_cluster_availability_policy: HighlyAvailable
hosted_cluster_olm_catalog_placement: management
hosted_cluster_nodepool_replicas: 2
hosted_cluster_addon_application_manager: true
hosted_cluster_addon_policy_controller: true
hosted_cluster_addon_search_collector: true
hosted_cluster_addon_cert_policy_controller: true

## create-hosted-cluster, disconnected. With disconnected_install true (below,
## or -e disconnected_install=true) the role renders each bundle with three
## extra things, none of which appear in a connected run:
##
##   - a '<cluster>-user-ca-bundle' ConfigMap in the hosted cluster's namespace
##     carrying the mirror registry CA under 'ca-bundle.crt', referenced from
##     the HostedCluster's spec.configuration.proxy.trustedCA (the hosted
##     cluster's proxy trust bundle) and spec.additionalTrustBundle (which
##     HyperShift carries into the nodes' own trust store);
##   - spec.imageContentSources redirecting the release payload and
##     registry.redhat.io/multicluster-engine to the mirror registry - the
##     hosted cluster is its own cluster and does not inherit the hub's
##     ImageDigestMirrorSet/ImageTagMirrorSet;
##   - a pull secret reduced to the mirror registry's own credentials, so the
##     nodes have no working route back to quay.io/registry.redhat.io.
##
## The defaults derive everything from the mirror_registry_* values further
## down, so normally nothing here needs setting. Uncomment to override:
##
## Per-cluster overrides work the same as for connected clusters - a bare name,
## or a dict with 'name' plus any hosted_cluster_* key minus the prefix:
# hosted_clusters_disconnected:
#   - hcp-cluster1-d
#   - name: hcp-cluster3-d
#     nodepool_replicas: 3
#
## The mirror map written to HostedCluster.spec.imageContentSources. Should
## agree with acm_disconnected_registry_mirrors above and with the hub's own
## IDMS/ITMS. registry.redhat.io/multicluster-engine has to stay in it - see
## hosted_cluster_required_image_content_sources in the role defaults.
# hosted_cluster_image_content_sources:
#   - source: quay.io/openshift-release-dev/ocp-release
#     mirrors:
#       - "{{ mirror_registry_domain }}:{{ mirror_registry_port }}/{{ mirror_release_repository }}"
#   - source: registry.redhat.io/multicluster-engine
#     mirrors:
#       - "{{ mirror_registry_domain }}:{{ mirror_registry_port }}/multicluster-engine"
#
## The disconnected release image now points at the mirror registry directly
## (see the role defaults). To send it back to the canonical quay.io pullspec
## and rely on redirection instead:
# hosted_cluster_release_image_disconnected: "{{ hosted_cluster_release_image }}"
#
## Render vault's full pull_secret rather than reducing it to the mirror
## registry - useful when checking whether a failure is really the
## disconnection.
# hosted_cluster_disconnected_pull_secret: false
#
## Leave the hosted cluster's default OperatorHub catalogs enabled.
# hosted_cluster_disable_default_catalog_sources: false
#
## APIServer LoadBalancer hostname. Must resolve to this cluster's MetalLB
## address on the hub it is running on - for a disconnected cluster that is the
## zone roles/setup-dns renders with -e target_hub=hubd. The default,
## api.<cluster-name>.<base_domain>, is already right when the cluster is named
## after its own DNS zone (the hcp-cluster1-d pattern). Set this only when it
## is not - e.g. rendering plain 'hcp-cluster1' disconnected, whose zone points
## at hub1:
# hosted_clusters:
#   - name: hcp-cluster1
#     api_hostname: "api.hcp-cluster1-d.{{ base_domain }}"

## ip_list keys for each hosted cluster's worker VMs and its *.apps VIP on the
## helper's haproxy. Keyed by HostedCluster name, so it lines up with
## hosted_cluster_metallb_pools and with the cluster's DNS zone (whose leading
## label is the cluster name).
##
## Consumed by:
##   - roles/setup-dns    - worker A records, the *.apps wildcard and the PTRs
##   - roles/setup-bm-host - the libvirt network's DHCP host FQDNs
##
## Only keys that actually exist in ip_list are rendered. That is what lets the
## '-d' clusters have valid zones (api/api-int, which is what the HostedCluster
## publishes) before their worker VMs exist - add the octets to ip_list and the
## worker and *.apps records appear on the next run, with no template change.
hosted_cluster_node_keys:
  hcp-cluster1:
    workers: [c1worker1, c1worker2, c1worker3]
    apps_lb: c1lb
  hcp-cluster2:
    workers: [c2worker1, c2worker2, c2worker3]
    apps_lb: c2lb
  hcp-cluster3:
    workers: [c3worker1, c3worker2, c3worker3]
    apps_lb: c3lb
  hcp-cluster1-d:
    workers: [c1dworker1, c1dworker2, c1dworker3]
    apps_lb: c1dlb
  hcp-cluster2-d:
    workers: [c2dworker1, c2dworker2, c2dworker3]
    apps_lb: c2dlb
  hcp-cluster3-d:
    workers: [c3dworker1, c3dworker2, c3dworker3]
    apps_lb: c3dlb

## LEGACY: hosted_domain / hosted_domain2 / hosted_domain3 above are the same
## information as hosted_clusters, written twice. Nothing renders from them any
## more - every hosted cluster zone is now derived as <cluster-name>.<base_domain>
## from hosted_clusters + hosted_clusters_disconnected, which is why the '-d'
## clusters get zones without three more copies of the zone template. They are
## kept only for older playbooks that still reference them.

## setup-mirror-registry-vm / setup-mirror-registry: the standalone VM
## used to simulate a disconnected install (see setup_mirror_registry.yaml).
## disconnected_install gates whether any of this is used at all - default
## false so connected installs are completely unaffected. It is set in the
## START HERE block at the top.
mirror_registry_name: registry
mirror_registry_disk: registry_disk.qcow2
mirror_registry_extra_disk: registry_extra_disk.qcow2
## Partition inside rhel9_kvm_image to expand into all the new space -
## verify against your actual base image with:
##   virt-filesystems --long --parts --blkdevs -h -a <image>
## if you ever change rhel9_kvm_image, since this is image-specific.
mirror_registry_resize_partition: /dev/sda4
mirror_registry_memory: 16384
mirror_registry_vcpus: 8
mirror_registry_domain: "registry.{{ hub_domain }}"
mirror_registry_port: 8443
## mirror_registry_password goes in vault.yaml, not here.
## Dedicated authfile for baremetal's own podman login to the mirror
## registry (see roles/setup-mirror-registry-trust) - kept separate from
## ~/.docker/config.json so this never touches your other registry creds.
mirror_registry_authfile: /root/.docker/config.json
mirror_registry_quay_root: /registry

## OCP release/operators to mirror. Extend catalog_operator_packages with
## any additional operators your disconnected install needs beyond what
## setup-hub-acm already installs (ACM, LVM Storage, MetalLB, OADP).
mirror_ocp_channel: stable-{{ ocp_major_version }}
mirror_ocp_version: "{{ ocp_major_version }}.{{ ocp_minor_version }}"
mirror_catalog_index: "registry.redhat.io/redhat/redhat-operator-index:v{{ ocp_major_version }}"
## (mirror_catalog_operator_packages - what gets mirrored beyond the release
## payload - is set in the START HERE block at the top.)
## Repository oc-mirror v2 publishes the release payload under, inside the
## mirror registry. roles/setup-hub-cluster-disconnected extracts
## openshift-install from "<registry>:<port>/<this>:<mirror_ocp_version>-x86_64",
## and it's the same repo the generated ImageDigestMirrorSet maps
## quay.io/openshift-release-dev/ocp-release onto - if you change oc-mirror's
## destination layout, change this to match or the extract will 404.
mirror_release_repository: openshift/release-images

## setup-minio-vm / setup-minio: local S3-compatible OADP backup target
## for disconnected-install simulation (see setup_minio.yaml). Also
## gated behind disconnected_install (shared with mirror-registry above).
## minio_root_user / minio_root_password go in vault.yaml, not here.
minio_name: minio
minio_disk: minio_disk.qcow2
minio_disk_size: 100G
## Partition inside rhel9_kvm_image to expand into all the new space -
## same base image/assumption as mirror_registry_resize_partition.
minio_resize_partition: /dev/sda3
minio_memory: 4096
minio_vcpus: 4
minio_domain: "minio.{{ hub_domain }}"
minio_api_port: 9000
minio_console_port: 9001
minio_data_dir: /data/minio
## Bucket OADP will target when running against MinIO instead of real
## AWS S3 - kept distinct from oadp_bucket_name so switching between
## connected/disconnected DPA config is an explicit, visible choice.
## (minio_bucket_name itself is set in the START HERE block at the top.)

