# Lab-wide Ansible variables. Loaded by most playbooks via vars_files.
#
# Secrets (pull_secret, activation_key, org_id, oadp_aws_*) belong in
# vault.yaml, not here. Values below override role defaults when the
# same name is used.
#
# Optional role-default overrides are documented at the bottom of this file
# as commented examples - uncomment and adjust as needed.

## ===========================================================================
## START HERE - the settings most labs change
##
## Everything in this section is something you are likely to set before the
## first run. Everything below it is either derived from these or is lab
## plumbing (IP assignments, per-role defaults) you can usually leave alone.
## Where a setting has a longer explanation further down, it says so.
## ===========================================================================

## --- Lab network and DNS ---------------------------------------------------

# Lab L2 network (libvirt default / virbr0). The ip_list values further down are
# last octets only, combined with this prefix.
lab_network_prefix: "192.168.122"
lab_network_netmask: "255.255.255.0"
# Reverse zone for lab_network_prefix - change it in lockstep with the prefix
# (192.168.122 -> 122.168.192.in-addr.arpa).
lab_network_reverse_zone: "122.168.192.in-addr.arpa"

## The lab's DNS suffix - the one place it is written. hub_domain, hub2_domain,
## hub_disconnected_domain, hub2_disconnected_domain and the hosted-cluster
## zones all derive from it, and roles/setup-dns builds each hosted cluster's
## zone as <cluster-name>.<base_domain>.
base_domain: mylab.com

## --- Host paths and base image ---------------------------------------------

## Where the RHCOS images, the oc/openshift-install tarballs and the discovery
## ISOs are staged, and the parent of every VM/install directory further down.
##
## No trailing slash - every consumer writes "{{ download_dir }}/<name>", so
## adding one back here just produces doubled slashes in paths and log output.
download_dir: /var/lib/libvirt/images

## RHEL 9 KVM guest image for the helper, mirror registry, MinIO and Ceph VMs -
## put it in download_dir before the first run. If you change it, check the
## *_resize_partition values further down: they are image-specific.
rhel9_kvm_image: "rhel-9.8-x86_64-kvm.qcow2"

## --- OpenShift version -----------------------------------------------------

## The one place the lab's OCP version is set: bminfra_ocp_version and
## mirror_ocp_version both follow it.
##
## QUOTED deliberately. Unquoted, YAML parses 4.21 as a float - harmless for
## .21, but 4.20 becomes 4.2, so every version string built from it
## ("{{ ocp_major_version }}.{{ ocp_minor_version }}") would silently render
## 4.2.33 instead of 4.20.33. Everything downstream (release pullspecs, the
## RHCOS download urls, the operator index tag, the openshift-install path)
## interpolates this into a string, so keep the quotes.
##
## 4.22 rather than 4.21 because BGP EVPN for primary cluster user-defined
## networks is GA in 4.22 - on 4.21 the VTEP CRD and the CUDN
## network.transport/network.evpn fields do not exist at all. Everything else
## in this lab works on either; see the UDN/BGP section of the README. To go
## back to 4.21, set these three to "4.21" / 15 / 0 and drop the evpn phase.
ocp_major_version: "4.22"
ocp_minor_version: 8
coreos_minor_version: 8  # Check https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/ for available rhcos versions for a specific ocp version.

## --- VM sizing -------------------------------------------------------------

## Shared by every hub - hub1, hub2, hubd and hub2d are all built to these
## sizes. worker_memory / worker_cpu are the ones that matter most: the hosted
## clusters' control planes run on the hub's workers.
helper_memory: 8192
helper_vcpus: 4
## Sparse, so it costs nothing until used. See the fuller note further down for
## what fills it and how to grow an existing helper.
helper_disk_size: 100G
master_memory: 16384
master_cpu: 8
worker_memory: 49152
worker_cpu: 32
hub_worker_replicas: 3

## --- Install mode and hub storage ------------------------------------------

## Connected (false) or disconnected (true) - the switch for the whole lab, and
## the source of truth for it. Set it once here before you start rather than
## per-command; see "Choose Connected or Disconnected" in README.md.
disconnected_install: false

## LVM Storage (true) or Ceph 9 via ODF external mode (false) for the hub's PVs.
## Has to be decided before the hub is built. Pick Ceph for the backup/restore
## demo: LVM Storage ships no VolumeSnapshotClass, so oadp_backup_method=csi -
## the only trustworthy control-plane restore - is not available on it.
use_lvm_storage: true

## --- Hosted clusters -------------------------------------------------------

## Which hosted clusters get rendered: the connected list when
## disconnected_install is false, the '-d' list when it is true. An entry is a
## bare name or a dict with 'name' plus per-cluster overrides. Every name needs
## a matching entry in hosted_cluster_metallb_pools further down. Fuller notes
## are with that map and with the hosted_cluster_* defaults.
hosted_clusters:
  - hcp-cluster1
  - hcp-cluster2
  - hcp-cluster3
hosted_clusters_disconnected:
  - hcp-cluster1-d
  - hcp-cluster2-d
  - hcp-cluster3-d

## Which hub is currently authoritative - 'hub' normally, 'hub2' after a DR
## cutover. Selects the kubeconfig the OADP playbooks use and the address
## roles/setup-dns publishes as api/api-int. Usually passed per-run instead
## (-e target_hub=hub2); fuller note further down.
target_hub: hub

## --- Backup target (OADP) --------------------------------------------------

## AWS access key id/secret go in vault.yaml as oadp_aws_access_key_id /
## oadp_aws_secret_access_key - never here.
oadp_aws_region: ap-south-1
oadp_bucket_name: adp-backup-bucket-xjt   # S3 bucket names are globally unique - change this before first use

## How the control-plane (etcd) volumes are captured. fs = Kopia file copy,
## works on any StorageClass. csi = CSI snapshot + Velero's data mover, needs
## Ceph/ODF and is the only one to rely on for a control-plane restore. Full
## comparison further down; override per run with -e oadp_backup_method=csi.
oadp_backup_method: fs

## --- RHCOS live ISOs offered to hosted clusters ----------------------------

## The AgentServiceConfig's osImages catalogue - the versions ACM/MCE will
## offer when installing a hosted cluster. One entry's openshiftVersion must
## match bminfra_ocp_version, which follows ocp_major_version above.
agent_service_os_images:
  - openshiftVersion: "4.21"
    version: "4.21.0"
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.21/4.21.0/rhcos-4.21.0-x86_64-live-iso.x86_64.iso"
    cpuArchitecture: "x86_64"
  - openshiftVersion: "4.22"
    version: "4.22.8"
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.22/4.22.8/rhcos-4.22.8-x86_64-live-iso.x86_64.iso"
    cpuArchitecture: "x86_64"
  - openshiftVersion: "4.20"
    version: "4.20.13"
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.20/4.20.13/rhcos-4.20.13-x86_64-live-iso.x86_64.iso"
    cpuArchitecture: "x86_64"

## --- Bare-metal inventory --------------------------------------------------

## Free-text label stamped on the InfraEnv and on every Agent that registers
## into it (the location annotation ACM shows in Host Inventory). Cosmetic, but
## it is what identifies this lab's hosts in the UI.
bminfra_location: singapore

## --- Disconnected labs only (ignored when disconnected_install is false) ----

## Size of the mirror registry VM's disk. Sparse, but oc-mirror pulls the whole
## release payload plus every catalog below into it, so this is the number to
## raise if the mirror runs out of room. See the mirror registry block further
## down for the rest of its settings.
mirror_registry_disk_size: 500G

## What oc-mirror mirrors beyond the release payload. These already cover the
## operators setup-hub-acm installs; add anything else your lab needs BEFORE
## the mirror runs, since re-running it after the fact means another pass over
## the catalogs.
mirror_catalog_operator_packages:
  - advanced-cluster-management
  - multicluster-engine
  - lvms-operator
  - metallb-operator
  - redhat-oadp-operator
  - cincinnati-operator

## Bucket OADP targets when backing up against the local MinIO instead of real
## AWS S3 - deliberately distinct from oadp_bucket_name, so switching between
## the two is a visible choice. Fuller note with the MinIO block further down.
minio_bucket_name: adp-backup-disconnected

## --- Ceph path only (ignored when use_lvm_storage is true) -----------------

## Sizing for the 3 all-in-one Ceph nodes. The OSD disks are raw and per node,
## so the raw capacity is disks_per_node x disk_size x 3. The rest of the Ceph
## settings - node names, pools, the container image, the admin node - are in
## the Ceph block further down.
ceph_osd_disks_per_node: 3
ceph_osd_disk_size: 100G
ceph_storage_memory: 24576
ceph_storage_vcpus: 16

## ===========================================================================
## END of the commonly-changed settings. Everything below is lab plumbing: IP
## assignments, per-role defaults and values derived from the section above.
## ===========================================================================

# List of IP Addresses to be used on the KVM Lab.
# Last octets below are combined with lab_network_prefix (e.g. .21 -> 192.168.122.21). Must be two digits (10-99) as last octet is used
# to define mac addresses
ip_list:
  helper_server: 21 
  bootstrap: 30
  master1: 31
  master2: 32
  master3: 33
  worker1: 34
  worker2: 35
  worker3: 36
  hublb: 39
  c1worker1: 41
  c1worker2: 42
  c1worker3: 43
  c1lb: 49
  c2worker1: 51
  c2worker2: 52
  c2worker3: 53
  c2lb: 59
  c3worker1: 54
  c3worker2: 55
  c3worker3: 56
  c3lb: 58
  c2vbmc: 71

  # Disconnected hosted clusters (hosted_clusters_disconnected) - worker VMs
  # and the *.apps ingress VIP each one gets on the helper's haproxy. Separate
  # addresses from the connected c1/c2/c3 sets, so both kinds run at once.
  # These are also the only addresses whose NAT is cut when
  # hosted_cluster_disconnected_block_node_nat is true.
  #
  # c1dworker*/c1dlb match the octets the disconnected-cluster-vms work already
  # uses, so the two do not fight over addresses. The rest are picked from what
  # is free, deliberately avoiding 60-69 and 90-99 where the hosted clusters'
  # MetalLB pool addresses live (hosted_cluster_metallb_pools) - .63 in
  # particular is left alone because it is already spoken for elsewhere.
  # Remaining free octets after these: 47, 50, 57, 64-66, 70, 87, 88.
  # (40 is now taken by the containerlab VM, added below.)
  c1dworker1: 44
  c1dworker2: 45
  c1dworker3: 46
  c1dlb: 48
  c2dworker1: 28
  c2dworker2: 29
  c2dworker3: 37
  c2dlb: 38
  c3dworker1: 96
  c3dworker2: 97
  c3dworker3: 98
  c3dlb: 99

  # Hub2 - replacement management/hub cluster used for the OADP
  # backup/restore-to-new-hub DR flow. Kept on its own IP block so it
  # can be built (and its DNS resolved) while hub1 still exists.
  # NOTE: last octet is used raw in the MAC scheme 52:54:00:e2:54:{{ value }},
  # so it must stay a two digit hex-safe value (10-99) - do not use 100+.
  hub2_bootstrap: 80
  hub2_master1: 81
  hub2_master2: 82
  hub2_master3: 83
  hub2_worker1: 84
  hub2_worker2: 85
  hub2_worker3: 86
  hub2lb: 89

  # Hub-disconnected - a third, fully independent hub cluster installed
  # entirely from the local mirror registry (setup_hub_cluster.yaml with
  # disconnected_install set). Deliberately given its own IP block, its own
  # subdomain (hub_disconnected_domain) and its own
  # install/VM directories so it can be built and run *alongside* hub1
  # and hub2 rather than replacing either.
  # NOTE: same MAC scheme constraint as above - two digit values (10-99).
  hubd_bootstrap: 72
  hubd_master1: 73
  hubd_master2: 74
  hubd_master3: 75
  hubd_worker1: 76
  hubd_worker2: 77
  hubd_worker3: 78
  hubdlb: 79

  # Hub2-disconnected - the DR hub built from the local mirror registry
  # (setup_hub_cluster2.yaml with disconnected_install set). Same relationship
  # to hub2 that hubd has to hub1: its own IP block, its own subdomain
  # (hub2_disconnected_domain) and its own install/VM directories, so it is a
  # separate cluster rather than a differently-built hub2, and all four hubs
  # can be up at once.
  #
  # .10-.19 rather than another slice of the 70s/80s: those are contiguous and
  # free, and they sit below both DHCP pools (dhcpd .100-.200 on the helper,
  # libvirt .201-.249), so nothing dynamic can ever be handed one of them.
  # NOTE: same MAC scheme constraint as above - two digit values (10-99).
  hub2d_bootstrap: 10
  hub2d_master1: 11
  hub2d_master2: 12
  hub2d_master3: 13
  hub2d_worker1: 14
  hub2d_worker2: 15
  hub2d_worker3: 16
  hub2dlb: 19

  # Mirror registry - shared connected infrastructure for disconnected-install
  # simulation (see setup_mirror_registry.yaml). Stays reachable/connected
  # even when master/worker IPs are cut off from the real internet.
  registry: 22

  # MinIO - local S3-compatible target for OADP backups during
  # disconnected-install simulation (see setup_minio.yaml). Same
  # connected-infrastructure treatment as mirror_registry.
  minio: 23

  # Ceph - 3-node all-in-one + 1-node admin Ceph 9 cluster (see setup_ceph.yaml).
  ceph1: 24
  ceph2: 25
  ceph3: 26
  cephadmin: 27

  # Containerlab host VM - the provider BGP/EVPN fabric for the UDN+BGP lab
  # (see setup_udn_bgp_lab.yaml). This is its address on virbr0, used only
  # for ssh/management; the fabric itself lives on virbr1 and this VM's
  # second NIC gets clab_fabric_prefix.40 there, same last octet.
  clab: 40

helper_name: helper
helper_disk: helper_disk.qcow2
## The helper's disk is expanded from the 10G rhel9_kvm_image to this size when
## it is first created (sparse qcow2 - it costs nothing until used). It has to
## hold the PXE rootfs and, on a disconnected hub, the RHCOS live ISOs
## roles/setup-hub-acm stages in /var/www/html/bootp for the AgentServiceConfig.
## An existing helper is not resized - delete its disk and re-run
## setup_bm_host.yaml to rebuild it at this size.
## (helper_disk_size itself is set in the START HERE block at the top.)
## Partition inside rhel9_kvm_image to expand into all the new space - verify
## against your actual base image with:
##   virt-filesystems --long --parts --blkdevs -h -a <image>
## if you ever change rhel9_kvm_image, since this is image-specific.
helper_resize_partition: /dev/sda4
