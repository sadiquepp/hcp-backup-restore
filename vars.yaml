# Lab-wide Ansible variables. Loaded by most playbooks via vars_files.
#
# Secrets (pull_secret, activation_key, org_id, oadp_aws_*) belong in
# vault.yaml, not here. Values below override role defaults when the
# same name is used.
#
# Optional role-default overrides are documented at the bottom of this file
# as commented examples - uncomment and adjust as needed.

# Lab L2 network (libvirt default / virbr0). ip_list values are last octets only.
lab_network_prefix: "192.168.122"
lab_network_netmask: "255.255.255.0"
# Reverse zone for lab_network_prefix 192.168.122 — update if you change the prefix.
lab_network_reverse_zone: "122.168.192.in-addr.arpa"

# List of IP Addresses to be used on the KVM Lab.
# Last octets below are combined with lab_network_prefix (e.g. .21 -> 192.168.122.21). Must be two digits (10-99) as last octet is used
# to define mac addresses
ip_list:
  helper_server: 21 
  bootstrap: 30
  master1: 31
  master2: 32
  master3: 33
  worker1: 34
  worker2: 35
  worker3: 36
  hublb: 39
  c1worker1: 41
  c1worker2: 42
  c1worker3: 43
  c1lb: 49
  c2worker1: 51
  c2worker2: 52
  c2worker3: 53
  c2lb: 59
  c3worker1: 54
  c3worker2: 55
  c3worker3: 56
  c3lb: 58
  c2vbmc: 71

  # Hub2 - replacement management/hub cluster used for the OADP
  # backup/restore-to-new-hub DR flow. Kept on its own IP block so it
  # can be built (and its DNS resolved) while hub1 still exists.
  # NOTE: last octet is used raw in the MAC scheme 52:54:00:e2:54:{{ value }},
  # so it must stay a two digit hex-safe value (10-99) - do not use 100+.
  hub2_bootstrap: 80
  hub2_master1: 81
  hub2_master2: 82
  hub2_master3: 83
  hub2_worker1: 84
  hub2_worker2: 85
  hub2_worker3: 86
  hub2lb: 89

  # Mirror registry - shared connected infrastructure for disconnected-install
  # simulation (see setup_mirror_registry.yaml). Stays reachable/connected
  # even when master/worker IPs are cut off from the real internet.
  registry: 22

  # MinIO - local S3-compatible target for OADP backups during
  # disconnected-install simulation (see setup_minio.yaml). Same
  # connected-infrastructure treatment as mirror_registry.
  minio: 23

  # Ceph - 3-node all-in-one + 1-node admin Ceph 9 cluster (see setup_ceph.yaml).
  ceph1: 24
  ceph2: 25
  ceph3: 26
  cephadmin: 27

helper_name: helper
helper_disk: helper_disk.qcow2
helper_memory: 8192 
helper_vcpus: 4
master_memory: 16384
master_cpu: 8
worker_memory: 49152
worker_cpu: 32
hub_worker_replicas: 3

## Variables used by Setup BM Role 

rhel9_kvm_image: "rhel-9.8-x86_64-kvm.qcow2"

basic_packages: 
  - wget
  - vim
  - guestfs-tools
  - libvirt
  - qemu-kvm
  - virt-manager
  - virt-install
  - libguestfs-tools
  - libguestfs-xfs
  - xauth
  - virt-viewer
  - xorg-x11-fonts-*
  - net-tools
  - mlocate
  - sshpass
  - ipmitool
  - python-setuptools
  - tigervnc-server
  - tigervnc
  - python3-pip

##  Variables required by DNS Role 
dns_packages:
  - bind
  - bind-utils
  - vim
  - net-tools

hub_domain: hub.mylab.com
hub2_domain: hub2.mylab.com
hosted_domain: hcp-cluster1.mylab.com
hosted_domain2: hcp-cluster2.mylab.com
hosted_domain3: hcp-cluster3.mylab.com



##  Variables required by Setup-Hub-Cluster Role 
ocp_major_version: 4.21
ocp_minor_version: 15 
coreos_minor_version: 0  # Check https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/ for available rhcos versions for a specific ocp version.
download_dir: /var/lib/libvirt/images/
hub_vm_folder: /var/lib/libvirt/images/hub
hub_install_folder: /var/lib/libvirt/images/hub_install
hub_name: hub
hub2_name: hub2
base_domain: mylab.com

## Variables required by Setup-Hub-Cluster2 Role (the replacement hub
## built for DR/restore testing - new name, new VMs, same base domain)
hub2_vm_folder: /var/lib/libvirt/images/hub2
hub2_install_folder: /var/lib/libvirt/images/hub2_install

## MetalLB IPAddressPool ranges for HCP APIServer/apps VIPs (setup-hub-acm).
## Mapped to metallb_pool_start/end in setup_hub_cluster*.yaml. Ranges must not
## overlap while both hubs share the same L2 network ({{ lab_network_prefix }}.0/24).
hub_metallb_pool_start: 60
hub_metallb_pool_end: 69
hub2_metallb_pool_start: 90
hub2_metallb_pool_end: 99

## Variable for Hosted Cluster1
hosted_cluster_cpu: 4
hosted_cluster_memory: 8512
hosted_cluster_vm_folder: /var/lib/libvirt/images/hosted_cluster


## Variables for Hosted Cluster1
hosted_cluster2_cpu: 4
hosted_cluster2_memory: 8512
hosted_cluster2_vm_folder: /var/lib/libvirt/images/hosted_cluster2

## Variables required by the OADP backup/restore flow
## (roles/setup-oadp, oadp/templates/*, setup_oadp.yaml,
##  backup_hosted_cluster.yaml, restore_hosted_cluster.yaml)
##
## AWS access key id/secret go in vault.yaml as
## oadp_aws_access_key_id / oadp_aws_secret_access_key - never here.
oadp_aws_region: ap-south-1
oadp_bucket_name: adp-backup-bucket-xjt   # S3 bucket names are globally unique - change this before first use
oadp_backup_prefix: hcp-backup
oadp_backup_ttl: 999h0m0s
oadp_bminfra_namespace: bminfra
oadp_storage_location: default

## Which hub's kubeconfig setup_oadp.yaml / backup_hosted_cluster.yaml /
## restore_hosted_cluster.yaml target by default. Override per-run with
## -e target_hub=hub2 once you've cut over (see oadp/README.md).
target_hub: hub

## ---------------------------------------------------------------------------
## Role-default overrides (wired via vars_files in playbooks)
##
## These override roles/setup-hub-acm/defaults and roles/setup-bminfra/defaults.
## Per-playbook role vars still win over vars.yaml when both set the same name.
## ---------------------------------------------------------------------------

## setup-hub-acm: AgentServiceConfig storage and RHCOS live-ISO catalogue.
## Shared by hub1 and hub2. Keep openshiftVersion in sync with bminfra_ocp_version.
agent_service_database_storage: 10Gi
agent_service_filesystem_storage: 100Gi
agent_service_image_storage: 50Gi
agent_service_os_images:
  - openshiftVersion: "4.21"
    version: "4.21.0"
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.21/4.21.0/rhcos-4.21.0-x86_64-live-iso.x86_64.iso"
    cpuArchitecture: "x86_64"
  - openshiftVersion: "4.22"
    version: "4.22.8"
    url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.22/4.22.8/rhcos-4.22.8-x86_64-live-iso.x86_64.iso"
    cpuArchitecture: "x86_64"

## setup-bminfra: bare-metal infra namespace and InfraEnv OCP version.
## osImageVersion must match an entry in agent_service_os_images above.
bminfra_location: singapore
bminfra_ocp_version: '4.21'
discovery_iso_filename: "bminfra-discovery-{{ bminfra_ocp_version }}.iso"
discovery_boot_kernel_filename: "bminfra-discovery-{{ bminfra_ocp_version }}-vmlinuz"
discovery_boot_initrd_filename: "bminfra-discovery-{{ bminfra_ocp_version }}-initrd.img"
discovery_boot_rootfs_filename: "bminfra-discovery-{{ bminfra_ocp_version }}-rootfs.img"

## create-hosted-cluster: HostedCluster/NodePool/ManagedCluster bundle.
## Defaults below match hcp-cluster1. For a second, concurrent hosted
## cluster on the same hub, override hosted_cluster_cluster_cidr and
## hosted_cluster_service_cidr to a disjoint range at minimum.
## release image should correspond to an entry in agent_service_os_images.
hosted_cluster_clusterset: default
hosted_cluster_channel: fast-4.21
hosted_cluster_release_image: "quay.io/openshift-release-dev/ocp-release@sha256:05e69ed54453e3d306b136f52493073073b207f57d0562fe1c8a555bde61aa49"
hosted_cluster_cluster_cidr: 10.132.0.0/14
hosted_cluster_service_cidr: 172.31.0.0/16
hosted_cluster_availability_policy: HighlyAvailable
hosted_cluster_olm_catalog_placement: management
hosted_cluster_nodepool_replicas: 2
hosted_cluster_addon_application_manager: true
hosted_cluster_addon_policy_controller: true
hosted_cluster_addon_search_collector: true
hosted_cluster_addon_cert_policy_controller: true

## setup-mirror-registry-vm / setup-mirror-registry: the standalone VM
## used to simulate a disconnected install (see setup_mirror_registry.yaml).
## disconnected_install gates whether any of this is used at all - default
## false so connected installs are completely unaffected.
disconnected_install: false
mirror_registry_name: registry
mirror_registry_disk: registry_disk.qcow2
mirror_registry_extra_disk: registry_extra_disk.qcow2
mirror_registry_disk_size: 500G
## Partition inside rhel9_kvm_image to expand into all the new space -
## verify against your actual base image with:
##   virt-filesystems --long --parts --blkdevs -h -a <image>
## if you ever change rhel9_kvm_image, since this is image-specific.
mirror_registry_resize_partition: /dev/sda4
mirror_registry_memory: 16384
mirror_registry_vcpus: 8
mirror_registry_domain: "registry.{{ hub_domain }}"
mirror_registry_port: 8443
## mirror_registry_password goes in vault.yaml, not here.
## Dedicated authfile for baremetal's own podman login to the mirror
## registry (see roles/setup-mirror-registry-trust) - kept separate from
## ~/.docker/config.json so this never touches your other registry creds.
mirror_registry_authfile: /root/.docker/config.json
mirror_registry_quay_root: /registry

## OCP release/operators to mirror. Extend catalog_operator_packages with
## any additional operators your disconnected install needs beyond what
## setup-hub-acm already installs (ACM, LVM Storage, MetalLB, OADP).
mirror_ocp_channel: stable-{{ ocp_major_version }}
mirror_ocp_version: "{{ ocp_major_version }}.{{ ocp_minor_version }}"
mirror_catalog_index: "registry.redhat.io/redhat/redhat-operator-index:v{{ ocp_major_version }}"
mirror_catalog_operator_packages:
  - advanced-cluster-management
  - multicluster-engine
  - lvms-operator
  - metallb-operator
  - redhat-oadp-operator
  - cincinnati-operator

## setup-minio-vm / setup-minio: local S3-compatible OADP backup target
## for disconnected-install simulation (see setup_minio.yaml). Also
## gated behind disconnected_install (shared with mirror-registry above).
## minio_root_user / minio_root_password go in vault.yaml, not here.
minio_name: minio
minio_disk: minio_disk.qcow2
minio_disk_size: 100G
## Partition inside rhel9_kvm_image to expand into all the new space -
## same base image/assumption as mirror_registry_resize_partition.
minio_resize_partition: /dev/sda3
minio_memory: 4096
minio_vcpus: 4
minio_domain: "minio.{{ hub_domain }}"
minio_api_port: 9000
minio_console_port: 9001
minio_data_dir: /data/minio
## Bucket OADP will target when running against MinIO instead of real
## AWS S3 - kept distinct from oadp_bucket_name so switching between
## connected/disconnected DPA config is an explicit, visible choice.
minio_bucket_name: adp-backup-disconnected

