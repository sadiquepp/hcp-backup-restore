## Every domain in this file is <label>.<base_domain>, so base_domain (defined
## further down, with the cluster names) is the single place the lab's DNS
## suffix is written. Order does not matter - Ansible resolves these lazily.
hub_domain: "hub.{{ base_domain }}"
hub2_domain: "hub2.{{ base_domain }}"
## Subdomain for the disconnected hub. Must stay in sync with
## hub_disconnected_name below (OpenShift derives the cluster's DNS from
## <metadata.name>.<baseDomain>), and needs a matching zone in
## roles/setup-dns + a forwarder in roles/setup-bm-host's libvirt network.
hub_disconnected_domain: "hubd.{{ base_domain }}"
## Subdomain for the disconnected DR hub, on the same terms as
## hub_disconnected_domain above: it is <hub2_disconnected_name>.<base_domain>,
## because OpenShift derives a cluster's DNS from <metadata.name>.<baseDomain>
## and every cluster in this lab shares base_domain. So it is a sibling of
## hub2_domain rather than a child of it - a zone under hub2_domain would
## mean a different baseDomain for this cluster alone. Needs a matching zone in
## roles/setup-dns and a forwarder in roles/setup-bm-host's libvirt network.
hub2_disconnected_domain: "hub2d.{{ base_domain }}"
hosted_domain: "hcp-cluster1.{{ base_domain }}"
hosted_domain2: "hcp-cluster2.{{ base_domain }}"
hosted_domain3: "hcp-cluster3.{{ base_domain }}"
## Subdomain for the disconnected hosted cluster. Its leading label is the
## HostedCluster name in hosted_clusters_disconnected below - that is what ties
## this zone to the cluster's hosted_cluster_metallb_pools entry, exactly as
## hosted_domain does for hcp-cluster1. Giving it its own zone is what keeps
## api/api-int (and *.apps) for the disconnected cluster distinct from
## hcp-cluster1's, so both can be up at once.
## LEGACY, like hosted_domain/2/3 above: nothing renders from it any more. Every
## hosted cluster zone is derived as <cluster-name>.<base_domain> from
## hosted_clusters + hosted_clusters_disconnected, which is what lets all three
## '-d' clusters have zones without a template per cluster. Kept only for older
## playbooks that still reference it.
hosted_domain_disconnected: "hcp-cluster1-d.{{ base_domain }}"



